<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Chobe Elephant Camp — Assets</title>
<!--
  Assets — vehicles, rooms, trailers and everything else at a lodge.
  Management adds, edits, retires and transfers them here.

  Built 2026-09-12 after Mark chose Option B from
  tools/maintenance/docs/asset-lifecycle-proposal.md: an asset takes its
  open work and its rules to a new lodge, while the record of what was
  already DONE stays where it was done.

  Two rules this page exists to enforce:
   - NOTHING IS EVER DELETED. A vehicle with two years of inspections
     behind it cannot be deleted without destroying that history or
     orphaning it. Retire instead; it leaves the lists and keeps
     everything. Restorable, because things come back.
   - A vehicle bought in Kasane next month should not need a code change.
     Assets are data, the same argument root D-012 made about locations.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:24px 0 4px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  /* Real tap targets, not plain inline text — Mark, 2026-09-16:
     "Schedule Inspection etc are very small for fingers to hit on a
     phone," applied identically on every page (schedule.html first). */
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  #who{font-size:15px;padding:8px 10px}
  @media (max-width:700px){
    .nav{font-size:13px;gap:6px}
    .nav a,.nav b{padding:6px 10px}
    #who{font-size:17px;padding:10px 12px}
  }
  select,input,textarea{padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box;width:100%}
  button{padding:6px 11px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#fff;color:#43594A;border-radius:5px;cursor:pointer}
  button.primary{background:#43594A;color:#fff}
  button.danger{border-color:#A8502F;color:#A8502F}
  /* The sign-in box, same look as the filter boxes on the to-do list,
     Completed Tasks and Fix a Fault — Mark, 2026-09-17: "for the sign
     in on all necessary pages i would like the same look as we did
     for the ordering filters." */
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:12px;background:#fff;margin-top:10px}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 10px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  .filter-section label:first-of-type{margin-top:0}
  /* A checkbox row needs the same real tap target as everything else
     — Mark, 2026-09-17, on the schedule page's Mine checkbox: "too
     small to see easily or hit with your finger," applied the same
     way here. */
  .filter-section label.check{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;padding:4px 0}
  /* Size, then accent-color, then a border — none of it reliable, all
     on the same underlying problem: a native checkbox's own rendering
     is the OS/browser's call, not CSS's. Mark, after the border still
     wasn't enough: "the same problem still exists for the checkboxes."
     Native rendering turned off entirely (appearance:none) and
     replaced with a plain square and a hand-drawn tick instead. */
  .filter-section label.check input[type=checkbox]{
    appearance:none;-webkit-appearance:none;margin:0;
    width:24px;height:24px;flex:none;box-sizing:border-box;
    border:2px solid #43594A;border-radius:4px;
    background:#fff;cursor:pointer;position:relative;
  }
  .filter-section label.check input[type=checkbox]:checked{background:#43594A}
  .filter-section label.check input[type=checkbox]:checked::after{
    content:"";position:absolute;left:7px;top:3px;
    width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  @media (max-width:700px){
    .filter-section label.check{font-size:16px;padding:6px 0}
    .filter-section label.check input[type=checkbox]{width:28px;height:28px}
    .filter-section label.check input[type=checkbox]:checked::after{left:9px;top:4px;width:7px;height:14px}
  }
  @media (min-width:700px){ .signin-box{max-width:420px} }
  .row{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:9px 13px;margin-top:6px}
  .row.retired{opacity:.5;border-style:dashed}
  .row .nm{font-weight:700;margin:0}
  .row .camp{display:inline-block;font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:10px;background:#D9E6DC;color:#2F6B45;margin-right:4px}
  .row .area{display:inline-block;font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:10px;background:#EDE6D6;color:#8C6A2F;margin-right:4px}
  .row .mt{font-size:12px;color:#6B6455;margin:2px 0 0}
  .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .form{background:#FBFAF6;border:1px solid #C9C2AC;border-radius:8px;padding:12px;margin-top:8px}
  .form label{display:block;font-size:11.5px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:9px 0 4px}
  .form label:first-child{margin-top:0}
  .note{font-size:12.5px;color:#6B6455;margin:6px 0 0}
  .warn{font-size:12.5px;color:#A8502F;margin:6px 0 0}
  .hist{margin-top:8px;border-top:1px solid #F1EDE4;padding-top:7px;font-size:12px;color:#6B6455}
  .loading{color:#6B6455;margin-top:18px}
  [hidden]{display:none!important}
</style></head><body>

<h1>Assets — Chobe Elephant Camp</h1>
<p class="sub">Vehicles, rooms and equipment. Nothing here is ever deleted — retiring keeps the history.</p>
<script src="./nav.js"></script>
<div id="navRow"></div>
<script>
  (function () {
    var m = null;
    try { var s = sessionStorage.getItem("bw_signin"); if (s) m = JSON.parse(s); } catch (e) {}
    document.getElementById("navRow").innerHTML = navHtml(m, "Assets");
  })();
</script>

<div class="filter-section signin-box" id="whoSignedIn" hidden>
  <div class="title">Signed in</div>
  <p style="margin:0;font-size:13.5px">As <b id="whoName"></b></p>
  <button class="primary" onclick="signOut()" style="width:100%;margin-top:10px">Sign out</button>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="showRetired"> Show retired</label>
</div>
<div class="filter-section signin-box" id="whoPicker">
  <div class="title">Sign in</div>
  <label for="whoDept">Department</label><select id="whoDept"></select>
  <label for="who">You are</label><select id="who"></select>
  <label for="whoPin">PIN</label><input type="password" id="whoPin" inputmode="numeric" maxlength="6">
  <div id="whoSetPin" hidden><label for="whoNewPin">New PIN (4–6 digits)</label><input type="password" id="whoNewPin" inputmode="numeric" maxlength="6"></div>
  <div id="whoSetPinBtn" hidden style="margin-top:10px"><button onclick="doWhoSetPin()" style="width:100%">Set PIN</button></div>
  <button class="primary" onclick="doWhoLogin()" style="width:100%;margin-top:10px">Sign in</button>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="showRetired2"> Show retired</label>
  <p class="note" id="whoErr" style="color:#A8502F" hidden></p>
</div>

<div id="app"><p class="loading">Loading…</p></div>

<script>
var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
var me = null, people = [], data = null, locations = [], showRetired = false;
var editing = null, transferring = null, historyFor = null, historyRows = [];
// A group-wide roll-up, filterable by camp — per Mark, 2026-09-18:
// "Assets - i think this also needs be visible as a rollup - showing
// all the listed assets for the whole group, or filtered by lodge."
// viewableLocations is just Chobe for an ordinary manager (unchanged
// from before this) — the Camp filter box only appears once there's
// actually more than one camp to choose between.
var viewableLocations = [], filterLocationId = "";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}

// Rooms removed, 2026-09-16 — Mark: "now the rooms are back on -
// please remvove them." A room was always the one kind here that
// could never move between lodges in the first place (real rooms are
// still real data, managed elsewhere — this page is for moveable
// equipment specifically, per the same day's own Backup Generator
// conversation).
var KINDS = [
  ["vehicle", "Vehicles", true],
  ["trailer", "Trailers", true],
  ["asset", "Other equipment", true],
];

function post(action, body){
  return fetch(FN + "?action=" + action, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify(Object.assign({ by_person_id: me && me.id }, body))
  }).then(function(r){return r.json();});
}

window.startAdd = function(kind){ editing = { kind: kind, location_id: filterLocationId || null }; transferring = null; render(); };
window.startEdit = function(kind, id){
  var a = (data[kind] || []).filter(function(x){ return x.id === id; })[0];
  editing = Object.assign({}, a); transferring = null; render();
};
window.cancel = function(){ editing = null; transferring = null; render(); };

window.saveAsset = function(){
  post("save_asset", {
    kind: editing.kind, id: editing.id || null,
    name: el("f_name").value,
    description: el("f_desc") ? el("f_desc").value : null,
    location_id: editing.location_id || null,
  }).then(function(out){
    if (out.error) { alert(out.error); return; }
    editing = null; load();
  });
};

window.retire = function(kind, id, restore){
  var reason = restore ? null : prompt("Why is it leaving? (sold, written off, returned…)");
  if (!restore && reason === null) return;
  post("retire_asset", { kind: kind, id: id, restore: !!restore, reason: reason })
    .then(function(out){ if (out.error) alert(out.error); load(); });
};

window.startTransfer = function(kind, id){
  var a = (data[kind] || []).filter(function(x){ return x.id === id; })[0];
  transferring = Object.assign({}, a); editing = null; render();
};

window.doTransfer = function(){
  post("transfer_asset", {
    kind: transferring.kind, id: transferring.id,
    to_location_id: el("t_to").value,
    transferred_on: el("t_on").value,
    reason: el("t_reason").value,
  }).then(function(out){
    if (out.error) { alert(out.error); return; }
    alert("Moved. " + out.checks_moved + " open check(s), " + out.issues_moved +
          " open fault(s) and " + out.schedules_moved + " schedule(s) went with it.");
    transferring = null; load();
  });
};

window.showHistory = function(kind, id){
  if (historyFor === id) { historyFor = null; render(); return; }
  fetch(FN + "?action=asset_history&kind=" + kind + "&id=" + id)
    .then(function(r){return r.json();})
    .then(function(out){ historyFor = id; historyRows = out.transfers || []; render(); });
};

function assetForm(){
  var isNew = !editing.id;
  return '<div class="form">' +
    '<label>' + (editing.kind === "vehicle" || editing.kind === "trailer" ? "Registration" : "Name or number") + '</label>' +
    '<input type="text" id="f_name" value="' + esc(editing.name || "") + '" placeholder="' +
      (editing.kind === "vehicle" ? "B 121 BWP" : editing.kind === "room" ? "19" : "Generator 2") + '">' +
    (editing.kind === "vehicle"
      ? '<label>Description</label><input type="text" id="f_desc" value="' + esc(editing.description || "") +
        '" placeholder="GD - L/C 2.8 Auto">' +
        '<p class="note">A registration alone is not memorable. This shows beside it everywhere.</p>'
      : "") +
    '<div class="acts"><button class="primary" onclick="saveAsset()">' +
      (isNew ? "Add" : "Save changes") + '</button>' +
    '<button onclick="cancel()">Cancel</button></div></div>';
}

function transferForm(){
  var today = new Date().toISOString().slice(0,10);
  return '<div class="form">' +
    '<label>Moving to</label><select id="t_to">' +
    locations.map(function(l){ return '<option value="' + esc(l.id) + '">' + esc(l.name) + '</option>'; }).join("") +
    '</select>' +
    '<label>Moved on</label><input type="date" id="t_on" value="' + today + '">' +
    '<label>Why</label><input type="text" id="t_reason" placeholder="e.g. reassigned after fleet reduction">' +
    '<p class="warn">Its open faults, open checks and schedules go with it. Everything already done stays on ' +
      'the record at the lodge where it happened, and any check assigned to a named person here is unassigned.</p>' +
    '<div class="acts"><button class="primary" onclick="doTransfer()">Transfer</button>' +
    '<button onclick="cancel()">Cancel</button></div></div>';
}

// Only shown once there's actually more than one camp to choose
// between — an ordinary manager's own viewableLocations is just
// Chobe, so this stays invisible and nothing about the page changes
// for them. Per Mark, 2026-09-18: "showing all the listed assets for
// the whole group, or filtered by lodge."
function campFilterHtml(){
  if (viewableLocations.length < 2) return "";
  return '<div class="filter-section" style="max-width:300px"><div class="title">Camp</div>' +
    '<label>Site</label><select id="campFilter" onchange="onLocationFilterChange()">' +
    '<option value="">All camps you can see</option>' +
    viewableLocations.map(function(l){
      return '<option value="' + esc(l.id) + '"' + (filterLocationId === l.id ? " selected" : "") + '>' + esc(l.name) + '</option>';
    }).join("") + '</select></div>';
}

function render(){
  var h = campFilterHtml();
  KINDS.forEach(function(k){
    var kind = k[0], title = k[1], movable = k[2];
    // This page is for moveable equipment, not what's fixed to a
    // lodge — per Mark, 2026-09-16: "this page must reflect moveable
    // assets not fixed assets. so we can remove them from the asset
    // sheet." A row's own movable flag (only "Other equipment" can be
    // either) wins over the kind's own default.
    var all = (data[kind] || []).filter(function(a){ return a.movable !== false; });
    var list = showRetired ? all : all.filter(function(a){ return !a.retired; });
    var retiredCount = all.filter(function(a){ return a.retired; }).length;

    h += '<h2>' + esc(title) + ' <span style="color:#8C6A2F;font-weight:400">' + list.length +
      (retiredCount && !showRetired ? " · " + retiredCount + " retired" : "") + '</span></h2>';

    // Visible to all management, editable only by administrators — per
    // Mark, 2026-09-18: "Assets and Staff - visible to all management
    // but not editable" and "visible and editable to all managers who
    // are administrators." Edit/Transfer/Retire/Add all gate on
    // is_administrator now; History stays open to any manager, since
    // just looking at a transfer record isn't the thing being locked
    // down. The server enforces the same split — not just this hiding.
    if (me && me.is_administrator && !(editing && editing.kind === kind && !editing.id)) {
      // Which camp a new row belongs to is ambiguous while looking at
      // "All camps" — pick a specific one in the Camp filter first,
      // rather than guessing (or silently defaulting to Chobe the way
      // an ordinary single-camp manager never has to think about).
      if (viewableLocations.length > 1 && !filterLocationId) {
        h += '<p class="note">Pick a camp above to add ' + esc(title.toLowerCase()) + ' there.</p>';
      } else {
        h += '<div class="acts"><button onclick="startAdd(\'' + kind + '\')">+ Add</button></div>';
      }
    }
    if (editing && editing.kind === kind && !editing.id) h += assetForm();

    list.forEach(function(a){
      h += '<div class="row' + (a.retired ? " retired" : "") + '">' +
        '<p class="nm">' +
        (viewableLocations.length > 1 ? '<span class="camp">' + esc(a.location) + '</span> ' : "") +
        (a.area ? '<span class="area">' + esc(a.area) + '</span> ' : "") +
        esc(a.name) + (a.description ? ' — ' + esc(a.description) : "") +
        (a.retired ? " · retired" : "") + '</p>' +
        (a.retired && a.retired_reason ? '<p class="mt">' + esc(a.retired_reason) + '</p>' : "");
      if (editing && editing.id === a.id) { h += assetForm(); }
      else if (transferring && transferring.id === a.id) { h += transferForm(); }
      else if (me && me.is_manager) {
        h += '<div class="acts">';
        if (me.is_administrator) {
          h += '<button onclick="startEdit(\'' + kind + '\',\'' + a.id + '\')">Edit</button>';
          if (movable && !a.retired) h += '<button onclick="startTransfer(\'' + kind + '\',\'' + a.id + '\')">Transfer</button>';
        }
        if (movable) h += '<button onclick="showHistory(\'' + kind + '\',\'' + a.id + '\')">' +
          (historyFor === a.id ? "Hide history" : "History") + '</button>';
        if (me.is_administrator) {
          h += a.retired
            ? '<button onclick="retire(\'' + kind + '\',\'' + a.id + '\',true)">Restore</button>'
            : '<button class="danger" onclick="retire(\'' + kind + '\',\'' + a.id + '\')">Retire</button>';
        }
        h += '</div>';
      }
      if (historyFor === a.id) {
        h += '<div class="hist">' + (historyRows.length
          ? historyRows.map(function(t){
              return '<p>' + esc(t.on) + " — " + esc(t.from) + " → " + esc(t.to) +
                (t.reason ? ", " + esc(t.reason) : "") + " (" + esc(t.by) + ")</p>";
            }).join("")
          : "<p>Never moved.</p>") + '</div>';
      }
      h += '</div>';
    });
    if (!list.length) h += '<p class="note">None' + (retiredCount ? " showing" : "") + '.</p>';
  });
  el("app").innerHTML = h;
}

// Visible to management, invisible to everyone else — per Mark,
// 2026-09-18. Enforced here (so the page doesn't even try to show
// data it shouldn't) and on the server (so a direct API call is
// refused too, not just this page's own hiding of it).
function load(){
  if (!me) {
    el("app").innerHTML = '<p class="note">Sign in as management to view this.</p>';
    return Promise.resolve();
  }
  if (!me.is_manager) {
    el("app").innerHTML = '<p class="note">Only management can view this.</p>';
    return Promise.resolve();
  }
  var url = FN + "?action=assets_list&person_id=" + encodeURIComponent(me.id);
  if (filterLocationId) url += "&location_id=" + encodeURIComponent(filterLocationId);
  return fetch(url)
    .then(function(r){return r.json();}).then(function(d){
      if (d.error) { el("app").innerHTML = '<p class="note">' + esc(d.error) + '</p>'; return; }
      data = d; locations = d.locations || []; viewableLocations = d.viewable_locations || []; render();
    });
}

window.onLocationFilterChange = function(){
  filterLocationId = el("campFilter").value;
  editing = null; transferring = null;
  load();
};

el("showRetired").addEventListener("change", function(){ showRetired = this.checked; render(); });

// Department first, then name — per Mark, 2026-09-17, once the real
// staff list made this dropdown long: "the list is very long - i think
// we need some filter options to shorten the list. department picker -
// then name picker." Never hides anyone with no department set.
function renderWhoOptions(deptFilter){
  var shown = !deptFilter ? people : people.filter(function(p){ return p.department === deptFilter; });
  el("who").innerHTML = '<option value="">— nobody —</option>' + shown.map(function(p){
    return '<option value="' + esc(p.id) + '" data-pin-set="' + p.pin_set + '">' + esc(p.name) + (p.is_manager ? " (management)" : "") + '</option>';
  }).join("");
  el("who").onchange = function(){
    var opt = el("who").selectedOptions[0];
    var need = !!opt && opt.dataset.pinSet === "false";
    el("whoSetPin").hidden = !need; el("whoSetPinBtn").hidden = !need;
  };
}

// Group-wide PIN sign-in — per Mark, 2026-09-17: "I would like the
// group wide sign in option... doing this once now solves the problem
// of identifying who worked on something right now." Kept only in
// sessionStorage, clearing the moment the tab or browser closes — the
// same reasoning Edit Checklists' own Administrator sign-in already
// had (D-037), generalised to any real person.
window.doWhoSetPin = function(){
  var id = el("who").value, pin = el("whoNewPin").value;
  fetch(FN + "?action=set_pin", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ person_id: id, pin: pin }),
  }).then(function(r){return r.json();}).then(function(out){
    if (out.error) { alert(out.error); return; }
    el("whoSetPin").hidden = true; el("whoSetPinBtn").hidden = true;
    el("whoPin").value = pin;
    alert("PIN set. Sign in below.");
  });
};
window.doWhoLogin = function(){
  var id = el("who").value, pin = el("whoPin").value;
  var err = el("whoErr"); err.hidden = true;
  if (!id || !pin) { err.textContent = "Pick your name and enter your PIN."; err.hidden = false; return; }
  fetch(FN + "?action=login", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ person_id: id, pin: pin }),
  }).then(function(r){return r.json();}).then(function(out){
    if (out.error) { err.textContent = out.error; err.hidden = false; return; }
    me = { id: out.person_id, name: out.name, department: out.department, is_manager: out.is_manager, is_administrator: out.is_administrator };
    sessionStorage.setItem("bw_signin", JSON.stringify(me));
    showSignedIn();
  });
};
window.signOut = function(){
  sessionStorage.removeItem("bw_signin");
  location.reload();
};
function showSignedIn(){
  el("whoPicker").hidden = true;
  el("whoSignedIn").hidden = false;
  el("whoName").textContent = me.name;
  el("showRetired").parentElement.hidden = !me.is_manager;
  load();
}

fetch(FN).then(function(r){return r.json();}).then(function(b){
  people = b.people || [];
  var deptNames = (b.departments || []).map(function(d){ return d.name; })
    .filter(function(n){ return people.some(function(p){ return p.department === n; }); });
  el("whoDept").innerHTML = '<option value="">All departments</option>' +
    deptNames.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("");
  el("whoDept").addEventListener("change", function(){ renderWhoOptions(this.value); });
  renderWhoOptions("");
  try {
    var saved = sessionStorage.getItem("bw_signin");
    if (saved) { me = JSON.parse(saved); showSignedIn(); return; }
  } catch (e) {}
  return load();
}).catch(function(e){ el("app").innerHTML = '<p class="loading">Could not load: ' + esc(e) + '</p>'; });
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
