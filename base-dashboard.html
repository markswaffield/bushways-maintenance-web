<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Bush Ways — Base Dashboard</title>
<!--
  Base Dashboard — rebuilt into a clean hub, 2026-09-18, once Mark
  tried the combined roll-up-and-picker version and preferred a real
  split: "i would prefer to try it my way - i feel that it is more
  logical this way. i think it avoids confusion as to what lodge you
  are in as you physically move back to a selector page that does not
  have all the standard boxes of Schedule - To-do-List etc. It seems
  like a cleaner way to work."

  His own shape: "after signing in you get 2 options: A - Roll Up
  Summary of all Camps with its Filters. B - Lodge Management - with
  a dropdown list of all the lodge entities. If you choose B and a
  lodge entity - you then go straight to the management page for that
  lodge... You then have an option of going back to PAGE B - where you
  can switch to another camp if needed."

  This page is exactly that — nothing else on it. Option A links out
  to `base-rollup.html` (the actual roll-up, D-052's own page,
  untouched apart from losing the "enter a camp" button it used to
  carry). Option B is the dropdown + Go, which sets `bw_camp` and
  sends the browser to Schedule — every other real page (Schedule,
  Inspection, the to-do list, Fix a Fault, Completed) then reads that
  camp back automatically for the rest of the session (D-053). "Change
  camp," wherever it appears, comes straight back to this same page —
  never to the roll-up.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:14px;margin:0 0 6px;color:#43594A}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  @media (max-width:700px){
    .nav{font-size:16px;gap:8px}
    .nav a,.nav b{padding:11px 15px}
  }
  select,input,textarea{padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box;width:100%}
  input[type=password]{padding:8px;font-size:14px}
  button{padding:6px 11px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#fff;color:#43594A;border-radius:5px;cursor:pointer}
  button.primary{background:#43594A;color:#fff}
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:12px;background:#fff;margin-top:10px}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 10px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  .filter-section label:first-of-type{margin-top:0}
  @media (min-width:700px){ .signin-box{max-width:420px} }
  /* Option A and Option B, side by side on a wide screen, stacked on
     a phone — the same shape every other filter row here already
     uses (dashboard.html first). */
  .choices{display:flex;flex-direction:column;gap:14px;margin-top:18px;max-width:640px}
  @media (min-width:700px){ .choices{flex-direction:row} }
  .choice{flex:1;background:#fff;border:1px solid #C9C2AC;border-radius:10px;padding:18px}
  .choice h2{margin:0 0 6px}
  .choice p{font-size:13px;color:#6B6455;margin:0 0 14px}
  .choice .letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:700;border-radius:50%;background:#EAF1EC;color:#43594A;margin-right:6px}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  [hidden]{display:none!important}
</style></head><body>

<h1>Base Dashboard</h1>
<p class="sub">Pick how you want to work — every camp at once, or go and work at one directly.</p>
<p class="nav"><a href="./">Schedule</a><a href="./inspection.html">Inspection</a><a href="./dashboard.html">To-do list</a><a href="./fix.html">Fix a fault</a><a href="./completed.html">Completed</a><a href="./assets.html">Assets</a><a href="./staff.html">Staff</a><a href="./admin-checklists.html">Edit Checklists</a><b>Base Dashboard</b></p>

<div class="filter-section signin-box" id="whoSignedIn" hidden>
  <div class="title">Signed in</div>
  <p style="margin:0;font-size:13.5px">As <b id="whoName"></b></p>
  <button class="primary" onclick="signOut()" style="width:100%;margin-top:10px">Sign out</button>
</div>
<div class="filter-section signin-box" id="whoPicker">
  <div class="title">Sign in</div>
  <label for="whoDept">Department</label><select id="whoDept"></select>
  <label for="who">You are</label><select id="who"></select>
  <label for="whoPin">PIN</label><input type="password" id="whoPin" inputmode="numeric" maxlength="6">
  <div id="whoSetPin" hidden><label for="whoNewPin">New PIN (4–6 digits)</label><input type="password" id="whoNewPin" inputmode="numeric" maxlength="6"></div>
  <div id="whoSetPinBtn" hidden style="margin-top:10px"><button onclick="doWhoSetPin()" style="width:100%">Set PIN</button></div>
  <button class="primary" onclick="doWhoLogin()" style="width:100%;margin-top:10px">Sign in</button>
  <p class="note" id="whoErr" style="color:#A8502F;font-size:12.5px;margin:8px 0 0" hidden></p>
</div>

<div id="app"><p class="empty">Sign in above to see your options.</p></div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var me = null, bootPeople = [], bootDepartments = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Department first, then name — same picker every other sign-in page
  // uses, D-045/2026-09-17.
  function renderPersonOptions(deptFilter) {
    var sel = document.getElementById("who");
    var shown = !deptFilter ? bootPeople : bootPeople.filter(function (p) { return p.department === deptFilter; });
    sel.innerHTML = '<option value="">Select your name</option>' + shown.map(function (p) {
      return '<option value="' + esc(p.id) + '" data-pin-set="' + p.pin_set + '">' + esc(p.name) + (p.department ? " — " + esc(p.department) : "") + '</option>';
    }).join("");
    sel.onchange = function () {
      var opt = sel.selectedOptions[0];
      var need = !!opt && opt.dataset.pinSet === "false";
      document.getElementById("whoSetPin").hidden = !need;
      document.getElementById("whoSetPinBtn").hidden = !need;
    };
  }

  window.doWhoSetPin = function () {
    var id = document.getElementById("who").value;
    var pin = document.getElementById("whoNewPin").value;
    fetch(FN + "?action=set_pin", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ person_id: id, pin: pin }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      document.getElementById("whoSetPin").hidden = true;
      document.getElementById("whoSetPinBtn").hidden = true;
      document.getElementById("whoPin").value = pin;
      alert("PIN set. Sign in below.");
    });
  };
  window.doWhoLogin = function () {
    var id = document.getElementById("who").value;
    var pin = document.getElementById("whoPin").value;
    var err = document.getElementById("whoErr");
    err.hidden = true;
    if (!id || !pin) { err.textContent = "Pick your name and enter your PIN."; err.hidden = false; return; }
    fetch(FN + "?action=login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ person_id: id, pin: pin }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { err.textContent = out.error; err.hidden = false; return; }
      me = { id: out.person_id, name: out.name, is_manager: out.is_manager, is_administrator: out.is_administrator, locations: out.locations || [] };
      sessionStorage.setItem("bw_signin", JSON.stringify(me));
      showSignedIn();
    });
  };
  window.signOut = function () {
    sessionStorage.removeItem("bw_signin");
    sessionStorage.removeItem("bw_camp");
    location.reload();
  };
  function showSignedIn() {
    document.getElementById("whoPicker").hidden = true;
    document.getElementById("whoSignedIn").hidden = false;
    document.getElementById("whoName").textContent = me.name;
    render();
  }

  // Just the two real choices, nothing else — Mark, 2026-09-18: "A -
  // Roll Up Summary of all Camps with its Filters. B - Lodge
  // Management - with a dropdown list of all the lodge entities."
  // `me.locations` comes straight off login() (D-052's own two-tier
  // access check) — no separate fetch needed to know which camps this
  // person can actually see.
  function render() {
    var app = document.getElementById("app");
    if (!me) { app.innerHTML = '<p class="empty">Sign in above to see your options.</p>'; return; }
    if (!me.locations || me.locations.length < 2) {
      app.innerHTML = '<p class="empty">Nothing to choose — you only work at one camp.</p>';
      return;
    }
    app.innerHTML =
      '<div class="choices">' +
        '<div class="choice">' +
          '<h2><span class="letter">A</span>Roll-up summary</h2>' +
          '<p>Every open fault and outstanding schedule, across every camp you can see, filterable by camp, date, area and department.</p>' +
          '<a href="./base-rollup.html"><button class="primary" style="width:100%">View all camps →</button></a>' +
        '</div>' +
        '<div class="choice">' +
          '<h2><span class="letter">B</span>Lodge management</h2>' +
          '<p>Go straight to one camp\'s own Schedule, Inspection, To-do list, Fix a Fault and Completed — stays that camp until you come back here to change it.</p>' +
          '<label for="lodgeSelect">Lodge</label><select id="lodgeSelect">' +
            me.locations.map(function (l) { return '<option value="' + esc(l.id) + '" data-name="' + esc(l.name) + '">' + esc(l.name) + '</option>'; }).join("") +
          '</select>' +
          '<button class="primary" onclick="goToLodge()" style="width:100%;margin-top:10px">Go →</button>' +
        '</div>' +
      '</div>';
  }

  window.goToLodge = function () {
    var sel = document.getElementById("lodgeSelect");
    var opt = sel.selectedOptions[0];
    sessionStorage.setItem("bw_camp", JSON.stringify({ id: opt.value, name: opt.dataset.name }));
    location.href = "./";
  };

  fetch(FN + "?action=base_dashboard_people").then(function (r) { return r.json(); }).then(function (b) {
    bootPeople = b.people || [];
    bootDepartments = b.departments || [];
    var deptNames = bootDepartments.map(function (d) { return d.name; })
      .filter(function (n) { return bootPeople.some(function (p) { return p.department === n; }); });
    var deptSel = document.getElementById("whoDept");
    deptSel.innerHTML = '<option value="">All departments</option>' +
      deptNames.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("");
    deptSel.onchange = function () { renderPersonOptions(deptSel.value); };
    renderPersonOptions("");
    try {
      var saved = sessionStorage.getItem("bw_signin");
      if (saved) { me = JSON.parse(saved); showSignedIn(); return; }
    } catch (e) {}
  }).catch(function (e) {
    document.getElementById("app").innerHTML = "<p>Couldn't load — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
  });
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
