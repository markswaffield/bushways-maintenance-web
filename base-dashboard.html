<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Bush Ways — Base Dashboard</title>
<!--
  Base Dashboard — rebuilt into a clean hub, 2026-09-18, once Mark
  tried the combined roll-up-and-picker version and preferred a real
  split: "i would prefer to try it my way - i feel that it is more
  logical this way. i think it avoids confusion as to what lodge you
  are in as you physically move back to a selector page that does not
  have all the standard boxes of Schedule - To-do-List etc. It seems
  like a cleaner way to work."

  His own shape: "after signing in you get 2 options: A - Roll Up
  Summary of all Camps with its Filters. B - Lodge Management - with
  a dropdown list of all the lodge entities. If you choose B and a
  lodge entity - you then go straight to the management page for that
  lodge... You then have an option of going back to PAGE B - where you
  can switch to another camp if needed."

  This page is exactly that — nothing else on it. Option A links out
  to `base-rollup.html` (the actual roll-up, D-052's own page,
  untouched apart from losing the "enter a camp" button it used to
  carry). Option B is the dropdown + Go, which sets `bw_camp` and
  sends the browser to Schedule — every other real page (Schedule,
  Inspection, the to-do list, Fix a Fault, Completed) then reads that
  camp back automatically for the rest of the session (D-053). "Change
  camp," wherever it appears, comes straight back to this same page —
  never to the roll-up.
-->
<style>
  /* The background photo — Mark, 2026-09-18: "i have added an image
     into notes - it is a hyena. would it be possible to have this
     sitting behind the sign in block and dashboard block on those
     pages? and can we set it up that we can change the image at a
     later date?" Same file, same treatment as landing.html — see the
     comment there for the source and how to swap it later.
     TO CHANGE IT LATER: replace supabase/web/images/hero.jpg (both
     this page and landing.html reference that one filename — keep
     them in sync if it's ever swapped). */
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;color:#F7F5F0;
    background:linear-gradient(rgba(18,45,49,.72),rgba(18,45,49,.72)),url('./images/hero.jpg') top center/cover no-repeat;
    background-color:#122d31;min-height:100vh}
  h1{font-size:19px;margin:0 0 4px;color:#fff}
  h2{font-size:14px;margin:0 0 6px;color:#43594A}
  .sub{color:#D8D2C4;font-size:13px;margin:0 0 4px}
  select,input,textarea{padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box;width:100%}
  input[type=password]{padding:8px;font-size:14px}
  button{padding:6px 11px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#fff;color:#43594A;border-radius:5px;cursor:pointer}
  button.primary{background:#43594A;color:#fff}
  /* color:#232019 here, not left to inherit — body's own text colour is
     now light (it sits on the dark photo, above), which would otherwise
     leave any plain text inside this white card just as light, and
     therefore invisible against it. Caught live: "As Mark Swaffield"
     rendered nearly white-on-white until this. */
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:12px;background:#fff;margin-top:10px;color:#232019}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 10px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  .filter-section label:first-of-type{margin-top:0}
  @media (min-width:700px){ .signin-box{max-width:420px} }
  /* Option A and Option B, side by side on a wide screen, stacked on
     a phone — the same shape every other filter row here already
     uses (dashboard.html first). */
  .choices{display:flex;flex-direction:column;gap:14px;margin-top:18px;max-width:640px}
  @media (min-width:700px){ .choices{flex-direction:row} }
  .choice{flex:1;background:#fff;border:1px solid #C9C2AC;border-radius:10px;padding:18px;color:#232019}
  .choice h2{margin:0 0 6px}
  .choice p{font-size:13px;color:#6B6455;margin:0 0 14px}
  .choice .letter{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:700;border-radius:50%;background:#EAF1EC;color:#43594A;margin-right:6px}
  .empty{color:#E8C892;font-size:13.5px;font-style:italic;margin-top:10px}
  [hidden]{display:none!important}
</style></head><body>

<h1>Base Dashboard</h1>
<p class="sub">Pick how you want to work — every camp at once, or go and work at one directly.</p>
<!-- No nav row here on purpose — 2026-09-18, Mark: "We do not need the
     menu buttons on the Dashboard as you choose to go into a lodge -
     so they are redundant here." Every other real page carries one;
     this one exists specifically to pick where you're going before
     any of those pages make sense to show. The .nav CSS is gone from
     this page's own style block too, not just unused. -->


<!-- Sign-in itself now happens once, on the landing page (index.html) —
     Mark, 2026-09-18: "when i click on the app - I want to go to a blank
     sign in screen... if Base Management I go to the Dashboard with the
     2 options." This page only ever runs for someone already signed in
     and already known to be Base Management (the landing page routes
     everyone else straight to their own lodge); arriving here with no
     session sends you back there instead of showing a picker. -->
<div class="filter-section signin-box" id="whoSignedIn">
  <div class="title">Signed in</div>
  <p style="margin:0;font-size:13.5px">As <b id="whoName"></b></p>
  <!-- Mark, 2026-09-18: "we need a button that takes you back to the
       page where you can select which tool you want to work with."
       Deliberately not signOut() — it stays the same signed-in
       session, just back to the group's own tool picker (root
       D-025/D-026). route() there routes a Base Manager straight back
       to that same picker on its own, resumed session or not, so a
       plain link to "./" is all this needs. -->
  <button onclick="location.href='./'" style="width:100%;margin-top:10px">← Change tool</button>
  <button class="primary" onclick="signOut()" style="width:100%;margin-top:8px">Sign out</button>
</div>

<div id="app"><p class="empty">Loading…</p></div>

<script>
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var me = null;
  try { var saved = sessionStorage.getItem("bw_signin"); if (saved) me = JSON.parse(saved); } catch (e) {}

  window.signOut = function () {
    sessionStorage.removeItem("bw_signin");
    sessionStorage.removeItem("bw_camp");
    location.href = "./";
  };

  if (!me) {
    location.href = "./";
  } else {
    document.getElementById("whoName").textContent = me.name;
    render();
  }

  // Just the two real choices, nothing else — Mark, 2026-09-18: "A -
  // Roll Up Summary of all Camps with its Filters. B - Lodge
  // Management - with a dropdown list of all the lodge entities."
  // `me.locations` comes straight off login() (D-052's own two-tier
  // access check) — no separate fetch needed to know which camps this
  // person can actually see.
  function render() {
    var app = document.getElementById("app");
    if (!me.locations || me.locations.length < 2) {
      app.innerHTML = '<p class="empty">Nothing to choose — you only work at one camp.</p>';
      return;
    }
    app.innerHTML =
      '<div class="choices">' +
        '<div class="choice">' +
          '<h2><span class="letter">A</span>Roll-up summary</h2>' +
          '<p>Every open fault and outstanding schedule, across every camp you can see, filterable by camp, date, area and department.</p>' +
          '<button class="primary" style="width:100%" onclick="location.href=\'./base-rollup.html\'">View all camps →</button>' +
        '</div>' +
        '<div class="choice">' +
          '<h2><span class="letter">B</span>Lodge management</h2>' +
          '<p>Go straight to one camp\'s own Schedule, Inspection, To-do list, Fix a Fault and Completed — stays that camp until you come back here to change it.</p>' +
          '<label for="lodgeSelect">Lodge</label><select id="lodgeSelect">' +
            me.locations.map(function (l) { return '<option value="' + esc(l.id) + '" data-name="' + esc(l.name) + '">' + esc(l.name) + '</option>'; }).join("") +
          '</select>' +
          '<button class="primary" onclick="goToLodge()" style="width:100%;margin-top:10px">Go →</button>' +
        '</div>' +
      '</div>';
  }

  window.goToLodge = function () {
    var sel = document.getElementById("lodgeSelect");
    var opt = sel.selectedOptions[0];
    sessionStorage.setItem("bw_camp", JSON.stringify({ id: opt.value, name: opt.dataset.name }));
    location.href = "./schedule.html";
  };
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
