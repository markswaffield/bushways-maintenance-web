<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Bush Ways — Sign in</title>
<!--
  The new front door — deployed as index.html, replacing schedule.html
  in that spot. Mark, 2026-09-18, after the split hub still wasn't it:
  "when i click on the app - I want to go to a blank sign in screen -
  it should not have any other blocks or links available. sigining in
  then will determine which page i next land on. if Base Management I
  go to the Dashboard with the 2 options. anyone else will land on the
  their lodge page with all the task blocks availlable."

  So: nothing here but sign-in. No nav, no filters, no other content.
  Resuming a session (bw_signin already in sessionStorage) redirects the
  same way signing in fresh does — this page is never itself "landed
  on" by someone already known. The routing rule is the one line that
  matters: `me.locations.length > 1` (real multi-camp access, D-052)
  goes to base-dashboard.html; everyone else goes straight into their
  one lodge's Schedule, fully loaded, per his own two-tier design.
-->
<style>
  /* The background photo — Mark, 2026-09-18: "i have added an image
     into notes - it is a hyena. would it be possible to have this
     sitting behind the sign in block... and can we set it up that we
     can change the image at a later date?" His own photograph
     (notes/_CW_7957.CR3 — a Canon raw file; the JPEG preview embedded
     inside it is what's actually used here, extracted rather than
     asking him to export one by hand), resized and recompressed for
     the web at ./images/hero.jpg.
     TO CHANGE IT LATER: replace supabase/web/images/hero.jpg with a
     new photo (roughly 1920px on the long side, JPEG, under ~500KB
     keeps it light on a slow connection) and deploy as normal — no
     other change needed, this page and base-dashboard.html both just
     reference that one filename. Same file, same treatment, on
     base-dashboard.html — keep both in sync if it's ever swapped. */

  /* The photograph was being flattened under a single flat teal wash at 72%,
     which is where Mark's "strange green tinge" came from — #122d31 is a teal,
     and laid evenly over a warm golden-hour picture it drains the light out of
     it and leaves everything a uniform green-grey.
     Two changes: the veil is a near-neutral dark rather than teal, so it
     darkens without colouring; and it is a radial gradient, heaviest behind
     the words in the middle and lifting towards the edges, so the grass and
     the animal still read as the warm photograph they are. */
  /* Sitting high rather than dead centre — Mark, 2026-09-30: "can we move the
     blocks up - then we can see the image behind better?" Centred, the card
     split the photograph in half and left two thin strips of it; up here the
     picture reads as one whole thing below the panel. Applies to the sign-in
     card and the tool picker alike, since both live in this same .wrap. */
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;color:#F7F5F0;
    padding:clamp(18px,6vh,72px) 16px 28px;
    min-height:100vh;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:center;
    position:relative;background-color:#122d31}
  /* The photograph and the veil are two layers rather than one stacked
     background, so the picture itself can be colour-corrected. Flattening a
     warm golden-hour photograph under a single teal wash is what produced the
     green cast; a veil alone could only ever make it darker or lighter, never
     warmer. Here the image gets its saturation and warmth back, and the veil
     sits above it doing nothing but holding contrast behind the words. */
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    /* Aimed at the animal rather than the middle of the frame. On a wide
       screen the picture is height-constrained and this changes nothing; on a
       phone it is width-constrained and it is the difference between the
       hyena and a patch of grass. */
    background:url('./images/hero.jpg') 55% 42%/cover no-repeat;
    filter:saturate(1.32) contrast(1.09) brightness(1.05) sepia(.08)}
  /* A phone is so much taller than it is wide that `cover` on a landscape
     photograph shows a narrow vertical slice of it — which is why the old one
     showed a leg and some grass. This is a portrait crop with the hyena high
     in the frame, so it reads ABOVE the sign-in card rather than behind it.
     Only phones pay for it; wider screens never load it. */
  @media (max-width:560px){
    body::before{background-image:url('./images/hero-phone.jpg');background-position:50% 30%}
  }
  /* Lightened again, 2026-09-29 — Mark: "better but still too dark". The veil
     now only has to hold the two lines of type above the card; the card itself
     is white and needs no help. So it is concentrated behind the words at the
     top and falls away quickly, leaving most of the photograph nearly clear. */
  /* Balanced against the two lines of white type at the top, which are the
     only things on this page that need the photograph held back. Lightened
     once for "still too dark", then brought back up when the type stopped
     being readable against pale grass — this is the point where the picture
     is clearly a picture and the words are clearly words. */
  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(105% 70% at 50% 26%,
                 rgba(6,16,18,.62) 0%, rgba(6,16,18,.46) 42%,
                 rgba(6,16,18,.26) 74%, rgba(6,16,18,.10) 100%)}
  .wrap{width:100%;max-width:360px}
  /* The wordmark is the real artwork, not type.
     Mark asked for the title to match the logo's font; the logo PDF turned out
     to carry no font at all — the lettering is outlined vector art, so there
     is no typeface to match and setting Noto Sans Black was only ever a guess
     that looked close and was not. This is the wordmark itself, cut from
     bushways/brand/images/BushWays_Lodges_HighRes(Inverse).pdf (BUSH and WAYS
     only — no LODGES, no hyena) and recoloured white on transparent.
     The <h1> keeps the words so screen readers, search and the browser tab
     still read "Bush Ways"; the image replaces them visually. */
  h1{margin:0 0 14px;text-align:center;line-height:0}
  h1 img{width:min(72vw,280px);height:auto;display:inline-block;
         filter:drop-shadow(0 2px 16px rgba(0,0,0,.6)) drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  h1 span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  /* Nothing uses this now — Mark, 2026-09-30: "please remove the sign in to
     continue". The panel titles itself (SIGN IN / CHOOSE A TOOL), so the line
     repeated what was already on screen, and once signed in it contradicted
     it. Kept as a rule in case a real strapline is ever wanted here. */
  .sub{color:#F2ECE0;font-size:14px;margin:0 0 22px;text-align:center;
       letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 14px rgba(0,0,0,.55)}
  /* color:#232019 here, not left to inherit — body's own text colour is
     now light (it sits on the dark photo, above); any plain text ever
     added inside this white card would otherwise be just as light, and
     invisible against it. Same real bug caught on base-dashboard.html's
     "Signed in" card, fixed here pre-emptively before it could recur. */
  .signin-box{border:1px solid #C9C2AC;border-radius:8px;padding:16px;background:#fff;color:#232019}
  .signin-box .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 12px}
  label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  label:first-of-type{margin-top:0}
  select,input[type=password]{width:100%;padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box}
  /* Same size and weight as the Maintenance Dashboard's own buttons — Mark,
     2026-09-29: "Sign In needs to be a padded button as well like that on the
     Maintenance Dashboard." This is the first thing anybody touches in the
     tool, often outdoors on a phone, so it should not be the smallest target
     in it. */
  button{width:100%;margin-top:10px;padding:13px 18px;font-size:16px;font-weight:600;
         border:1px solid #43594A;border-radius:8px;background:#43594A;color:#fff;cursor:pointer}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344;font-weight:400}
  button.signout{background:#F4E3D3;border-color:#8C6A2F;color:#4A3620}
  .pickwho{margin:18px 0 0;padding-top:12px;border-top:1px solid #E6E0D0;font-size:13px;color:#5B5344}
  .err{color:#A8502F;font-size:12.5px;margin:8px 0 0}
  .loading{color:#D8D2C4;font-size:14px;text-align:center;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<div class="wrap">
  <h1><img src="./images/bushways-wordmark-white.png" alt="Bush Ways"><span>Bush Ways</span></h1>

  <div id="signinBox" class="signin-box" hidden>
    <div class="title">Sign in</div>
    <label>Lodge</label><select id="whoLoc" onchange="onWhoLoc()"></select>
    <label>Department</label><select id="whoDept" disabled></select>
    <label>You are</label><select id="who" disabled></select>
    <label>PIN</label><input type="password" id="whoPin" inputmode="numeric" maxlength="6" placeholder="4–6 digits">
    <span id="whoSetPin" hidden><label>New PIN</label><input type="password" id="whoNewPin" inputmode="numeric" maxlength="6">
      <button class="secondary" onclick="doWhoSetPin()">Set PIN</button></span>
    <button onclick="doWhoLogin()">Sign in</button>
    <p class="err" id="whoErr" hidden></p>
  </div>

  <!-- The group's own tool picker — root D-025/D-026, 2026-09-18. Only
       ever shown to a manager or administrator (route() below); anyone
       else routes straight through to Maintenance with no extra tap,
       exactly as before this existed. -->
  <div id="toolBox" class="signin-box" hidden>
    <div class="title">Choose a tool</div>
    <button onclick="pickTool('maintenance')">Maintenance</button>
    <button id="daySheetBtn" onclick="pickTool('day-sheet')">Day Sheet</button>
    <!-- safari-ops (root D-029): safari operations in Maun and administrators only. -->
    <button id="safariBoardBtn" onclick="pickTool('safari-board')" hidden>Tour Master</button>
    <div id="campPicker" hidden>
      <label id="campPickerLabel">Camp</label>
      <select id="campPickerSel"></select>
      <button onclick="goToCamp()">Go</button>
      <button class="secondary" onclick="document.getElementById('campPicker').hidden = true">← Back</button>
    </div>
    <!-- Mark, 2026-10-05: "if you are on the Bush Ways Dashboard - there is
         no sign out option". Who is signed in, and a real padded Sign out,
         shaded the way Sign out is on every other page. -->
    <p class="pickwho">Signed in as <b id="pickWho"></b></p>
    <button class="signout" onclick="signOutHere()">Sign out</button>
  </div>

  <p class="loading" id="loadingMsg">Loading…</p>
</div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var people = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Resuming a session skips straight to routing — this page is never
  // shown to someone already signed in, it just decides where they go.
  //
  // A second real tool exists now (Day Sheet, root D-020) — this is
  // maintenance's own front door becoming the group's, per root D-025:
  // "one place to sign in... then routed by what that person actually
  // has access to." Mark, 2026-09-18, once he realised Day Sheet
  // already qualifies: "I forgot the Daily Sheet - which is essentially
  // an operational tool for the lodge... After sign in - i see a page
  // with 2 page buttons for now. Maintenance & Daily Sheet. Lodge
  // specific managers will go to their camps when they click these
  // buttons. Admin will go to a second layer for each option."
  //
  // Ordinary, single-tool staff (not a manager, not an administrator)
  // skip the picker entirely and land exactly where they always have —
  // Day Sheet was never theirs to see, so showing them a choice with
  // one dead entry would be worse than no choice at all.
  // Tour Master access is a grant, not a flag (root D-030; safari-ops
  // D-017): some who have it are not managers, some managers do not. Asked
  // of the Tour Master's own server, which is the only judge of it.
  var TM_FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/safari-board";
  function route(me) {
    fetch(TM_FN + "?action=access&person_id=" + encodeURIComponent(me.id))
      .then(function (r) { return r.json(); })
      .then(function (a) { me.tour_master = a.level || null; })
      .catch(function () { me.tour_master = null; })
      .then(function () { routeKnown(me); });
  }
  function routeKnown(me) {
    if (!(me.is_manager || me.is_administrator) && !me.tour_master) {
      // Exactly the routing this page always did — untouched for
      // anyone who doesn't even see the tool picker below.
      if (me.locations && me.locations.length > 1) { location.href = "./base-dashboard.html"; return; }
      location.href = "./schedule.html";
      return;
    }
    showToolPicker(me);
  }

  function showToolPicker(me) {
    document.getElementById("signinBox").hidden = true;
    document.getElementById("loadingMsg").hidden = true;
    document.getElementById("toolBox").hidden = false;
    document.getElementById("pickWho").textContent = me.name || "";
    window._meForPicker = me;
    document.getElementById("safariBoardBtn").hidden = !me.tour_master;
    // The Day Sheet stays managers' and administrators' (D-026); someone
    // here only for the Tour Master does not see it.
    document.getElementById("daySheetBtn").hidden = !(me.is_manager || me.is_administrator);
  }

  // Back to the sign-in screen, as every other page's Sign out does.
  window.signOutHere = function () {
    sessionStorage.removeItem("bw_signin");
    sessionStorage.removeItem("bw_camp");
    location.href = "./";
  };

  var multiCamp = null; // set when pickTool needs the camp dropdown
  window.pickTool = function (tool) {
    var me = window._meForPicker;
    var multi = me.locations && me.locations.length > 1;
    if (tool === "safari-board") {
      // One board for the whole safari operation: no camp to choose.
      location.href = "./safari-board.html";
      return;
    }
    if (tool === "maintenance") {
      // Unchanged — Maintenance's own existing A/B split (root D-053/
      // D-054) still decides Roll Up vs a specific camp from here.
      location.href = multi ? "./base-dashboard.html" : "./schedule.html";
      return;
    }
    // Day Sheet — deliberately no Roll Up option, Mark: "for now lets
    // not do the day sheet roll up option. Let Admin only be able to
    // go into the camps via a drop down picker." A single-camp person
    // goes straight in, same as Maintenance does.
    if (!multi) {
      sessionStorage.setItem("bw_camp", JSON.stringify(me.locations[0]));
      location.href = "./day-sheet.html";
      return;
    }
    var sel = document.getElementById("campPickerSel");
    sel.innerHTML = me.locations.map(function (l) {
      return '<option value="' + esc(l.id) + '">' + esc(l.name) + '</option>';
    }).join("");
    document.getElementById("campPicker").hidden = false;
  };
  window.goToCamp = function () {
    var sel = document.getElementById("campPickerSel");
    var loc = { id: sel.value, name: sel.selectedOptions[0].textContent };
    sessionStorage.setItem("bw_camp", JSON.stringify(loc));
    location.href = "./day-sheet.html";
  };

  var resumed = null;
  try { var saved = sessionStorage.getItem("bw_signin"); if (saved) resumed = JSON.parse(saved); } catch (e) {}
  if (resumed) { route(resumed); }

  // Lodge first, then department, then name — Mark, 2026-09-18: "at the
  // moment when you choose a department it only shows the names of the
  // people in chobe. We need to introduce an additional filter -
  // Location - then Department." Picking a lodge is what actually
  // narrows a 230-person, 9-lodge list down to something browsable — the
  // old picker skipped straight to Department against a Chobe-only list
  // (`bootstrap()`, deliberately scoped that way, D-044), which is why
  // anyone real but not homed at Chobe could never find their own name
  // here at all. This is purely about FINDING your name — it has no
  // bearing on which lodge you actually land in after signing in, which
  // is still decided by `locations` off `login()` (D-052/D-053).
  // "Base Management" is not really a department the way "Maintenance"
  // or "Operations" is — it's the literal home department of a handful
  // of people (Directors and the like), while most of the group's real
  // Base Managers sit in their own actual department (a Maintenance
  // Manager, a Guides Coordinator...) and carry a separate flag,
  // is_base_manager, that gives them access to every lodge (D-053).
  // Mark, 2026-09-18, pointing at exactly this mismatch: "the drop
  // down list of Base Managers does not match the list i have saved."
  // Picking "Base Management" here means the flag, not the department
  // string — matches his own staff sheet's "Base Manager" column
  // one-for-one, not just the people literally filed under that name.
  function renderPersonOptions(locId, deptFilter) {
    var sel = document.getElementById("who");
    var shown = people.filter(function (p) { return p.location_id === locId; });
    if (deptFilter === "Base Management") shown = shown.filter(function (p) { return p.is_base_manager; });
    else if (deptFilter) shown = shown.filter(function (p) { return p.department === deptFilter; });
    sel.innerHTML = '<option value="">— nobody —</option>' + shown.map(function (p) {
      return '<option value="' + esc(p.id) + '" data-pin-set="' + p.pin_set + '">' + esc(p.name) + (p.is_manager ? " (management)" : "") + '</option>';
    }).join("");
    sel.onchange = function () {
      var opt = sel.selectedOptions[0];
      document.getElementById("whoSetPin").hidden = !opt || opt.dataset.pinSet !== "false";
    };
  }

  window.onWhoLoc = function () {
    var locId = document.getElementById("whoLoc").value;
    var deptSel = document.getElementById("whoDept");
    var whoSel = document.getElementById("who");
    if (!locId) {
      deptSel.disabled = true; whoSel.disabled = true;
      deptSel.innerHTML = ""; whoSel.innerHTML = "";
      return;
    }
    var here = people.filter(function (p) { return p.location_id === locId; });
    var deptNames = [];
    var seen = {};
    here.forEach(function (p) { if (p.department && !seen[p.department]) { seen[p.department] = true; deptNames.push(p.department); } });
    deptNames.sort();
    deptSel.innerHTML = '<option value="">All departments</option>' +
      deptNames.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("");
    deptSel.disabled = false;
    deptSel.onchange = function () { renderPersonOptions(locId, deptSel.value); };
    whoSel.disabled = false;
    renderPersonOptions(locId, "");
  };

  window.doWhoSetPin = function () {
    var id = document.getElementById("who").value;
    var pin = document.getElementById("whoNewPin").value;
    fetch(FN + "?action=set_pin", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ person_id: id, pin: pin }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      document.getElementById("whoSetPin").hidden = true;
      document.getElementById("whoPin").value = pin;
      alert("PIN set. Sign in below.");
    });
  };

  window.doWhoLogin = function () {
    var id = document.getElementById("who").value;
    var pin = document.getElementById("whoPin").value;
    var err = document.getElementById("whoErr");
    err.hidden = true;
    if (!id || !pin) { err.textContent = "Pick your name and enter your PIN."; err.hidden = false; return; }
    fetch(FN + "?action=login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ person_id: id, pin: pin }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { err.textContent = out.error; err.hidden = false; return; }
      var me = { id: out.person_id, name: out.name, department: out.department, is_manager: out.is_manager, is_administrator: out.is_administrator, locations: out.locations || [] };
      sessionStorage.setItem("bw_signin", JSON.stringify(me));
      route(me);
    });
  };

  // Genuinely group-wide, not `bootstrap()`'s Chobe-scoped list (D-044)
  // — see the comment on renderPersonOptions above for why that has to
  // be true here specifically.
  if (!resumed) {
    fetch(FN + "?action=landing_people").then(function (r) { return r.json(); }).then(function (b) {
      people = b.people || [];
      var locSel = document.getElementById("whoLoc");
      locSel.innerHTML = '<option value="">Select your lodge</option>' +
        (b.locations || []).map(function (l) { return '<option value="' + esc(l.id) + '">' + esc(l.name) + '</option>'; }).join("");
      document.getElementById("loadingMsg").hidden = true;
      document.getElementById("signinBox").hidden = false;
    }).catch(function (e) {
      document.getElementById("loadingMsg").textContent = "Couldn't load — a fault in the page, not your phone. (" + e.message + ")";
    });
  }
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
