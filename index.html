<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chobe Elephant Camp</title>
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:22px 0 8px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 20px}
  label{display:block;font-size:13px;color:#5B5344;margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff;margin-top:22px}
  .item{border-bottom:1px solid #E3DFD3;padding:12px 0}
  .item label.main{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:#232019;margin:0;cursor:pointer}
  .item input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:1px}
  .details{display:none;margin:10px 0 0 30px;padding:10px;background:#EFECE3;border-radius:6px}
  .item.open .details{display:block}
  .note{color:#8C6A2F;font-size:12px;margin-top:2px}
  .confirm{background:#EFECE3;border-radius:8px;padding:16px;margin-top:16px}
  .nav{font-size:13px;margin:10px 0 0}
  .review-card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:10px}
  .review-line{font-size:14px;margin:0 0 6px}
  .review-line .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F}
  .btnrow{display:flex;gap:10px;margin-top:22px}
  .btnrow button{margin-top:0}
  .btn-secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  [hidden]{display:none!important}
</style></head><body>

<div id="start">
  <h1>Guest Room Inspection</h1>
  <p class="sub">Chobe Elephant Camp — minimal test screen</p>
  <p class="nav"><a href="./dashboard.html">See the to-do list →</a> · <a href="./report.html">Report a fault →</a></p>
  <label>Who are you?</label>
  <select id="person"><option value="">Loading…</option></select>
  <label>Which room?</label>
  <select id="room"><option value="">Loading…</option></select>
  <button id="startBtn">Start inspection</button>
</div>

<div id="checklist" hidden></div>

<div id="review" hidden></div>

<div id="done" hidden>
  <h1>Inspection recorded</h1>
  <div class="confirm" id="doneBox"></div>
  <p><a href="#" id="again">Start another</a> · <a href="./dashboard.html">See the to-do list →</a></p>
</div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var state = { people: [], rooms: [], sections: [] };

  function el(tag, attrs, html) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  fetch(FN).then(function (r) { return r.json(); }).then(function (data) {
    state.people = data.people; state.rooms = data.rooms;
    var p = document.getElementById("person");
    p.innerHTML = '<option value="">Select your name</option>' +
      data.people.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + (x.department ? ' — ' + esc(x.department) : '') + '</option>'; }).join("");
    var r = document.getElementById("room");
    r.innerHTML = '<option value="">Select a room</option>' +
      data.rooms.map(function (x) { return '<option value="' + x.id + '">' + esc(x.label) + '</option>'; }).join("");
  }).catch(function (e) {
    document.getElementById("start").innerHTML = "<p>Couldn't reach the checklist data. This is a fault in the page, not your connection or phone — please tell Mark/Claude. (" + esc(e.message) + ")</p>";
  });

  document.getElementById("startBtn").onclick = function () {
    var personId = document.getElementById("person").value;
    var roomId = document.getElementById("room").value;
    if (!personId || !roomId) { alert("Pick your name and a room first."); return; }
    fetch(FN + "?action=checklist&person=" + personId + "&room=" + roomId)
      .then(function (r) { return r.json(); })
      .then(function (data) { renderChecklist(data, personId, roomId); })
      .catch(function (e) { alert("Couldn't load the checklist — a fault in the page, not your phone. (" + e.message + ")"); });
  };

  function renderChecklist(data, personId, roomId) {
    document.getElementById("start").hidden = true;
    var c = document.getElementById("checklist");
    c.hidden = false;

    // Keyed by item id, so onComponentChange (below) can rebuild the
    // second dropdown's options once a part is picked, without another
    // round trip to the server — tool-local D-030, per Mark, 2026-09-08:
    // a literacy-friendly two-step pick (part, then what's wrong with
    // it) for item types that have a real Component catalogue behind
    // them. Most item types don't yet — every fault's component_id is
    // null — and fall straight back to the one flat dropdown this
    // screen has always had.
    var itemFaultsById = {};

    function faultPickerHtml(item) {
      itemFaultsById[item.id] = item.faults;
      if (!item.faults.length) return "";
      var grouped = item.faults.some(function (f) { return f.component_id; });
      if (!grouped) {
        return '<label>What\'s wrong?</label><select data-fault="' + item.id + '"><option value="">Choose one</option>' +
          item.faults.map(function (f) {
            return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
          }).join("") + '</select>';
      }
      var components = [], seen = {};
      item.faults.forEach(function (f) {
        var key = f.component_id || "__other__";
        if (!seen[key]) { seen[key] = true; components.push({ key: key, name: f.component_name || "Other" }); }
      });
      return '<label>Which part?</label><select data-component="' + item.id + '" onchange="onComponentChange(\'' + item.id + '\')"><option value="">Choose one</option>' +
        components.map(function (comp) { return '<option value="' + comp.key + '">' + esc(comp.name) + '</option>'; }).join("") +
        '</select>' +
        '<label>What\'s wrong?</label><select data-fault="' + item.id + '" disabled><option value="">Choose the part first</option></select>';
    }

    window.onComponentChange = function (itemId) {
      var compSel = document.querySelector('[data-component="' + itemId + '"]');
      var faultSel = document.querySelector('[data-fault="' + itemId + '"]');
      var compVal = compSel.value;
      if (!compVal) {
        faultSel.innerHTML = '<option value="">Choose the part first</option>';
        faultSel.disabled = true;
        return;
      }
      var faults = itemFaultsById[itemId].filter(function (f) { return (f.component_id || "__other__") === compVal; });
      faultSel.innerHTML = '<option value="">Choose one</option>' + faults.map(function (f) {
        return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
      }).join("");
      faultSel.disabled = false;
    };

    var html = '<h1>Guest Room Inspection</h1>' +
      '<p class="sub">Chobe Elephant Camp, ' + esc(data.room_label) + ' — leave an item alone if it\'s fine (tool-local D-023)</p>';
    data.sections.forEach(function (s) {
      html += "<h2>" + esc(s.name) + "</h2>";
      s.items.forEach(function (item) {
        if (item.kind === "reading") {
          html += '<div class="item"><label class="main">' + esc(item.text) + '</label>' +
            '<input type="text" inputmode="numeric" data-value="' + item.id + '" placeholder="Reading"></div>';
        } else {
          html += '<div class="item" data-item="' + item.id + '">' +
            '<label class="main"><input type="checkbox" data-failed="' + item.id + '"> ' + esc(item.text) + '</label>' +
            '<div class="details">' + faultPickerHtml(item) +
            '<label>Action / notes</label><textarea data-action="' + item.id + '" rows="2" placeholder="What needs doing"></textarea>' +
            '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + item.id + '">' +
            '</div></div>';
        }
      });
    });
    html += '<button id="submitBtn">Submit inspection</button>';
    c.innerHTML = html;

    c.querySelectorAll("[data-failed]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        cb.closest(".item").classList.toggle("open", cb.checked);
      });
    });

    // A short label per item, the same way the dashboard and completed-
    // tasks pages derive one server-side — the review screen below needs
    // to show what's actually being submitted in plain terms, not just
    // "3 items flagged."
    function shortLabel(text) {
      return String(text).split("\n")[0].split(/\s+[—-]\s+/)[0].trim();
    }

    // Resized client-side before it ever leaves the phone — Maun's
    // bandwidth is the reason this happens here, not on the server.
    // 1000px on the long side, JPEG at 0.6 quality: still clear enough
    // to see what's wrong, a fraction of a raw phone photo's size.
    function compressImage(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var img = new Image();
          img.onload = function () {
            var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
            var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
            var canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.6));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("submitBtn").onclick = function () {
      var results = [];
      data.sections.forEach(function (s) {
        s.items.forEach(function (item) {
          if (item.kind === "reading") {
            var v = c.querySelector('[data-value="' + item.id + '"]').value;
            if (v) results.push({ item_id: item.id, value: Number(v), label: shortLabel(item.text) });
          } else {
            var failed = c.querySelector('[data-failed="' + item.id + '"]').checked;
            if (failed) {
              var faultEl = c.querySelector('[data-fault="' + item.id + '"]');
              var faultLabel = faultEl && faultEl.value ? faultEl.options[faultEl.selectedIndex].text.split(" — ")[0] : null;
              var photoInput = c.querySelector('[data-photo="' + item.id + '"]');
              results.push({
                item_id: item.id, failed: true,
                fault_type_id: faultEl ? faultEl.value : null,
                action_if_failed: c.querySelector('[data-action="' + item.id + '"]').value,
                label: shortLabel(item.text), fault_type_label: faultLabel,
                photoFile: photoInput && photoInput.files[0] ? photoInput.files[0] : null,
              });
            }
          }
        });
      });
      showReview(results);
    };

    // Nothing is written to the database yet at this point — per Mark,
    // 2026-09-08: "once submitted we need an edit or confirm button."
    // "Submit" above only builds the summary; the actual write happens
    // on "Confirm" below, so a mistake is easy to catch and go back to
    // without it ever having been recorded.
    function showReview(results) {
      c.hidden = true;
      var r = document.getElementById("review");
      r.hidden = false;
      var flagged = results.filter(function (x) { return x.failed; });
      var readings = results.filter(function (x) { return x.value !== undefined; });
      var html = '<h1>Confirm Inspection</h1>' +
        '<p class="sub">' + esc(data.room_label) + ', Chobe Elephant Camp — check this is right before it\'s recorded</p>';

      if (!flagged.length && !readings.length) {
        html += '<div class="review-card"><p class="review-line">Nothing flagged — every item recorded as fine.</p></div>';
      } else {
        html += '<div class="review-card">';
        flagged.forEach(function (x) {
          html += '<p class="review-line">' + esc(x.label) +
            (x.fault_type_label ? ' — <span class="fault">' + esc(x.fault_type_label) + '</span>' : '') +
            (x.action_if_failed ? ' — ' + esc(x.action_if_failed) : '') +
            (x.photoFile ? ' 📷' : '') + '</p>';
        });
        readings.forEach(function (x) {
          html += '<p class="review-line">' + esc(x.label) + ': ' + esc(x.value) + '</p>';
        });
        html += '</div>';
      }

      html += '<div class="btnrow">' +
        '<button class="btn-secondary" id="editBtn">← Edit</button>' +
        '<button id="confirmBtn">Confirm — submit inspection</button>' +
        '</div>';
      r.innerHTML = html;

      document.getElementById("editBtn").onclick = function () {
        r.hidden = true;
        c.hidden = false;
      };

      document.getElementById("confirmBtn").onclick = function () {
        var btn = document.getElementById("confirmBtn");
        btn.disabled = true;
        btn.textContent = "Submitting…";
        fetch(FN, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ person_id: personId, room_id: roomId, template_id: data.template_id, results: results }),
        }).then(function (resp) { return resp.json(); }).then(function (out) {
          // The issue this item's photo belongs to doesn't exist until
          // the line above returns — issue_ids maps item_id -> the real
          // issue, created moments ago, specifically so this can happen.
          var withPhotos = flagged.filter(function (x) { return x.photoFile && out.issue_ids[x.item_id]; });
          var uploaded = 0, failed = 0;
          function finish() {
            r.hidden = true;
            document.getElementById("done").hidden = false;
            document.getElementById("doneBox").innerHTML =
              "<p>" + esc(out.room_label) + ", Chobe Elephant Camp.</p>" +
              "<p>" + out.flagged + " item" + (out.flagged === 1 ? "" : "s") + " flagged. Everything else recorded as fine.</p>" +
              (out.issues_raised ? "<p>" + out.issues_raised + " issue" + (out.issues_raised === 1 ? "" : "s") + " raised — tracked, open, waiting to be fixed.</p>" : "") +
              (uploaded ? "<p>" + uploaded + " photo" + (uploaded === 1 ? "" : "s") + " attached.</p>" : "") +
              (failed ? "<p class='note'>" + failed + " photo" + (failed === 1 ? "" : "s") + " didn't upload — the inspection itself is still safely recorded.</p>" : "") +
              '<p class="note">inspection id: ' + esc(out.inspection_id) + "</p>";
          }
          if (!withPhotos.length) { finish(); return; }
          btn.textContent = "Uploading photos…";
          var remaining = withPhotos.length;
          withPhotos.forEach(function (x) {
            compressImage(x.photoFile).then(function (dataUrl) {
              return fetch(FN + "?action=attach", {
                method: "POST", headers: { "content-type": "application/json" },
                body: JSON.stringify({ issue_id: out.issue_ids[x.item_id], added_by: personId, image_data_url: dataUrl }),
              });
            }).then(function (r2) { return r2.json(); }).then(function (a) {
              if (a.error) failed++; else uploaded++;
            }).catch(function () { failed++; })
              .then(function () { if (--remaining === 0) finish(); });
          });
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = "Confirm — submit inspection";
          alert("Couldn't submit — a fault in the page, not your phone. Nothing was lost; try again. (" + e.message + ")");
        });
      };
    }
  }

  document.getElementById("again").onclick = function (e) {
    e.preventDefault();
    location.reload();
  };
</script>
</body></html>
