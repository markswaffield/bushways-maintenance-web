<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Tour Master</title>
<!--
  The Tour Master — tools/safari-ops/. Replaces the Tour Master workbook and
  takes its name (Mark, 2026-10-05). Called the Safari Board in the code and
  docs; the file name and URL stay safari-board.html so no link breaks.

  Laid out like the Tour Master on purpose (Mark, 2026-10-04): days down
  the side, the vehicle slots across the top, two columns per slot so one
  safari can end the day the next one starts. A laptop screen, like the
  Day Sheet: seeing every vehicle at once is the point.

  Departures come from ResRequest through the safari-board Edge Function and
  are placed in slots by its first-free rule (tool-local D-002). A person can
  move one by dragging it to another column, or from its panel; the tool then
  never moves it again. Campsites are entered night by night in the panel
  (D-003). Crew and equipment come next.

  Columns are SLOTS, not vehicles (D-006). Departures with no guests yet sit
  in the "Open" columns at the right, as they do on the Tour Master (D-007).
  The pre night is drawn lighter and never blocks a slot.

  Sign-in is the group's own (root D-025/D-026): the same bw_signin the
  picker writes.
-->
<style>
  :root{
    --bg:#F7F5F0; --ink:#232019; --muted:#6B6455; --line:#C9C2AC; --card:#fff; --head:#122D31;
    --adv-bg:#DCEBDD; --adv-bd:#4F7A55;
    --pre-bg:#F5E6C8; --pre-bd:#A07A2C;
    --acc-bg:#DCE7F2; --acc-bd:#3F6A93;
    --tm-bg:#E9E1F1;  --tm-bd:#6D558C;
    --open-bg:#F1EFE8; --open-bd:#9C9480;
    --clash:#B3261E; --today:#FFF4CC; --weekend:#EFEBE1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font:13px/1.3 -apple-system,system-ui,sans-serif;margin:0;padding:14px 14px 0;background:var(--bg);color:var(--ink);
       height:100vh;overflow:hidden;display:flex;flex-direction:column}
  h1{font-size:18px;margin:0 0 3px}
  .sub{color:var(--muted);font-size:12.5px;margin:0}
  button{padding:7px 13px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#43594A;color:#fff;border-radius:6px;cursor:pointer}
  button.ghost{background:#fff;color:#43594A}
  button:disabled{opacity:.4;cursor:default}
  input,select{padding:6px;font-size:13px;border:1px solid var(--line);border-radius:5px;background:#fff;font-family:inherit}
  .whobar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
    border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:#fff;font-size:13px;margin:10px 0 0}
  .whobar b{color:var(--head)}
  .whobar-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .whobar-btns button{padding:6px 11px;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .whobar-btns button:last-child{background:#F4E3D3;border-color:#8C6A2F;color:#4A3620;font-weight:600}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0 0;padding:10px 12px;
           border:1px solid var(--line);border-radius:8px;background:#fff}
  .toolbar label{display:block;font-size:11px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:0 0 3px}
  .status{font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
  .status.err{color:var(--clash)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:8px 0 0}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{display:inline-block;width:14px;height:11px;border-radius:2px;border:1.5px solid}

  /* The one scroller on the page; header row and date column stick. */
  #wrap{flex:1;min-height:0;overflow:auto;margin:10px 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative}
  #grid{display:grid;position:relative}
  .hd{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;font-weight:600;font-size:12px;
      padding:6px 4px;text-align:center;border-right:1px solid #2E4B4F;white-space:nowrap;height:30px}
  .hd.corner{left:0;z-index:7}
  .hd.open{background:#5B5344}
  .hd.cxl{background:#6E6E6E}
  .cell.cxlcol{background:#F4F4F4}
  .nmark{font-size:11px;margin-left:3px}
  #notesBox textarea{width:100%;min-height:90px;font:inherit;font-size:13px;padding:7px;border:1px solid var(--line);border-radius:6px}
  .day{position:sticky;left:0;z-index:4;background:#fff;border-bottom:1px solid #ECE8DE;border-right:1px solid var(--line);
       padding:0 6px;font-size:11.5px;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .day.we{background:var(--weekend)}
  .day.today{background:var(--today);font-weight:700}
  .day.m1{border-top:2px solid var(--head)}
  .cell{border-bottom:1px solid #F0ECE3;border-right:1px solid #F0ECE3}
  /* A dark rule between vehicle slots, a faint one between a slot's two
     columns (Mark, 2026-10-05: "darker lines dividing the vehicle slots"). */
  .cell.slotend{border-right:2px solid #43594A}
  .hd.slot{border-right:2px solid #5E7A80}
  /* The weekend runs across the whole row, under the safaris. */
  .cell.we{background:var(--weekend)}
  .cell.today{background:#FFFBEA}
  .cell.m1{border-top:2px solid var(--head)}

  .blk{z-index:2;margin:1px 2px;border:1.5px solid;border-radius:5px;padding:3px 5px;overflow:hidden;cursor:pointer;
       font-size:11.5px;line-height:1.25;display:flex;flex-direction:column;gap:1px;text-align:left;color:var(--ink);font-family:inherit}
  .blk:hover{filter:brightness(.97);box-shadow:0 1px 5px rgba(0,0,0,.15)}
  .blk b{font-size:12px}
  .blk .t{color:#4A4436}
  .blk .s{font-weight:700}
  .blk .s.full{color:#2F6B45}
  .blk .s.over{color:var(--clash)}
  .blk .end{margin-top:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* Each safari in the Tour Master's own colours (Mark, 2026-10-04: "the
     colour codings are not to reflect each safari type, but rather each
     safari, this would be the header safari"). Set per block from LOOK:
     --hb/--hf the code line, --bb/--bf the days, --bd the edge. */
  .blk.sx{background:var(--bb);border-color:var(--bd);color:var(--bf)}
  .blk.night.sx{background:#fff;color:var(--muted)}
  .blk.night.sx.head{background:var(--hb);color:var(--hf);border-color:var(--bd)}
  .blk.night.sx.head .s{color:inherit}
  .blk.open{background:var(--open-bg);border-color:var(--open-bd);border-style:dashed}
  .blk.prov{border-style:dashed}
  .blk.cxl{background:#EEE;border-color:#999;color:#777;text-decoration:line-through}
  .blk.est{border-bottom-style:dotted}
  /* A white ring then a red one, so a clash shows on a red Tailor Made too. */
  .blk.clash{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--clash);z-index:4}
  /* The pre night: the vehicle is being prepared, perhaps a meet and greet or
     shopping. Lighter, and never a block that holds the slot (Mark, 2026-10-04). */
  .blk.night{border-style:dotted;z-index:1;justify-content:center;padding:0 5px;flex-direction:row;align-items:center;gap:5px;
             white-space:nowrap;background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55))}
  /* The pre night line starts at the left, so the seats are never the part
     cut off when the column is narrow (Mark, 2026-10-05). */
  .blk.night:not(.head){justify-content:flex-start}
  .blk.night b{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;letter-spacing:-.01em}
  .blk.night .s{flex:none}
  .blk.night .pn{font-size:10px;color:#8A8270;font-style:italic}
  .blk.night .s{font-size:11px}
  /* One line per night, laid over the block like the Tour Master's cells. */
  .nt{z-index:3;pointer-events:none;font-size:11px;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:#3B362B}
  /* An area, not a place: a person has to enter the campsite (D-003). */
  .nt.camp{font-style:italic}
  .nt.camp::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#D9822B;margin-right:5px}
  .nt.end{font-size:10px;font-weight:700;letter-spacing:.05em;color:#6B6455}
  .nt.site{font-weight:700;color:#232019}
  .blk[draggable=true]{cursor:grab}
  .blk.dragging{opacity:.35}
  #grid.dropping .cell{background-image:linear-gradient(rgba(67,89,74,.04),rgba(67,89,74,.04))}
  .drop-hint{z-index:6;pointer-events:none;border:2px dashed #43594A;border-radius:5px;background:rgba(67,89,74,.08)}
  .pin{font-size:10px;color:#43594A}
  .edit{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 0}
  .nights td input{width:100%;padding:4px 6px;font-size:12.5px}
  .nights tr.need td:first-child{border-left:3px solid #D9822B}
  .nights .area{color:#6B6455;font-size:12px}
  .nights .area.need{color:#8C4A12;font-style:italic}
  .saved{color:#2F6B45;font-size:12px}
  /* Crew names on the line above the pre night, as the Tour Master writes them. */
  .crewln{z-index:3;font-size:11px;color:#232019;font-weight:600;padding:0 6px;display:flex;align-items:center;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  /* The code line at the top of a stack is the safari's own, so full colour;
     only the pre night itself is drawn lighter. */
  .blk.night.head{background-image:none;border-style:solid}
  .crewln.bad{color:var(--clash)}
  .alloc{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 6px}
  .alloc td{padding:3px 3px;border-bottom:1px solid #F0ECE3;vertical-align:middle}
  .alloc select,.alloc input{width:100%;padding:4px 5px;font-size:12.5px}
  .alloc .x{width:28px}
  .alloc .x button{padding:3px 8px;background:#fff;color:#8A2A23;border-color:#D9B3AF}
  .alloc .dates input{width:118px}
  .vgrid{display:grid;grid-template-columns:150px 1fr;gap:4px 6px}
  .grp{margin:6px 0 2px}
  .grp .gt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#5B5344;font-weight:700;margin:6px 0 0}
  .grp button.add{padding:3px 9px;font-size:12px}
  .chk{font-size:11.5px;color:#6B6455;margin:3px 0 0}
  .chk.ok{color:#2F6B45;font-weight:600}
  .clashmsg{color:var(--clash);font-size:11.5px;font-weight:600}
  details.when summary{cursor:pointer;color:#6B6455;font-size:11.5px}
  /* The guest mix at the top of the panel, one tile per safari type. */
  .mix{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .mx{border:1.5px solid;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;min-width:92px}
  .mx b{font-size:20px;line-height:1.1}
  .mx span{font-weight:600;font-size:12.5px}
  .mx small{color:inherit;opacity:.8;font-size:11px}
  .mx.sx,.sf.sx{background:var(--hb);border-color:var(--bd);color:var(--hf)}
  .sf{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border:1px solid;border-radius:9px;vertical-align:1px}
  .err{color:var(--clash);font-size:12px}

  #panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;border-left:1px solid var(--line);
         box-shadow:-4px 0 18px rgba(0,0,0,.12);z-index:20;padding:16px;overflow:auto;display:none}
  #panel.on{display:block}
  #panel h2{font-size:17px;margin:0 0 2px}
  #panel .meta{color:var(--muted);margin:0 0 10px}
  #panel table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 10px}
  #panel th,#panel td{text-align:left;padding:4px 6px;border-bottom:1px solid #ECE8DE;vertical-align:top}
  #panel th{font-size:11px;text-transform:uppercase;color:#5B5344}
  .bk{border:1px solid #ECE8DE;border-radius:6px;padding:8px 10px;margin:0 0 8px}
  .bk .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
  .bk .n{white-space:pre-wrap;font-size:12px;margin:5px 0 0;color:#3B362B}
  .bk .n em{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;color:#8A8270;letter-spacing:.04em}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;background:#EEE;color:#555;font-weight:600}
  .tag.c{background:#DFF0E3;color:#2F6B45}.tag.p{background:#FFF0CC;color:#8C6A2F}.tag.x{background:#F6DADA;color:#8A2A23}
  .loading{color:var(--muted);padding:20px}
  @media (max-width:700px){ body{padding:10px 10px 0} .status{margin-left:0;width:100%} }
</style>
</head><body>

<h1>Tour Master</h1>
<p class="sub">Every safari departure, on its vehicle slot, read from ResRequest. Drag a safari to move it; click it for its bookings and campsites.</p>
<div class="whobar">
  <span>👤 <b id="whoami"></b></span>
  <span class="whobar-btns">
    <button onclick="location.href='./'">← Change tool</button>
    <button id="signOut">Sign out</button>
  </span>
</div>

<div class="toolbar">
  <div><label for="from">From</label><input type="date" id="from"></div>
  <div><label for="weeks">Show</label>
    <select id="weeks"><option value="4">4 weeks</option><option value="8" selected>8 weeks</option><option value="13">3 months</option><option value="26">6 months</option></select></div>
  <button class="ghost" id="earlier">◀ Earlier</button>
  <button class="ghost" id="today">Today</button>
  <button class="ghost" id="later">Later ▶</button>
  <button id="sync">Update from ResRequest</button>
  <span class="status" id="status"></span>
</div>
<div class="legend">
  <span id="legendSafaris" style="display:contents"></span>
  <span><i style="background:var(--open-bg);border-color:var(--open-bd);border-style:dashed"></i>Open, no guests yet</span>
  <span><i style="background:#fff;border-color:#888;border-style:dotted;opacity:.6"></i>Pre night, with seats</span>
  <span><i style="background:#D9822B;border-color:#D9822B;border-radius:50%;width:9px;height:9px"></i>Campsite to enter</span>
  <span><i style="background:#fff;border-color:var(--clash)"></i>Clash or over seats</span>
  <span><i style="background:#E9E9E9;border-color:#9A9A9A"></i>Cancelled on the board</span>
</div>

<div id="wrap"><div id="grid"><p class="loading">Loading…</p></div></div>
<div id="panel"></div>

<script>
var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/safari-board";
var ROW = 24, DAYW = 92, LANEW = 112;

var me = null;
try { var savedMe = sessionStorage.getItem("bw_signin"); if (savedMe) me = JSON.parse(savedMe); } catch (e) {}
if (!me) { location.href = "./"; }
// Safari operations are run from Maun: administrators, and anyone at the
// Bush Ways Safaris location.
var allowed = me && (me.is_administrator || (me.locations || []).some(function (l) { return l.name === "Bush Ways Safaris"; }));
document.getElementById("whoami").textContent = me ? me.name : "";
document.getElementById("signOut").onclick = function () {
  sessionStorage.removeItem("bw_signin"); sessionStorage.removeItem("bw_camp"); location.href = "./";
};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2]);}
function add(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((parse(b)-parse(a))/86400000);}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nice(s){var d=parse(s);return DOW[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+" "+MON[d.getMonth()];}
function setStatus(t,err){var s=el("status");s.textContent=t;s.className="status"+(err?" err":"");}

var startFrom = (function(){ try { return sessionStorage.getItem("sb_from"); } catch (e) { return null; } })() || add(iso(new Date()), -7);
el("from").value = startFrom;
function range(){ var f = el("from").value; return { from: f, to: add(f, +el("weeks").value * 7 - 1) }; }
function shift(n){ el("from").value = add(el("from").value, n); load(); }
el("from").onchange = load; el("weeks").onchange = load;
el("earlier").onclick = function(){ shift(-(+el("weeks").value * 7) / 2); };
el("later").onclick = function(){ shift((+el("weeks").value * 7) / 2); };
el("today").onclick = function(){ el("from").value = add(iso(new Date()), -7); load(); };

var data = null;
function load(){
  if (!allowed) {
    el("grid").innerHTML = '<p class="loading">The Tour Master is for safari operations and administrators. <button onclick="location.href=\'./\'">← Back to tools</button></p>';
    return;
  }
  try { sessionStorage.setItem("sb_from", el("from").value); } catch (e) {}
  var r = range();
  setStatus("Loading…");
  fetch(FN + "?action=board&from=" + r.from + "&to=" + r.to).then(function(x){return x.json();}).then(function(d){
    if (d.error) throw new Error(d.error);
    data = d; draw(r);
    setStatus(d.last_synced ? "Last read from ResRequest " + new Date(d.last_synced).toLocaleString() : "Not yet read from ResRequest");
  }).catch(function(e){ setStatus("Could not load: " + e.message, true); });
}

// The Tour Master's colours, read from the workbook itself (2026-10-04):
// hb/hf the code cell's fill and text, bb/bf the day cells', bd the edge.
var LOOK = {
  "Leopard":     { hb: "#FFC000", hf: "#F20884", bb: "#FFFFFF", bf: "#F20884", bd: "#E0A800" },
  "Lion":        { hb: "#92D050", hf: "#0000D4", bb: "#FFFFFF", bf: "#0000D4", bd: "#6FAE2E" },
  "Fish Eagle":  { hb: "#B3A2C7", hf: "#0000D4", bb: "#FFFFFF", bf: "#0000D4", bd: "#8E7BA8" },
  "Buffalo":     { hb: "#FF0000", hf: "#FFFFFF", bb: "#FFFFFF", bf: "#903C3A", bd: "#C00000" },
  "Serval":      { hb: "#FF6600", hf: "#000000", bb: "#CCFFFF", bf: "#000000", bd: "#E05A00" },
  "Caracal":     { hb: "#B3B1A9", hf: "#000000", bb: "#FFFFFF", bf: "#000000", bd: "#8F8D85" },
  "Sable":       { hb: "#FFCC99", hf: "#000000", bb: "#92D050", bf: "#000000", bd: "#D9A066" },
  "Tailor Made": { hb: "#FF0000", hf: "#000000", bb: "#FF0000", bf: "#000000", bd: "#B00000" },
};
// The header safari a type belongs to: Kalahari is the start of a Leopard.
function safariOf(type, product){
  if (product === "Tailor Made") return "Tailor Made";
  if (/^Serval/.test(type)) return "Serval";
  if (/^Sable/.test(type)) return "Sable";
  if (type === "Kalahari") return "Leopard";
  return LOOK[type] ? type : "Tailor Made";
}
function lookOf(d){
  var name = safariOf(d.type, d.product), lk = Object.assign({}, LOOK[name]);
  // Serval SouthBound's days are light green, NorthBound's light cyan.
  if (d.type === "Serval SouthBound") lk.bb = "#CCFFCC";
  // Every Fish Eagle trip is coloured as a Fish Eagle, BWF(P) and BWF(L)
  // included: they run parallel to a Leopard or Lion, not inside one (Mark,
  // 2026-10-04).
  return lk;
}
var GREY = { hb: "#BFBFBF", hf: "#333333", bb: "#E9E9E9", bf: "#555555", bd: "#9A9A9A" };
function vars(lk){ return "--hb:" + lk.hb + ";--hf:" + lk.hf + ";--bb:" + lk.bb + ";--bf:" + lk.bf + ";--bd:" + lk.bd + ";"; }
(function(){
  var l = document.getElementById("legendSafaris");
  if (l) l.innerHTML = Object.keys(LOOK).map(function(k){
    var x = LOOK[k];
    return '<span><i style="background:' + x.hb + ';border-color:' + x.bd + '"></i><b style="color:' + (x.bf === "#000000" ? "inherit" : x.bf) + ';font-weight:600">' + k + '</b></span>';
  }).join("");
})();
function label(d){
  if (d.code) return d.code;
  var b = d.bookings.find(function(b){ return b.rr_status === "30" || b.rr_status === "20"; }) || d.bookings[0];
  return b ? b.name : d.type;
}

function draw(r){
  var nDays = diff(r.from, r.to) + 1;
  // Vehicles (two columns each), then Open, then the Cancelled columns (one
  // each) at the end of the sheet (Mark, 2026-10-05; D-013).
  var slots = data.slots.filter(function(x){ return x.kind !== "cancelled"; });
  var cslots = data.slots.filter(function(x){ return x.kind === "cancelled"; });
  var deps = data.departures;

  // Open columns: departures with no slot, packed into as few lanes as fit.
  var open = deps.filter(function(d){ return !d.slot_id && d.status !== "cancelled"; })
                 .sort(function(a,b){ return a.start_date < b.start_date ? -1 : 1; });
  var openLanes = [];
  open.forEach(function(d){
    for (var i = 0; i < openLanes.length; i++) if (openLanes[i] < add(d.start_date, -1)) break;
    openLanes[i] = d.end_date; d._openLane = i;
  });
  var nOpen = Math.max(openLanes.length, 1);

  layout = { v: slots.length, nOpen: nOpen, c: cslots };
  var nCols = slots.length * 2 + nOpen + cslots.length;
  var cols = DAYW + "px repeat(" + nCols + "," + LANEW + "px)";
  var g = el("grid");
  g.style.gridTemplateColumns = cols;
  g.style.gridTemplateRows = "30px repeat(" + nDays + "," + ROW + "px)";
  var h = [];

  h.push('<div class="hd corner" style="grid-row:1;grid-column:1">' + MON[parse(r.from).getMonth()] + " " + parse(r.from).getFullYear() + '</div>');
  slots.forEach(function(s, i){
    h.push('<div class="hd slot" style="grid-row:1;grid-column:' + (2 + i * 2) + ' / span 2">' + esc(s.label) + '</div>');
  });
  h.push('<div class="hd open" style="grid-row:1;grid-column:' + (2 + slots.length * 2) + ' / span ' + nOpen + '">Open — no guests yet</div>');
  cslots.forEach(function(x, i){
    h.push('<div class="hd cxl" style="grid-row:1;grid-column:' + (2 + slots.length * 2 + nOpen + i) + '">Cancelled</div>');
  });

  var today = iso(new Date());
  for (var k = 0; k < nDays; k++) {
    var day = add(r.from, k), dt = parse(day), row = k + 2;
    var cls = (dt.getDay() === 0 || dt.getDay() === 6 ? " we" : "") + (day === today ? " today" : "") + (dt.getDate() === 1 ? " m1" : "");
    h.push('<div class="day' + cls + '" style="grid-row:' + row + ';grid-column:1">' + nice(day) + '</div>');
    for (var c = 0; c < nCols; c++) {
      var cc = "cell" + (c % 2 === 1 && c < slots.length * 2 ? " slotend" : "") + (c === slots.length * 2 + nOpen - 1 ? " slotend" : "")
        + (c >= slots.length * 2 + nOpen ? " cxlcol" : "") + (day === today ? " today" : (dt.getDay() === 0 || dt.getDay() === 6 ? " we" : "")) + (dt.getDate() === 1 ? " m1" : "");
      h.push('<div class="' + cc + '" style="grid-row:' + row + ';grid-column:' + (c + 2) + '"></div>');
    }
  }

  // Clashes: two departures in the same slot and column on the same night,
  // or a person, vehicle or trailer on this safari and another at once.
  var slotIdx = {}; slots.forEach(function(s, i){ slotIdx[s.id] = i; });
  var cIdx = {}; cslots.forEach(function(s, i){ cIdx[s.id] = i; });
  deps.forEach(function(a){
    a._clash = a.status !== "cancelled" && !a.shelved && a.slot_id && deps.some(function(b){
      return b !== a && b.status !== "cancelled" && b.slot_id === a.slot_id && b.lane === a.lane
        && a.start_date < b.end_date && b.start_date < a.end_date;
    });
    a._crewClash = !a.shelved && a.crew.some(function(c){ return c.clash; })
      || a.vehicles.some(function(v){ return v.clash || v.trailer_clash || v.driver_clash; });
  });

  deps.forEach(function(d){
    var col;
    if (d.slot_id && slotIdx[d.slot_id] != null) col = 2 + slotIdx[d.slot_id] * 2 + ((d.lane || 1) - 1);
    else if (d.slot_id && cIdx[d.slot_id] != null) col = 2 + slots.length * 2 + nOpen + cIdx[d.slot_id];
    else if (d._openLane != null) col = 2 + slots.length * 2 + d._openLane;
    else return;
    var live = d.has_guests && d.status !== "cancelled";
    // Moved to the Cancelled columns: everything kept, drawn grey.
    var lk = d.shelved ? GREY : live ? lookOf(d) : null;
    if (d.shelved) live = true;
    var fam = live ? "sx" : "open";
    var sv = lk ? vars(lk) : "";

    var seatsCls = d.max_seats && d.seats > d.max_seats ? " over" : (d.max_seats && d.seats === d.max_seats ? " full" : "");
    var seatsTxt = d.seats + (d.max_seats ? "/" + d.max_seats : "");
    var title = esc(label(d) + " · " + d.product + " · " + d.type + " · " + seatsTxt + " seats"
      + (d.mix.length > 1 ? " · " + mixText(d) : "")
      + (d.shelved ? " · CANCELLED on the board" : "") + (d.notes ? " · notes: " + d.notes : "")
      + (d.placed_by_person ? " · placed by hand" : "") + (allowed ? " · drag to move" : ""));
    var drag = allowed ? ' draggable="true"' : "";

    // Above day 1, as on the Tour Master: the code and seats, then the crew
    // in Mark's format, then the pre night (lighter, never holds the slot).
    //   BWS2628 9/9
    //   G - DT - B282BRG
    //   C - KD - B836AGZ
    //   CH - Shepy, Alec
    //   TR - An Other
    var pre = add(d.start_date, -1);
    var first = function(n){ return (n || "").split(/\s+/)[0]; };
    var lines = [];
    d.vehicles.filter(function(v){ return v.role !== "backup"; }).forEach(function(v){
      if (v.driver || v.registration) lines.push("G - " + [first(v.driver), v.registration].filter(Boolean).join(" - "));
    });
    d.vehicles.filter(function(v){ return v.role === "backup"; }).forEach(function(v){
      if (v.driver || v.registration) lines.push("C - " + [first(v.driver), v.registration].filter(Boolean).join(" - "));
    });
    [["camp_hand", "CH"], ["translator", "TR"], ["trainee_guide", "TG"], ["guide", "G"], ["chef", "C"]].forEach(function(k){
      var names = d.crew.filter(function(c){ return c.role === k[0]; }).map(function(c){ return k[0] === "translator" ? c.name : first(c.name); });
      if (names.length) lines.push(k[1] + " - " + names.join(", "));
    });
    // The code has its own line so it is never cut short; the seats go on
    // the pre night line (Mark, 2026-10-05).
    var stack = [{ code: true }].concat(lines.map(function(t){ return { text: t }; })).concat([{ pre: true }]);
    // A line is drawn only where nothing else in this column is on that day.
    var busy = function(day){
      return deps.some(function(o){
        return o !== d && o.slot_id && o.slot_id === d.slot_id && (o.lane || 1) === (d.lane || 1)
          && add(o.start_date, -1) <= day && day <= o.end_date;
      });
    };
    stack.forEach(function(ln, i){
      var day = add(d.start_date, -(stack.length - i));
      if (day < r.from || day > r.to || (d.slot_id && i < stack.length - 1 && busy(day))) return;
      var row = 'grid-row:' + (diff(r.from, day) + 2) + ';grid-column:' + col;
      if (ln.code) {
        h.push('<button class="blk night ' + fam + ' head" data-id="' + d.id + '"' + drag + ' title="' + title + '" style="' + sv + row + '">'
          + '<b>' + esc(label(d)) + '</b>' + (d.notes ? '<span class="nmark" title="Has additional notes">✎</span>' : '') + '</button>');
      } else if (ln.pre) {
        h.push('<button class="blk night ' + fam + '" data-id="' + d.id + '"' + drag + ' title="' + title + '" style="' + sv + row + '">'
          + '<span class="s' + seatsCls + '">' + seatsTxt + ' seats</span><span class="pn">pre night</span></button>');
      } else {
        h.push('<div class="crewln' + (d._crewClash ? " bad" : "") + '" data-id="' + d.id + '" title="' + title + '" style="' + row + '">' + esc(ln.text) + '</div>');
      }
    });
    var s = d.start_date < r.from ? r.from : d.start_date;
    var e = d.end_date > r.to ? r.to : d.end_date;
    if (s > e) return;
    var span = diff(s, e) + 1;
    var cls = "blk " + fam + (d.status === "provisional" ? " prov" : "") + (d.status === "cancelled" ? " cxl" : "")
            + (d.end_date_estimated ? " est" : "") + (d._clash || d._crewClash || (d.max_seats && d.seats > d.max_seats) ? " clash" : "");
    h.push('<button class="' + cls + '" data-id="' + d.id + '"' + drag + ' title="' + title + '" style="' + sv + 'grid-row:' + (diff(r.from, s) + 2) + ' / span ' + span + ';grid-column:' + col + '"></button>');

    // Night by night: the area, or the code where the route is not known
    // (Tailor Made) or the trip started above the screen.
    d.nights.forEach(function(n, i){
      if (n.date < r.from || n.date > r.to) return;
      var txt = n.campsite || n.area;
      if (i === 0 || n.date === r.from) {
        if (!txt) { if (n.date === r.from) txt = label(d) + " · " + seatsTxt; } // else the pre night already says it
        else if (n.date === r.from) txt = label(d) + " · " + txt; // its pre night is above the screen
      }
      if (!txt) return;
      var ncls = n.campsite ? " site" : (n.needs_campsite ? " camp" : "");
      h.push('<div class="nt' + ncls + '" title="' + esc((n.area || "") + (n.campsite ? " · " + n.campsite : "")) + '" style="' + (lk ? "color:" + lk.bf + ";" : "") + 'grid-row:' + (diff(r.from, n.date) + 2) + ';grid-column:' + col + '">' + esc(txt) + '</div>');
    });
    if (d.end_date >= r.from && d.end_date <= r.to) {
      h.push('<div class="nt end" style="' + (lk ? "color:" + lk.bf + ";" : "") + 'grid-row:' + (diff(r.from, d.end_date) + 2) + ';grid-column:' + col + '">' + (d.end_date_estimated ? "END (estimated)" : "END") + '</div>');
    }
  });

  g.innerHTML = h.join("");
  g.querySelectorAll(".crewln[data-id]").forEach(function(b){ b.onclick = function(){ openPanel(b.getAttribute("data-id")); }; });
  g.querySelectorAll(".blk[data-id]").forEach(function(b){
    b.onclick = function(){ openPanel(b.getAttribute("data-id")); };
    b.ondragstart = function(e){
      dragId = b.getAttribute("data-id");
      e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move";
      g.querySelectorAll('[data-id="' + dragId + '"]').forEach(function(x){ x.classList.add("dragging"); });
      g.classList.add("dropping");
    };
    b.ondragend = function(){ endDrag(); };
  });
}

// Drag a safari to another column. The column under the pointer decides
// the slot and which of its two columns; dropping in the Open columns does
// nothing (a trip with guests belongs on a vehicle).
var dragId = null, hint = null, layout = { v: 0, nOpen: 1, c: [] };
function columnAt(e){
  var g = el("grid"), x = e.clientX - g.getBoundingClientRect().left - DAYW;
  var c = Math.floor(x / LANEW);
  var vs = data.slots.filter(function(x){ return x.kind !== "cancelled"; });
  if (c < 0) return null;
  if (c < layout.v * 2) return { slot: vs[Math.floor(c / 2)], lane: c % 2 + 1, col: c + 2 };
  var k = c - layout.v * 2 - layout.nOpen;
  if (k >= 0 && k < layout.c.length) return { slot: layout.c[k], lane: 1, col: c + 2 };
  return null;
}
function endDrag(){
  dragId = null; el("grid").classList.remove("dropping");
  el("grid").querySelectorAll(".dragging").forEach(function(x){ x.classList.remove("dragging"); });
  if (hint) { hint.remove(); hint = null; }
}
el("grid").addEventListener("dragover", function(e){
  if (!dragId) return;
  var at = columnAt(e);
  if (!at) { if (hint) hint.style.display = "none"; return; }
  e.preventDefault();
  var d = data.departures.find(function(x){ return x.id === dragId; }), r = range();
  var s = d.start_date < r.from ? r.from : d.start_date, en = d.end_date > r.to ? r.to : d.end_date;
  if (!hint) { hint = document.createElement("div"); hint.className = "drop-hint"; el("grid").appendChild(hint); }
  hint.style.display = "";
  hint.style.gridColumn = at.col;
  hint.style.gridRow = (diff(r.from, s) + 2) + " / span " + (diff(s, en) + 1);
});
el("grid").addEventListener("drop", function(e){
  if (!dragId) return;
  e.preventDefault();
  var id = dragId, at = columnAt(e);
  endDrag();
  if (at) moveTo(id, at.slot.id, at.lane);
});

function post(action, body){
  body.person_id = me && me.id;
  return fetch(FN + "?action=" + action, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(function(x){ return x.json(); })
    .then(function(res){ if (res.error) throw new Error(res.error); return res; });
}
function moveTo(id, slotId, lane){
  var d = data.departures.find(function(x){ return x.id === id; });
  var slot = data.slots.find(function(x){ return x.id === slotId; });
  if (d.slot_id === slotId && (d.lane || 1) === lane) return;
  setStatus("Moving " + label(d) + " to " + slot.label + "…");
  post("move", { departure_id: id, slot_id: slotId, lane: lane }).then(function(){
    setStatus(label(d) + " moved to " + slot.label + ". The tool will not move it again.");
    reload(id);
  }).catch(function(e){ setStatus("Could not move: " + e.message, true); });
}
// Reload the board and, if a panel was open, reopen it on the same safari.
function reload(openId){
  var r = range();
  fetch(FN + "?action=board&from=" + r.from + "&to=" + r.to).then(function(x){ return x.json(); }).then(function(d){
    if (d.error) throw new Error(d.error);
    data = d; draw(r);
    if (openId && el("panel").className === "on") openPanel(openId);
  }).catch(function(e){ setStatus("Could not load: " + e.message, true); });
}

// ---------------------------------------------------------------------
// Crew and vehicles (D-005, D-009). People, vehicles and trailers are the
// real ones at Bush Ways Safaris, owned by maintenance. Loaded once.
// ---------------------------------------------------------------------
var ROLE = { guide: "Guide", trainee_guide: "Trainee guide", chef: "Chef", camp_hand: "Camp hand", translator: "Translator" };
var opts = null;
function loadOptions(){
  if (opts) return Promise.resolve(opts);
  return fetch(FN + "?action=options").then(function(x){ return x.json(); }).then(function(o){ opts = o; return o; });
}
// Guides first for a guide's line, chefs and camp hands first for theirs;
// everyone else at Bush Ways Safaris after, since people cover.
function peopleFor(dept){
  var a = opts.people.filter(function(p){ return p.department === dept; });
  var b = opts.people.filter(function(p){ return p.department !== dept; });
  return a.concat(b);
}
// A guide drives a game-drive vehicle (GD), a chef a back-up (BU), by the
// type at the end of the vehicle's description in maintenance. The one
// already chosen always stays in the list.
function vehiclesOf(kind, current){
  return opts.vehicles.filter(function(v){
    return v.id === current || new RegExp("\\b" + kind + "\\s*$", "i").test(v.description || "");
  });
}
function sel(list, value, label, blank, cls){
  return '<select' + (cls ? ' class="' + cls + '"' : '') + '><option value="">' + (blank || "—") + '</option>' + list.map(function(x){
    return '<option value="' + x.id + '"' + (x.id === value ? " selected" : "") + '>' + esc(label(x)) + '</option>';
  }).join("") + '</select>';
}
function dates(x){
  var set = x.from_date || x.to_date;
  return '<details class="when"' + (set ? " open" : "") + '><summary>' + (set ? "Part of the safari" : "Whole safari") + '</summary>'
    + '<span class="dates"><input type="date" class="from" value="' + (x.from_date || "") + '"> to <input type="date" class="to" value="' + (x.to_date || "") + '"></span></details>';
}
function clashTxt(list, what){ return list ? '<div class="clashmsg">' + what + ' also on ' + esc(list.join(", ")) + ' at the same time</div>' : ""; }
function checkTxt(v){
  if (!v.check) return "";
  var c = v.check;
  if (c.raised_at) return '<div class="chk ok">Safari Vehicle Check open in Maintenance' + (c.stale ? '</div><div class="clashmsg">Changed since it opened: the check still shows the old vehicle, driver or trailer. Change it in Maintenance.' : '') + '</div>';
  if (c.error) return '<div class="clashmsg">Safari Vehicle Check not opened yet: ' + esc(c.error) + ' Tried again each morning.</div>';
  return '<div class="chk">Safari Vehicle Check opens ' + nice(c.due) + '</div>';
}

// A guide or chef with their vehicle: one row of departure_vehicles
// (game_drive for a guide, backup for a chef), the shape of maintenance's
// Safari Vehicle Check. Each opens its own check (D-011).
function driverRow(v){
  var guide = v.role === "game_drive";
  return '<tr class="vrow" data-role="' + v.role + '"' + (v.id ? ' data-id="' + v.id + '"' : '') + '><td><div class="vgrid">'
    + '<div>' + sel(peopleFor(guide ? "Guides" : "Chefs/Camp Hand"), v.driver_id, function(x){ return x.name; }, guide ? "Guide" : "Chef", "who") + clashTxt(v.driver_clash, "") + '</div>'
    + '<div>' + sel(vehiclesOf(guide ? "GD" : "BU", v.vehicle_id), v.vehicle_id, function(x){ return x.registration + " · " + (x.description || ""); }, guide ? "GD vehicle" : "BU vehicle", "veh") + clashTxt(v.clash, "Vehicle") + '</div>'
    + '<div></div><div>' + sel(opts.trailers, v.trailer_id, function(x){ return x.registration; }, "No trailer", "trl") + clashTxt(v.trailer_clash, "Trailer") + '</div>'
    + '</div>' + checkTxt(v) + dates(v) + '</td><td class="x"><button title="Remove">✕</button></td></tr>';
}
function crewRow(c){
  var who = c.role === "translator"
    ? '<input class="pname" placeholder="Translator\'s name" value="' + esc(c.name || c.person_name || "") + '">'
    : sel(peopleFor(c.role === "trainee_guide" ? "Guides" : "Chefs/Camp Hand"), c.person_id, function(x){ return x.name; }, ROLE[c.role], "who");
  return '<tr class="crow" data-role="' + c.role + '"><td>' + who + clashTxt(c.clash, "") + dates(c) + '</td><td class="x"><button title="Remove">✕</button></td></tr>';
}
var GROUPS = [
  { key: "game_drive", title: "Guides", add: "+ Add guide", vehicle: true },
  { key: "backup", title: "Chefs", add: "+ Add chef", vehicle: true },
  { key: "camp_hand", title: "Camp hands", add: "+ Add camp hand" },
  { key: "translator", title: "Translators", add: "+ Add translator" },
  { key: "trainee_guide", title: "Trainee guides", add: "+ Add trainee guide" },
];
// Additional notes (D-014): what is not recorded in ResRequest.
function notesSection(d){
  return '<h3 style="font-size:13px;margin:12px 0 4px">Additional notes</h3><div id="notesBox">'
    + (allowed ? '<textarea id="ntText" placeholder="Anything not recorded in ResRequest">' + esc(d.notes || "") + '</textarea>'
      + '<div class="edit"><button id="ntSave">Save notes</button> <span id="ntMsg"></span>'
      + (d.notes_updated_at ? '<span class="meta">Last saved ' + new Date(d.notes_updated_at).toLocaleString() + '</span>' : '') + '</div>'
      : '<p style="white-space:pre-wrap">' + esc(d.notes || "None.") + '</p>') + '</div>';
}

function crewSection(d){
  return '<h3 style="font-size:13px;margin:12px 0 2px">Crew and vehicles</h3>'
    + (d.two_vehicles ? '<p class="meta" style="margin:0 0 4px">Premium: the guide\'s game-drive vehicle and the chef\'s back-up. The back-up does not take a slot on the board.</p>' : '')
    + '<div id="crewBox"><p class="meta">Loading staff and vehicles…</p></div>'
    + (allowed ? '<div class="edit" style="margin-top:8px"><button id="crewSave">Save crew and vehicles</button> <span id="crewMsg"></span></div>' : '');
}
function wireCrew(d){
  if (!el("crewBox")) return;
  loadOptions().then(function(){
    // A chef or guide saved in the crew list before vehicles were attached
    // to them is shown on their vehicle line, so nothing is lost.
    var vs = d.vehicles.slice();
    d.crew.filter(function(c){ return c.role === "guide" || c.role === "chef"; }).forEach(function(c){
      var role = c.role === "guide" ? "game_drive" : "backup";
      if (!vs.some(function(v){ return v.role === role && v.driver_id === c.person_id; })) vs.push({ role: role, driver_id: c.person_id });
    });
    var cs = d.crew.filter(function(c){ return c.role !== "guide" && c.role !== "chef"; });
    var html = GROUPS.map(function(g){
      var rows = g.vehicle ? vs.filter(function(v){ return v.role === g.key || (g.key === "game_drive" && v.role === "extra"); })
                           : cs.filter(function(c){ return c.role === g.key; });
      if (!rows.length && (g.key === "game_drive" || g.key === "backup" || g.key === "camp_hand")) rows = [{ role: g.key }];
      return '<div class="grp"><div class="gt">' + g.title + '</div><table class="alloc" data-group="' + g.key + '"><tbody>'
        + rows.map(g.vehicle ? driverRow : crewRow).join("") + '</tbody></table>'
        + (allowed ? '<button class="ghost add" data-group="' + g.key + '">' + g.add + '</button>' : '') + '</div>';
    }).join("");
    el("crewBox").innerHTML = html;
    wireRows();
    el("crewBox").querySelectorAll("button.add").forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-group"), g = GROUPS.find(function(x){ return x.key === k; });
        el("crewBox").querySelector('table[data-group="' + k + '"] tbody').insertAdjacentHTML("beforeend", g.vehicle ? driverRow({ role: k }) : crewRow({ role: k }));
        wireRows();
      };
    });
  }).catch(function(e){ el("crewBox").innerHTML = '<p class="err">Could not load staff: ' + esc(e.message) + '</p>'; });

  function wireRows(){
    el("crewBox").querySelectorAll(".alloc .x button").forEach(function(b){ b.onclick = function(){ b.closest("tr").remove(); }; });
  }
  if (el("crewSave")) el("crewSave").onclick = function(){
    var vehicles = [], crew = [];
    el("crewBox").querySelectorAll("tr.vrow").forEach(function(tr){
      vehicles.push({ id: tr.getAttribute("data-id") || undefined, role: tr.getAttribute("data-role"),
        driver_id: tr.querySelector("select.who").value, vehicle_id: tr.querySelector("select.veh").value,
        trailer_id: tr.querySelector("select.trl").value,
        from_date: tr.querySelector(".from").value, to_date: tr.querySelector(".to").value });
    });
    el("crewBox").querySelectorAll("tr.crow").forEach(function(tr){
      var ps = tr.querySelector("select.who"), pn = tr.querySelector(".pname");
      crew.push({ role: tr.getAttribute("data-role"), person_id: ps ? ps.value : "", person_name: pn ? pn.value : "",
        from_date: tr.querySelector(".from").value, to_date: tr.querySelector(".to").value });
    });
    el("crewMsg").className = ""; el("crewMsg").textContent = "Saving…";
    post("crew", { departure_id: d.id, crew: crew, vehicles: vehicles }).then(function(res){
      el("crewMsg").className = "saved";
      el("crewMsg").textContent = "Saved." + (res.raised ? " " + res.raised + " Safari Vehicle Check" + (res.raised === 1 ? "" : "s") + " opened in Maintenance." : "");
      reload(d.id);
    }).catch(function(e){ el("crewMsg").className = "err"; el("crewMsg").textContent = "Not saved: " + e.message; });
  };
}

// Night by night: the area from the route, and the campsite a person
// enters. Nights whose area is a region are marked: those need one (D-003).
function nightsTable(d){
  if (!d.nights.length) return "";
  var rows = d.nights.map(function(n, i){
    var cell = allowed
      ? '<input data-date="' + n.date + '" value="' + esc(n.campsite || "") + '" placeholder="' + (n.needs_campsite ? "campsite" : "") + '">'
      : esc(n.campsite || "");
    return '<tr class="' + (n.needs_campsite && !n.campsite ? "need" : "") + '"><td>' + (i + 1) + '</td><td>' + nice(n.date) + '</td>'
      + '<td class="area' + (n.needs_campsite ? " need" : "") + '">' + esc(n.area || "—") + '</td><td>' + cell + '</td></tr>';
  }).join("");
  var stray = (d.stray_days || []).map(function(x){ return '<li>' + nice(x.date) + ": " + esc(x.campsite || x.note) + '</li>'; }).join("");
  return '<h3 style="font-size:13px;margin:12px 0 4px">Nights and campsites</h3>'
    + '<table class="nights"><tr><th>Night</th><th>Date</th><th>Area</th><th>Campsite</th></tr>' + rows + '</table>'
    + (stray ? '<p class="err">Entered for nights this safari no longer covers (ResRequest moved its dates):</p><ul>' + stray + '</ul>' : '')
    + (allowed ? '<div class="edit"><button id="csSave">Save campsites</button> <span id="csMsg"></span></div>' : '');
}

// The guest mix: seats per safari type, like the Tour Master's "8PC 3FC".
function mixText(d){
  return d.mix.map(function(m){ return m.type + " " + m.seats; }).join(" · ");
}
function mixBox(d){
  if (!d.mix.length) return "";
  var several = d.mix.length > 1;
  return '<div class="mix">' + d.mix.map(function(m){
    var whole = m.from === d.start_date && m.to === d.end_date;
    var tl = lookOf({ type: m.type, product: d.product });
    return '<div class="mx sx" style="' + vars(tl) + '"><b>' + m.seats + '</b><span>' + esc(m.type) + '</span>'
      + (several && !whole ? '<small>' + nice(m.from) + ' → ' + nice(m.to) + '</small>' : '') + '</div>';
  }).join("") + '</div>';
}

var STATUS = { "30": ["Confirmed", "c"], "20": ["Provisional", "p"], "90": ["Cancelled", "x"], "0": ["Not live", ""] };
function openPanel(id){
  var d = data.departures.find(function(x){ return x.id === id; });
  if (!d) return;
  var slot = data.slots.find(function(s){ return s.id === d.slot_id; });
  var tailor = d.product === "Tailor Made";

  var live = d.bookings.filter(function(b){ return !b.is_master && (b.rr_status === "30" || b.rr_status === "20"); })
    .sort(function(a, b){ return a.arrive_date < b.arrive_date ? -1 : a.arrive_date > b.arrive_date ? 1 : (a.type || "").localeCompare(b.type || ""); });
  var other = d.bookings.filter(function(b){ return !b.is_master && live.indexOf(b) < 0; });
  var master = d.bookings.find(function(b){ return b.is_master; });

  function card(b){
    var st = STATUS[b.rr_status] || [b.rr_status, ""];
    var seats = tailor ? (b.pax != null ? b.pax + " guests" : "") : (b.units != null ? b.units + (b.units === 1 ? " seat" : " seats") : "");
    var join = b.arrive_date !== d.start_date || b.depart_date !== d.end_date
      ? '<div class="t">' + nice(b.arrive_date) + " → " + nice(b.depart_date) + '</div>' : "";
    var notes = [["Guests", b.rr_guest], ["Note", b.rr_note], ["Memo", b.rr_memo]]
      .filter(function(n){ return n[1]; })
      .map(function(n){ return '<div class="n"><em>' + n[0] + '</em>' + esc(n[1].trim()) + '</div>'; }).join("");
    return '<div class="bk"><div class="h"><span>' + (b.type && !b.is_master ? '<span class="sf sx" style="' + vars(lookOf({ type: b.type, product: d.product })) + '">' + esc(b.type) + '</span> ' : '') + esc(b.name) + ' <span style="color:#8A8270;font-weight:400">' + esc(b.reservation_id) + '</span></span>'
      + '<span>' + esc(seats) + ' <span class="tag ' + st[1] + '">' + st[0] + '</span></span></div>' + join + (notes || '<div class="n" style="color:#8A8270">No notes in ResRequest.</div>') + '</div>';
  }

  var p = el("panel");
  p.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:start;gap:10px">'
    + '<div><h2>' + esc(label(d)) + '</h2><p class="meta">' + esc(d.product) + " · " + esc(d.type) + '</p></div>'
    + '<button class="ghost" id="closePanel">Close ✕</button></div>'
    + mixBox(d)
    + '<table><tr><th>Dates</th><td>Pre night ' + nice(add(d.start_date, -1)) + '<br>' + nice(d.start_date) + " → " + nice(d.end_date) + " (" + diff(d.start_date, d.end_date) + " nights)"
    + (d.end_date_estimated ? '<br><span class="tag p">End estimated — no guests yet</span>' : '') + '</td></tr>'
    + '<tr><th>Vehicle</th><td>' + (slot ? esc(slot.label) + " · column " + (d.lane || 1) + (d.placed_by_person ? ' <span class="pin">· placed by hand</span>' : " · placed automatically") : (d.has_guests ? '<span class="tag x">No slot free</span>' : "Open — no guests yet"))
    + (allowed ? '<div class="edit"><select id="mvSlot">' + data.slots.map(function(x){ return '<option value="' + x.id + '"' + (x.id === d.slot_id ? " selected" : "") + '>' + esc(x.label) + '</option>'; }).join("")
      + '</select><select id="mvLane"><option value="1"' + ((d.lane || 1) === 1 ? " selected" : "") + '>column 1</option><option value="2"' + (d.lane === 2 ? " selected" : "") + '>column 2</option></select>'
      + '<button id="mvGo">Move</button>'
      + (d.placed_by_person && !d.shelved ? '<button class="ghost" id="mvAuto">Let the tool place it</button>' : '')
      + (!d.shelved ? '<button class="ghost" id="mvCancel">Move to Cancelled</button>' : '<button id="mvAuto">Put it back on the board</button>') + '</div>' : '')
    + '</td></tr>'
    + '<tr><th>Seats</th><td>' + d.seats + (d.max_seats ? " of " + d.max_seats : "") + ' on the busiest night'
    + (d.booked !== d.seats ? '<br><span class="meta">' + d.booked + ' booked in all: some leave before others join</span>' : '') + '</td></tr>'
    + '<tr><th>Status</th><td>' + (d.shelved ? '<span class="tag x">Cancelled on the board</span> everything kept; drag it onto a vehicle or press Put it back to reactivate' : esc(d.status)) + '</td></tr></table>'
    + notesSection(d)
    + crewSection(d)
    + nightsTable(d)
    + (master ? '<h3 style="font-size:13px;margin:12px 0 6px">Bush Ways master booking</h3>' + card(master) : '')
    + '<h3 style="font-size:13px;margin:12px 0 6px">Guest bookings (' + live.length + ')</h3>'
    + (live.map(card).join("") || '<p class="meta">None yet.</p>')
    + (other.length ? '<details style="margin-top:10px"><summary style="cursor:pointer;color:#6B6455">Not live in ResRequest (' + other.length + ')</summary>' + other.map(card).join("") + '</details>' : '');
  p.className = "on";
  el("closePanel").onclick = function(){ p.className = ""; };
  if (el("mvGo")) el("mvGo").onclick = function(){ moveTo(d.id, el("mvSlot").value, +el("mvLane").value); };
  if (el("mvAuto")) el("mvAuto").onclick = function(){
    // Also "Put it back on the board": the tool places it on a free vehicle.
    setStatus("Handing " + label(d) + " back to the tool…");
    post("release", { departure_id: d.id }).then(function(){ setStatus(label(d) + " placed by the tool again."); reload(d.id); })
      .catch(function(e){ setStatus("Could not: " + e.message, true); });
  };
  wireCrew(d);
  if (el("ntSave")) el("ntSave").onclick = function(){
    el("ntMsg").className = ""; el("ntMsg").textContent = "Saving…";
    post("notes", { departure_id: d.id, notes: el("ntText").value }).then(function(){
      el("ntMsg").className = "saved"; el("ntMsg").textContent = "Saved."; reload(d.id);
    }).catch(function(e){ el("ntMsg").className = "err"; el("ntMsg").textContent = "Not saved: " + e.message; });
  };
  // Move to the first Cancelled column free for these dates.
  if (el("mvCancel")) el("mvCancel").onclick = function(){
    var cs = data.slots.filter(function(x){ return x.kind === "cancelled"; });
    var free = cs.find(function(c){
      return !data.departures.some(function(o){ return o !== d && o.slot_id === c.id && o.start_date < d.end_date && d.start_date < o.end_date; });
    }) || cs[0];
    moveTo(d.id, free.id, 1);
  };
  if (el("csSave")) el("csSave").onclick = function(){
    var days = [];
    p.querySelectorAll("input[data-date]").forEach(function(i){ days.push({ date: i.getAttribute("data-date"), campsite: i.value }); });
    el("csMsg").className = ""; el("csMsg").textContent = "Saving…";
    post("campsites", { departure_id: d.id, days: days }).then(function(){
      el("csMsg").className = "saved"; el("csMsg").textContent = "Saved.";
      reload(d.id);
    }).catch(function(e){ el("csMsg").className = "err"; el("csMsg").textContent = "Not saved: " + e.message; });
  };
}
document.addEventListener("keydown", function(e){ if (e.key === "Escape") el("panel").className = ""; });

// Update from ResRequest: the same small read the nightly job makes, only
// what was edited since the last clean run (D-015; ResRequest's fair-usage
// rules, daily-operations D-033). Not a month-by-month pull.
el("sync").onclick = function(){
  var btn = el("sync");
  btn.disabled = true;
  setStatus("Reading changes from ResRequest…");
  fetch(FN + "?action=sync_delta", { method: "POST" }).then(function(x){ return x.json(); }).then(function(res){
    if (res.error) throw new Error(res.error);
    btn.disabled = false;
    setStatus("Updated: " + res.safari_bookings + " safari booking" + (res.safari_bookings === 1 ? "" : "s") + " changed, "
      + res.placed + " new departure" + (res.placed === 1 ? "" : "s") + " placed.");
    load();
  }).catch(function(e){ btn.disabled = false; setStatus("ResRequest update failed: " + e.message, true); });
};

load();
</script>
</body></html>
