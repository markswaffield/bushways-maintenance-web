<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Day Sheet</title>
<!--
  The Day Sheet — tools/daily-operations/.

  A LAPTOP SCREEN, deliberately, and a wide grid rather than cards. Mark,
  2026-09-10, correcting a first version built as phone-first cards:
  "the day sheet will only be viewed on a laptop... it is critical that
  it replicates what the spreadsheet looks like... when planning a day
  sheet for a lodge that includes collections, drop offs, activities etc
  - it is critical that we can see the whole picture - ie all the rooms
  and all the movements together. This is how we can spot logistical
  errors."

  So the grid is not a cosmetic preference. Seeing every room and every
  movement at once IS the function: it is how a manager notices the same
  vehicle doing a collection and a drop-off at the same time, or a guide
  in two places. Cards break that, which is why they were wrong. Do not
  "improve" this back into cards.

  Root D-016 (a phone-first page) governs the staff-facing screens of the
  maintenance tool. It does not govern this one — housekeeping and guides
  do not need this on their phones at all; it is a management planning
  screen. See tool-local D-004.

  The sheet is still transferred onto the camp whiteboard afterwards, so
  it prints: @media print drops the controls and lays the grid flat.

  Layout follows tools/daily-operations/drafts/Day Sheet.xlsx column for
  column. ONE ROW PER ROOM, not per booking.

  Sign-in is the same stand-in as every other page here — pick your name
  from the seeded test people. Root D-017 replaces it with a WhatsApp
  code; nothing changes here when it does.
-->
<style>
  *{box-sizing:border-box}
  /* The page itself must not scroll. Mark, 2026-09-19: "the header line
     moves when you go right down to the bottom of the page and the chart
     floats around the page as well" — both are the same cause. With the
     page scrolling as well as the grid, the box the header is pinned to
     was itself travelling up the screen, so the header moved with it.
     Locking the page to the viewport leaves exactly one scroller, the
     grid, and everything holds still. */
  html,body{height:100%}
  body{font:14px/1.35 -apple-system,system-ui,sans-serif;margin:0;padding:14px 14px 0;background:#F7F5F0;color:#232019;
       height:100vh;overflow:hidden;display:flex;flex-direction:column}
  #app{flex:1;min-height:0;display:flex;flex-direction:column}
  h1{font-size:18px;margin:0 0 3px}
  .sub{color:#6B6455;font-size:12.5px;margin:0 0 4px}
  .nav{font-size:12.5px;margin:8px 0 0}
  .toolbar{position:sticky;top:0;z-index:30;display:flex;gap:10px;flex-wrap:wrap;align-items:end;
           margin:12px 0 0;padding:10px 12px;border:1px solid #C9C2AC;border-radius:8px;background:#fff;
           box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .toolbar label{display:block;font-size:11px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:0 0 3px}
  select,input,textarea{padding:6px;font-size:13px;border:1px solid #C9C2AC;border-radius:5px;background:#fff;font-family:inherit}
  button{padding:7px 13px;font-size:13.5px;font-family:inherit;border:1px solid #43594A;background:#43594A;color:#fff;border-radius:6px;cursor:pointer}
  button.ghost{background:#fff;color:#43594A}
  button:disabled{opacity:.4;cursor:default}
  .status{font-size:12.5px;color:#6B6455}
  .status.ok{color:#2F6B45}
  .status.err{color:#A8502F}
  .status.dirty{color:#8C6A2F;font-weight:600}
  .whoami{display:inline-block;font-size:13.5px;font-weight:600;padding:6px 0;color:#232019}

  /* The header was already marked sticky and never stuck. A container
     with overflow-x:auto computes overflow-y to auto as well, which makes
     it its own scroll box — so "top:0" pinned the header to a box that
     never scrolled vertically, while the page scrolled underneath it.
     Giving the box a real height moves the vertical scrolling inside it,
     and both the header and the frozen columns then work.
     Mark, 2026-09-19: "can we fix the header row so it stays static". */
  /* The one scroller on the page, filling whatever height is left.
     min-height:0 is what lets a flex child actually shrink and scroll
     rather than growing to fit its content and pushing the page taller. */
  .scroll{flex:1;min-height:0;overflow:auto;margin-top:10px;
          border:1px solid #C9C2AC;border-radius:8px;background:#fff}
  /* table-layout:fixed, with every width declared in the colgroup below.
     Mark, 2026-09-19: "if you scroll right it compresses the Room
     column". With the default auto layout the browser re-apportions
     width from the content as it goes, and a sticky column has no say in
     it — so the frozen columns squeezed the moment the grid scrolled.
     Fixed layout honours the declared widths exactly and nothing moves.
     The widths live in COLS and are load-bearing twice over: the frozen
     columns' left offsets are the running total of the ones before. */
  table{border-collapse:separate;border-spacing:0;font-size:12.5px;table-layout:fixed;width:max-content;min-width:100%}
  th,td{border-right:1px solid #EDE9DE;border-bottom:1px solid #EDE9DE;padding:0;vertical-align:top}
  thead th{position:sticky;top:0;z-index:10;background:#4C3B2C;color:#fff;font-weight:700;
           text-align:left;padding:5px 6px;font-size:11px;letter-spacing:.02em;white-space:nowrap}
  thead tr.groups th{top:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:4px 6px}
  thead tr.cols th{top:25px}

  /* Frozen down the left, through the guest name — Mark: "can we fix up
     to the guest name row so it also remains static". Five columns, each
     offset by the sum of those before it, so they have to carry explicit
     widths. Header cells sit above body cells at the same offset. */
  td.room,      th.c-room   {position:sticky;left:0}
  td.status-cell,th.c-status{position:sticky;left:58px}
  td.c-pax,     th.c-pax    {position:sticky;left:154px}
  td.c-type,    th.c-type   {position:sticky;left:200px}
  td.c-names,   th.c-names  {position:sticky;left:292px}
  tbody td.room,tbody td.status-cell,tbody td.c-pax,tbody td.c-type,tbody td.c-names{z-index:5}
  thead th.c-room,thead th.c-status,thead th.c-pax,thead th.c-type,thead th.c-names{z-index:20}
  /* The last frozen column carries the seam, so the join reads as one
     edge rather than five. */
  td.c-names,th.c-names{border-right:2px solid #C9C2AC}
  /* Frozen body cells need an opaque background or the scrolling columns
     show through them. */
  tbody td.status-cell,tbody td.c-pax,tbody td.c-type,tbody td.c-names{background:#fff}
  tbody tr:nth-child(even) td.status-cell,
  tbody tr:nth-child(even) td.c-pax,
  tbody tr:nth-child(even) td.c-type,
  tbody tr:nth-child(even) td.c-names{background:#FCFBF8}
  th.g-arr{background:#3F6B4C}
  th.g-stay{background:#5B5344}
  th.g-dep{background:#8C6A2F}
  th.g-stay{background:#4C3B2C}
  th.g-act{background:#5B6E8C}
  th.g-mnt{background:#A8502F}
  .summary{font-size:13px;color:#5B5344;margin:12px 0 0}
  .summary b{color:#232019}
  td.status-cell{padding:5px 6px;white-space:nowrap;text-align:center}
  td.status-cell .state{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.03em}
  td.status-cell .night{display:block;font-size:10.5px;color:#8C8571;margin-top:2px}
  .state.turnover{background:#F4CFC2;color:#A8502F}
  .state.arriving{background:#D9E6DC;color:#2F6B45}
  .state.departing{background:#F4E3D3;color:#8C6A2F}
  .state.staying{background:#E7E3D7;color:#5B5344}
  .state.empty{background:#F1EDE4;color:#A8A192}
  tbody tr.st-turnover td.room{background:#F4CFC2;color:#A8502F}
  tbody tr.st-arriving td.room{background:#D9E6DC;color:#2F6B45}
  tbody tr.st-departing td.room{background:#F4E3D3;color:#8C6A2F}
  tbody tr.st-empty td{background:#FAF9F5}
  tbody tr.st-empty td.room{background:#F1EDE4;color:#A8A192}
  th.g-room{background:#4C3B2C}
  td.room{background:#F1EDE4;font-weight:700;text-align:center;
          padding:6px 4px;line-height:1.15;overflow-wrap:anywhere}
  tbody tr:nth-child(even) td{background:#FCFBF8}
  tbody tr:nth-child(even) td.room{background:#EDE8DC}
  tbody tr.turnover td.room{background:#F4CFC2;color:#A8502F}
  td.mnt{background:#FDF6F4!important}
  td input,td select,td textarea{width:100%;border:0;border-radius:0;background:transparent;padding:5px 6px;font-size:12.5px}
  td input:focus,td select:focus,td textarea:focus{outline:2px solid #43594A;outline-offset:-2px;background:#fff}
  td.ro{padding:5px 6px;color:#232019}
  td.ro .name{font-weight:600}
  td.ro .ref{color:#8C8571;font-size:11px}
  td.dim{background:#F7F5F0}
  tbody tr:nth-child(even) td.dim{background:#F2F0E9}
  .diet{display:block;font-size:11px;color:#A8502F;font-weight:600;margin-top:1px}
  .diet.req{color:#6B5A8C;font-weight:400}
  .diet b{display:inline-block;min-width:13px;color:#6B6353}
  /* The Type column's two tags: bed configuration and board basis. Short and
     boxed so the column reads as a pair of codes at a glance, not as prose. */
  .tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;
       padding:1px 4px;border-radius:3px;margin:1px 2px 1px 0;
       background:#EDEAE0;color:#4A4437;border:1px solid #DCD7C8}
  .tag.basis{background:#E4EDE6;color:#2F5A3C;border-color:#CBDCD1}
  /* Anything read out of a sentence rather than a labelled line. It is
     probably right, but a manager should glance at it — hover shows the
     sentence it came from. Never styled the same as a confident value. */
  .tag.unsure,.diet.unsure{border-style:dashed;opacity:.85}
  .diet.unsure{text-decoration:underline dotted #C9A227}
  [title]{cursor:help}
  /* The Notes cell now always carries all three labels, filled or not — an
     empty Medical line says "nobody told us", which is different from the
     question never having been asked. Empty ones are greyed so the filled
     ones still carry the eye. */
  .diet.empty{color:#A9A395;font-weight:400}
  .diet i{color:#8C8571;font-style:normal}
  td.c-notes .diet{line-height:1.35}

  /* The way back to the Operations Chart's own words. A small marker in the
     frozen Names column, so it is reachable however far right you scroll. */
  .srcbtn{width:15px;height:15px;padding:0;line-height:13px;font-size:10px;font-weight:700;
          font-family:Georgia,serif;font-style:italic;border-radius:50%;vertical-align:1px;
          border:1px solid #B8B0A0;background:#F4F1E8;color:#5B5344;cursor:pointer}
  .srcbtn:hover{background:#122d31;color:#fff;border-color:#122d31}
  .srcback{position:fixed;inset:0;background:rgba(18,45,49,.45);z-index:200;
           display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .srcbox{background:#fff;max-width:760px;width:100%;border-radius:8px;padding:16px 18px 14px;
          box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .srchead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
           border-bottom:1px solid #E6E1D4;padding-bottom:8px;margin-bottom:10px}
  .srchead .meta{font-size:11.5px;color:#6B6353;margin-top:2px}
  .srcbox h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#6B6353;
             margin:14px 0 4px}
  .srcvals{width:100%;border-collapse:collapse;margin-bottom:4px}
  .srcvals th{text-align:left;width:120px;font-size:11.5px;color:#6B6353;font-weight:600;
              padding:3px 8px 3px 0;vertical-align:top}
  .srcvals td{font-size:12.5px;padding:3px 0;vertical-align:top}
  /* The original text, as the export had it — monospaced so the agent's own
     line breaks and spacing read the way they were typed. */
  .srctext{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#3A352B;
           background:#FBFAF6;border:1px solid #EBE6D9;border-radius:5px;padding:8px 10px;
           max-height:230px;overflow:auto;white-space:normal}
  .srctext mark{background:#FFF3B0;padding:1px 0}
  .srctext mark.ai{background:#FFE0B2;outline:1px dotted #C9A227}
  .pill.amber{background:#FDF0D5;color:#8A6A12;border:1px solid #E8D39A}
  @media print{ .srcback,.srcbtn{display:none!important} }
  .src{display:block;font-size:11px;color:#8C8571}
  .sub-name{display:block;font-size:11px;color:#5B5344;margin-top:1px}
  td.two{padding:4px 5px}
  td.two input.sub{width:100%;border:1px dashed #C9C2AC;border-radius:4px;padding:3px 4px;margin-top:3px;font-size:11.5px;background:#FCFBF8}
  td.two input.sub:focus{border-style:solid;background:#fff}
  td.two input.sub::placeholder{color:#B5AE9C;font-style:italic}
  .clash{outline:2px solid #A8502F;outline-offset:-2px;background:#FDECE6!important}
  .overload{outline:2px solid #B8860B;outline-offset:-2px;background:#FBF3DF!important}
  .warn.amber{color:#8C6A2F}

  /* Bookings, notes and adding a booking used to sit under the grid,
     which is what made the page taller than the screen in the first
     place. They are a drawer now: closed by default, so the grid gets
     the whole window, and opening one does not move the grid's header. */
  .drawer{flex:none;max-height:42vh;overflow:auto;margin-top:10px;padding-bottom:12px}
  .drawer[hidden]{display:none}
  .below{display:flex;gap:14px;flex-wrap:wrap;margin-top:0}
  .panel{flex:1 1 320px;background:#fff;border:1px solid #C9C2AC;border-radius:8px;padding:11px 13px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#43594A;margin:0 0 8px}
  .panel textarea{width:100%;border:1px solid #C9C2AC;border-radius:5px;padding:7px}
  .place{border-top:1px solid #F1EDE4;padding:8px 0}
  .place:first-of-type{border-top:0}
  .place .who{font-weight:600}
  .place .meta{color:#6B6455;font-size:12px;margin:1px 0 5px}
  .place .row{display:flex;gap:6px;align-items:center}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;background:#F4CFC2;color:#A8502F}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px}
  .grid2 label{display:flex;flex-direction:column;font-size:11px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em}
  .grid2 label input{margin-top:3px}
  .warn{font-size:12.5px;color:#A8502F;margin:8px 0 0}
  .loading{color:#6B6455;margin-top:18px}


  /* ── Small screens ──────────────────────────────────────────────────
     Mark, 2026-09-19: "the day sheet works on the computer screen and I
     do not want change that... the top menu blocks and buttons consume
     most of the screen space - so you cannot see the matrix and move
     around in it."

     Everything below is inside max-width queries, so the desktop layout
     is untouched by design, not by care. Two separate problems get
     solved: the chrome above the grid, and the frozen columns.

     THE FROZEN COLUMNS ARE THE BIGGER ONE, and it is not obvious. Room,
     Status, Pax, Type and Names come to 464px. A phone is 390px wide, so
     the frozen block alone is wider than the screen — there is literally
     nowhere for the scrolling columns to appear, and the grid looks
     broken rather than cramped. Fewer columns are frozen the narrower
     the screen gets. */

  /* "More grid" — hides everything above the toolbar and the toolbar's
     own optional buttons, so the matrix gets the rest. Useful on a
     laptop, close to essential on a phone, where the chrome was most of
     the screen. Deliberately a toggle rather than auto-hide-on-scroll:
     the grid is the only thing that scrolls, so a scroll-driven header
     would flicker every time somebody moved sideways. */
  body.lean h1, body.lean .sub, body.lean .nav{display:none}
  body.lean .toolbar{margin-top:0}
  body.lean .toolbar .lean-hide{display:none}

  @media (max-width: 1024px) {
    body{padding:8px 8px 0}
    h1{font-size:16px;margin:0}
    .sub{display:none}                  /* explanatory, not operational */
    .nav{margin:6px 0 0}
    .toolbar{gap:6px;padding:7px 8px;margin-top:6px}
    .toolbar label{font-size:10px;margin:0 0 1px}
    .toolbar button,.toolbar input,.toolbar select{padding:5px 9px;font-size:13px}
    .scroll{margin-top:6px}
    /* iPad: Names is the column worth keeping beside the room number,
       so Pax and Type give up their frozen place. */
    td.c-pax,th.c-pax,td.c-type,th.c-type{position:static}
    td.c-names,th.c-names{left:154px}
  }

  @media (max-width: 700px) {
    /* A phone. Only the room number stays pinned — it is the one thing
       you need to know which row you are reading. */
    td.c-names,th.c-names,td.status-cell,th.c-status{position:static}
    td.c-names,th.c-names{border-right:0}
    td.room,th.c-room{border-right:2px solid #C9C2AC}
    /* The header collapses to one line: title, then the buttons wrap
       under it only if they must. */
    h1{font-size:15px}
    .toolbar{padding:6px}
    .toolbar .full-only{display:none}   /* Print and Refresh: not phone jobs */
    .whoami{font-size:12px}
  }

  @media print{
    body{padding:0;background:#fff;font-size:10px}
    .toolbar,.nav,.below .panel.addbooking,.place .row,button{display:none!important}
    .scroll{overflow:visible;border:0}
    thead th{position:static;color:#000;background:#EEE!important;border:1px solid #999}
    td.room,td.status-cell,td.c-pax,td.c-type,td.c-names,
    th.c-room,th.c-status,th.c-pax,th.c-type,th.c-names{position:static}
    html,body{height:auto;overflow:visible;display:block}
    #app{display:block}
    .scroll{max-height:none;flex:none;overflow:visible}
    .drawer{max-height:none;overflow:visible}
    td,th{border:1px solid #BBB}
    td input,td select,td textarea{border:0;padding:2px}
  }
  [hidden]{display:none!important}
</style></head><body>

<h1 id="campTitle">Day Sheet</h1>
<p class="sub">Every room and every movement on one screen. Built to be read across, so a clash stands out.</p>
<!-- A different tool now (root D-020), reached through the group's own
     picker (root D-025/D-026), not through Maintenance's own nav —
     tool-local D-008, 2026-09-18. A plain way back to that picker
     instead of Maintenance's own five links, which never belonged
     here in the first place. -->
<p class="nav">
  <button class="ghost" style="width:auto;display:inline-block" onclick="location.href='./'">← Change camp / tool</button>
  <button class="ghost" id="signOut" style="width:auto;display:inline-block;margin-left:10px">Sign out</button>
</p>

<div class="toolbar">
  <div class="lean-hide"><label>Signed in as</label><span class="whoami" id="whoami"></span></div>
  <div><label for="date">Date</label><input type="date" id="date"></div>
  <div><button id="save" disabled>Save changes</button></div>
  <div class="full-only"><button class="ghost" id="reload">Refresh</button></div>
  <div class="full-only lean-hide"><button class="ghost" id="print">Print</button></div>
  <div><button id="importBtn" title="Choose a ResRequest Operations Chart export">Import Ops Chart</button></div>
  <div><button class="ghost" id="drawerBtn">Bookings &amp; notes</button></div>
  <div><button class="ghost" id="leanBtn" title="Give the grid the whole screen">⤢ More grid</button></div>
  <div style="align-self:center"><span class="status" id="status"></span></div>
</div>

<div id="app"><p class="loading">Loading…</p></div>

<script>
var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/day-sheet";
var boot = null, sheet = null, unplaced = [], placed = [], dirty = {};
// The drawer holding bookings, notes and add-a-booking. Closed by
// default so the grid gets the whole window.
var drawerOpen = false;

// A real sign-in gate — tool-local D-008, 2026-09-18. This page had
// none at all before: anyone with the link could open and edit any
// camp's day sheet. Reads the exact same bw_signin the group's own
// landing picker just wrote (same origin, D-025/D-026) — nothing new
// to sign in with, and nobody reaches this page any more without
// having already been through that picker, which is itself gated to
// managers and administrators only.
var me = null;
try { var savedMe = sessionStorage.getItem("bw_signin"); if (savedMe) me = JSON.parse(savedMe); } catch (e) {}
if (!me) { location.href = "./"; }
var camp = null;
try { var savedCamp = sessionStorage.getItem("bw_camp"); if (savedCamp) camp = JSON.parse(savedCamp); } catch (e) {}
var shownCamp = camp || (me && me.locations && me.locations[0]);
if (shownCamp) {
  document.getElementById("campTitle").textContent = "Day Sheet — " + shownCamp.name;
  document.title = shownCamp.name + " — Day Sheet";
}
function campParam() {
  return shownCamp ? "&location_id=" + encodeURIComponent(shownCamp.id) : "";
}
document.getElementById("signOut").onclick = function () {
  sessionStorage.removeItem("bw_signin");
  sessionStorage.removeItem("bw_camp");
  location.href = "./";
};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
// Whoever signed in, full stop — Mark, 2026-09-19: "it does not
// automatically pick your name as the person who signed in - so it will
// not be auditing who made changes". A dropdown that could be set to
// somebody else is not an audit trail, it is a suggestion.
function personId(){ return me && me.id; }
function setStatus(t,cls){var s=el("status");s.textContent=t;s.className="status"+(cls?" "+cls:"");}

function opts(list, sel){
  var out = '<option value="">—</option>';
  list.forEach(function(o){
    var label = o.label || o.name || o.registration;
    out += '<option value="'+esc(o.id)+'"'+(sel===o.id?" selected":"")+">"+esc(label)+"</option>";
  });
  return out;
}
// scope "day" writes to the day sheet row; scope "stay" writes to the
// stay itself, so it shows on every day of that party's stay.
function val(row, key, scope){
  if (scope === "stay") return (row.stay && row.stay[key]) || "";
  return (row.saved && row.saved[key]) || "";
}
// Who may appear in each role picker. Mark, 2026-09-19: they "should
// only reflect the relevant staff from that department in that lodge".
// The lodge half is done in the Edge Function (only this camp's people
// come back at all); this is the department half.
//
// Matched on the real department names from notes/Lodge Departments -
// master.docx. An unknown or missing department falls back to the whole
// list rather than an empty box — better to show too many than to make a
// role unfillable because somebody's department was not set.
//
// Guides and Drivers split in two, 2026-09-24 (maintenance tool-local
// D-093). Mark's rules: game drives are guides only, so the guide box is
// the Guides department; a guest transfer "can be driven by anyone
// indicated within the Guest column", so both driver boxes list whoever
// at this camp has can_drive_guests, whatever their department —
// managers and maintenance staff included.
var ROLE_DEPARTMENTS = {
  housekeeper_id: ["Housekeeping"],
  guide_id: ["Guides"],
};
var GUEST_DRIVER_ROLES = ["arrival_driver_id", "departure_driver_id"];
function peopleFor(key){
  var matching;
  if (GUEST_DRIVER_ROLES.indexOf(key) !== -1) {
    matching = boot.people.filter(function (p) { return p.can_drive_guests; });
  } else {
    var want = ROLE_DEPARTMENTS[key];
    if (!want) return boot.people;
    matching = boot.people.filter(function (p) { return want.indexOf(p.department) !== -1; });
  }
  return matching.length ? matching : boot.people;
}

function cellSelect(row,key,list,scope){
  if (scope === "stay" && !row.stay) return '<td class="dim"></td>';
  var choices = (list === boot.people) ? peopleFor(key) : list;
  return '<td><select data-room="'+row.room_id+'" data-key="'+key+'" data-scope="'+(scope||"day")+'">'
       + opts(choices, val(row,key,scope)) + "</select></td>";
}
// ETA and ETD change constantly, so the camp always overrides - Mark,
// 2026-09-11: "these can change at any time - so camp needs to be able
// to override the ResReq info". ResRequest's value (when it has one -
// today it returns dates, not times) sits above, greyed and read-only;
// the camp's is the box, and is what the sheet actually means.
function cellTime(row, key, fromResRequest){
  var v = (row.saved && row.saved[key]) || "";
  var h = "";
  if (fromResRequest) h += '<span class="src">'+esc(fromResRequest)+"</span>";
  h += '<input type="text" class="sub" placeholder="—" data-room="'+row.room_id
    +  '" data-key="'+key+'" data-scope="day" value="'+esc(v)+'">';
  return '<td class="ro two">'+h+"</td>";
}
// The same two layers as cellTime, for the movement details. The top line is
// what the Operations Chart said about reaching or leaving THIS camp; the box
// below is the camp's own and a re-import never touches it (D-006).
// Hover the top line to see the sentence it was read from.
function cellMovement(row, key, fromExport, ev){
  var v = (row.saved && row.saved[key]) || "";
  var h = "";
  if (fromExport){
    var unsure = ev && ev.confident === false ? " unsure" : "";
    h += '<span class="src'+unsure+'" title="'+esc((ev && ev.source) || "from the booking")+'">'
      +  esc(fromExport)+"</span>";
  }
  h += '<input type="text" class="sub" placeholder="—" data-room="'+row.room_id
    +  '" data-key="'+key+'" data-scope="day" value="'+esc(v)+'">';
  return '<td class="ro two">'+h+"</td>";
}

function cellText(row,key,scope){
  if (scope === "stay" && !row.stay) return '<td class="dim"></td>';
  return '<td><input type="text" data-room="'+row.room_id+'" data-key="'+key+'" data-scope="'+(scope||"day")+'" value="'
       + esc(val(row,key,scope)) + '"></td>';
}
// Two layers, never one field pretending to be both. The top line is
// what ResRequest holds and a pull refreshes; the box below is the
// camp's, and a pull never touches it. Mark, 2026-09-11: "Names will
// normally be the booking name - but we will want to add the guests
// first names as well for a more personalised touch."
function cellNames(row){
  var b = (row.stay && row.stay.booking) || null;
  if (!b) return '<td class="ro dim c-names"></td>';
  var h = '<span class="name">'+esc(b.guest_name)+"</span>";
  if (b.booking_ref) h += ' <span class="ref">'+esc(b.booking_ref)+"</span>";
  // Mark, 2026-09-28: "There was mention of being able to review the original
  // text as per the Ops Chart from the Day Sheet - how would we do this?"
  // This is how. It sits in the Names column because that column is frozen,
  // so it stays reachable however far right the grid is scrolled.
  if (b.guest_details || b.special_requests)
    h += ' <button class="srcbtn" data-src="'+row.room_id+'" title="Show what the Operations Chart actually said">i</button>';
  h += '<input type="text" class="sub" placeholder="guest names…" data-room="'+row.room_id
    +  '" data-key="guest_names" data-scope="stay" value="'+esc(row.stay.guest_names || "")+'">';
  return '<td class="ro two c-names">'+h+"</td>";
}

// Same idea for notes. Dietary and special requests come from the
// booking and are read-only here; anything the camp needs to add sits
// underneath - Mark: "we may need to add extra notes on dietaries etc
// that were not captured at booking".
// Showing the Operations Chart's own words for one booking.
//
// The summary in the Notes column is an extraction, and an extraction can be
// wrong — these are allergies and medical conditions, so there has to be a way
// back to the source. This is it: the whole Guest information and Notes blocks
// exactly as the export had them, with the sentence behind each extracted
// value highlighted, so checking is a glance rather than a read.
//
// Deliberately not on the sheet itself. Mark wanted it accessible, not
// visible: the grid's job is the whole picture at once, and a paragraph per
// room would destroy that.
function openSource(roomId){
  var row = (sheet.rows || []).filter(function(r){ return r.room_id === roomId; })[0];
  var b = row && row.stay && row.stay.booking;
  if (!b) return;
  var x = b.extraction || {};

  // Highlight each extracted value's source sentence inside the original.
  // Escape first, then mark, or the markup would be escaped along with it.
  function withMarks(text){
    var out = esc(String(text || ""));
    Object.keys(x).forEach(function(k){
      var src = x[k] && x[k].source;
      if (!src) return;
      var needle = esc(String(src).trim());
      if (needle.length < 4) return;
      var at = out.indexOf(needle);
      if (at < 0) return;
      out = out.slice(0, at) + '<mark class="'+(x[k].confident === false ? "ai" : "")+'">'
          + needle + "</mark>" + out.slice(at + needle.length);
    });
    return out.replace(/\n/g, "<br>");
  }

  var LABEL = { dietary:"Dietaries", medical:"Medical", occasion:"Special Event",
                bed:"Bed type", basis:"Basis" };
  var rows = "";
  ["bed","basis","dietary","medical","occasion"].forEach(function(k){
    var f = x[k];
    if (!f || !f.value) return;
    rows += '<tr><th>'+LABEL[k]+"</th><td>"+esc(f.value)
         +  (f.confident === false ? ' <span class="pill amber">read from a sentence — worth a look</span>' : "")
         +  "</td></tr>";
  });

  var h = '<div class="srcbox" role="dialog" aria-label="What the Operations Chart said">'
    +  '<div class="srchead"><div><b>'+esc(b.guest_name)+"</b>"
    +  (b.booking_ref ? ' <span class="ref">'+esc(b.booking_ref)+"</span>" : "")
    +  '<div class="meta">'+esc(row.label)+" · "+esc(b.arrive_date)+" → "+esc(b.depart_date)+"</div></div>"
    +  '<button class="ghost" id="srcclose">Close</button></div>';
  h += rows ? '<table class="srcvals">'+rows+"</table>"
            : '<p class="meta">Nothing was read out of this booking automatically.</p>';
  if (b.guest_details)
    h += "<h3>Guest information</h3><div class=\"srctext\">"+withMarks(b.guest_details)+"</div>";
  if (b.special_requests)
    h += "<h3>Notes</h3><div class=\"srctext\">"+withMarks(b.special_requests)+"</div>";
  h += '<p class="meta">Exactly as the Operations Chart export had it. Highlighted text is what '
    +  'the sheet read each value from; amber means it came from a sentence rather than a '
    +  'labelled line, so it is worth your eye.</p></div>';

  var back = document.createElement("div");
  back.className = "srcback";
  back.innerHTML = h;
  document.body.appendChild(back);
  var close = function(){ back.remove(); document.removeEventListener("keydown", onKey); };
  var onKey = function(e){ if (e.key === "Escape") close(); };
  back.addEventListener("click", function(e){ if (e.target === back || e.target.id === "srcclose") close(); });
  document.addEventListener("keydown", onKey);
}

function cellNotes(row){
  if (!row.stay) return '<td class="dim"></td>';
  var b = row.stay.booking || {};
  var x = b.extraction || {};

  // Mark, 2026-09-28: "I would prefer it to have a standard structure:
  // Dietaries - / Medical - / Special Event -".
  //
  // So all three labels are ALWAYS present, filled or not. The point is that
  // the cell reads the same on every row: a manager scanning down the column
  // knows where to look, and an empty Medical line says "nobody told us"
  // rather than leaving them to wonder whether it was checked.
  //
  // The booking's own Notes block is deliberately NOT printed here any more.
  // Mark: "We also do not need the FI and Bed type (Double etc) repeated here
  // - it is recorded in Type column" — that block is where the repetition was
  // coming from ("SELF DRIVE@CEC · Double room · ..."). It is still kept and
  // still readable in full: click the row's ⓘ, see openSource().
  function line(label, value, ev){
    if (!value){
      return '<span class="diet empty"><b>'+label+"</b> —</span>";
    }
    var unsure = ev && ev.confident === false ? " unsure" : "";
    return '<span class="diet'+unsure+'" title="'+esc((ev && ev.source) || "from the booking")
      +  '"><b>'+label+"</b> "+esc(value)+"</span>";
  }

  // A combined heading — "Medical & dietary Requirement: no shellfish" — is
  // one answer to two questions and legitimately fills both fields. Showing
  // it on both lines would just repeat the sentence, so the Medical line
  // points at the Dietaries line instead of restating it.
  var same = b.dietary && b.medical && b.dietary === b.medical;
  var h = line("Dietaries", b.dietary, x.dietary)
        + (same ? '<span class="diet"><b>Medical</b> <i>as above</i></span>'
                : line("Medical", b.medical, x.medical))
        + line("Special Event", b.special_occasion, x.occasion);

  h += '<input type="text" class="sub" placeholder="camp notes…" data-room="'+row.room_id
    +  '" data-key="notes" data-scope="stay" value="'+esc(row.stay.notes || "")+'">';
  return '<td class="ro two c-notes">'+h+"</td>";
}

// The Type column. Mark, 2026-09-27: "In the Type Column - we can put in
// the info for 'Twin' 'Double' or Triple and Fully Inclusive or Self Drive.
// I would abreviate these to TWIN DBL TRIP and then FI and SD."
//
// NOT ResRequest's accommodation type, which used to be here: the room
// number already tells you whether it is standard or inter-leading, so the
// column is better spent on what the room has to be set up as, and whether
// the party's activities are included.
//
// Both come out of free prose, so both carry the sentence they came from —
// hover to check without leaving the sheet.
function cellType(b){
  if (!b) return '<td class="ro dim c-type"></td>';
  var x = b.extraction || {};
  var bits = [];
  if (b.bed_type) bits.push('<span class="tag'+(x.bed && x.bed.confident === false ? " unsure" : "")
    + '" title="'+esc((x.bed && x.bed.source) || "from the booking")+'">'+esc(b.bed_type)+"</span>");
  if (b.booking_basis) bits.push('<span class="tag basis'+(x.basis && x.basis.confident === false ? " unsure" : "")
    + '" title="'+esc((x.basis && x.basis.source) || "from the booking")+'">'+esc(b.booking_basis)+"</span>");
  return '<td class="ro c-type">'+(bits.join("") || "")+"</td>";
}

function cellPax(b){
  if (!b) return '<td class="ro dim c-pax"></td>';
  var p = [];
  if (b.adults) p.push(b.adults+"A");
  if (b.children) p.push(b.children+"C");
  return '<td class="ro c-pax">'+esc(p.join(" "))+"</td>";
}

// One entry per column, in order. Change a width here and the frozen
// columns' left offsets in the stylesheet must change with it.
var COLS = [
  58, 96,                       // Room, Status            (frozen)
  46, 92, 172,                  // Pax, Type, Names        (frozen)
  130, 130, 130, 215,           // Housekeeper, Guide, Vehicle, Notes
  130, 130, 165, 90,            // Arrivals
  150, 130, 130, 165, 90,       // Departures
  150, 74, 150, 74,             // Activities (two a day: morning and afternoon)
  210                           // Maintenance
];
var COLGROUP = "<colgroup>" + COLS.map(function (w) {
  return '<col style="width:' + w + 'px">';
}).join("") + "</colgroup>";

var HEAD =
  COLGROUP
+ '<thead>'
+ '<tr class="groups">'
+   '<th class="room c-room g-room" rowspan="2">Room</th>'
+   '<th class="c-status g-room" rowspan="2">Status</th>'
    // "The stay" is split in two so its label sits in the frozen part and
    // stays on screen when the grid is scrolled right. The second cell is
    // the same colour and unlabelled, so the band still reads as one.
+   '<th class="c-pax g-stay" colspan="3">The stay</th>'
+   '<th class="g-stay" colspan="4"></th>'
+   '<th class="g-arr" colspan="4">Arrivals</th>'
+   '<th class="g-dep" colspan="5">Departures</th>'
+   '<th class="g-act" colspan="4">Activities</th>'
+   '<th class="g-mnt" rowspan="2">Maintenance</th>'
+ "</tr>"
+ '<tr class="cols">'
+   '<th class="c-pax">Pax</th><th class="c-type">Type</th><th class="c-names">Names</th>'
+   "<th>Housekeeper</th><th>Guide</th><th>Vehicle</th><th>Notes</th>"
+   "<th>Driver/Guide</th><th>Vehicle</th><th>Arrival details</th><th>ETA</th>"
+   "<th>Names</th><th>Driver/Guide</th><th>Vehicle</th><th>Departure details</th><th>ETD</th>"
+   "<th>Activity 1</th><th>Time</th><th>Activity 2</th><th>Time</th>"
+ "</tr></thead>";

var STATUS_LABEL = { arriving:"Arriving", departing:"Departing", turnover:"Turnover", staying:"Staying", empty:"Empty" };

function rowHtml(row){
  var people = boot.people, vehicles = boot.vehicles;
  var b = (row.stay && row.stay.booking) || null;
  var h = '<tr class="st-'+row.status+'" data-rowfor="'+row.room_id+'">';
  h += '<td class="room">'+esc(row.label)+"</td>";

  // Status, and where in the stay they are — so the shape of the day
  // reads down one narrow column without scanning across.
  h += '<td class="status-cell"><span class="state '+row.status+'">'+STATUS_LABEL[row.status]+"</span>";
  if (row.night) h += '<span class="night">Night '+row.night+" of "+row.nights+"</span>";
  h += "</td>";

  // ---- Sector 1: the stay ----
  h += cellPax(b);
  h += cellType(b);
  h += cellNames(row);
  h += cellSelect(row,"housekeeper_id",people,"stay");
  h += cellSelect(row,"guide_id",people,"stay");
  h += cellSelect(row,"vehicle_id",vehicles,"stay");
  h += cellNotes(row);

  // ---- Sector 2: arrivals (the pickup) ----
  // Only where the movement applies. Mark, 2026-09-11, having seen the
  // alternative live: "i now see that the drop down menu for driver and
  // vehicle is visible for every row. i was happy with your option of
  // only making them visible when a room is occupied." A picker on a row
  // with nobody arriving invites data that means nothing.
  if (row.status === "arriving" || row.status === "turnover"){
    h += cellSelect(row,"arrival_driver_id",people) + cellSelect(row,"arrival_vehicle_id",vehicles)
      +  cellMovement(row,"arrival_details", b && b.arrival_details, b && b.extraction && b.extraction.arrival)
      +  cellTime(row,"eta", b && b.eta);
  } else {
    h += '<td class="dim"></td><td class="dim"></td><td class="dim"></td><td class="dim"></td>';
  }

  // ---- Sector 3: departures ----
  if (row.departing){
    h += '<td class="ro"><span class="name">'+esc(row.departing.guest_name)+"</span>"
      +  (row.departing.booking_ref ? ' <span class="ref">'+esc(row.departing.booking_ref)+"</span>" : "")
      +  (row.departing.guest_names ? '<span class="sub-name">'+esc(row.departing.guest_names)+"</span>" : "")
      +  "</td>";
    // The departing party is often not the one in sector 1, so its movement
    // detail comes off the DEPARTING booking, never the staying one.
    h += cellSelect(row,"departure_driver_id",people) + cellSelect(row,"departure_vehicle_id",vehicles)
      +  cellMovement(row,"departure_details", row.departing.booking_departure_details,
                      row.departing.booking_extraction && row.departing.booking_extraction.departure)
      +  cellTime(row,"etd", row.departing.booking_etd);
  } else {
    h += '<td class="ro dim"></td><td class="dim"></td><td class="dim"></td><td class="dim"></td><td class="dim"></td>';
  }

  // ---- Sector 4: activities ----
  if (row.stay || row.departing){
    // Two a day — Mark, 2026-09-27: "for the Activities Section - we need to
    // be able to insert 2 activities a day." Morning and afternoon, which is
    // how a safari day runs. Typed by the camp, never imported: the export
    // carries almost no activity data (13 Extras lines across all five real
    // exports, only 4 of them activities).
    h += cellText(row,"activity") + cellText(row,"activity_time")
      +  cellText(row,"activity_2") + cellText(row,"activity_2_time");
  } else {
    h += '<td class="dim"></td><td class="dim"></td><td class="dim"></td><td class="dim"></td>';
  }

  // ---- Sector 5: maintenance, always available ----
  var mnt = (row.saved && row.saved.maintenance_note) || "";
  h += '<td class="mnt"><input type="text" placeholder="—" data-room="'+row.room_id+'" data-key="maintenance_note" data-scope="day" value="'+esc(mnt)+'"></td>';
  return h + "</tr>";
}

// The whole reason for the grid: spotting a person or a vehicle in two
// places at once. Marks every cell holding a value that appears more
// than once across the day's movements. It does not block anything —
// a guide genuinely can do a morning drop-off and an afternoon
// collection — it just makes the repeat visible, which is what Mark
// said the picture is for.
// A guide with more than six people across the whole day. Mark,
// 2026-09-11: "i would also like to build in when a guide has been
// allocated more than 6 pax - similar to your conflict highlight for the
// vehicles." Six is a game-drive vehicle's worth.
//
// Counted per BOOKING, not per row. A party of four in two inter-leading
// rooms appears on two lines with the same guide; counting rows would
// call that eight people and flag a guide who has four.
//
// The limit comes from the LODGE, not from here — Mark, 2026-09-11:
// "depending on the lodge we determine the max number per vehicle - so
// for Chobe it is 6 pax. Other lodges it may be 8 pax." Null means no
// limit set for that lodge, and no warning at all: a camp nobody has
// decided this for should not inherit somebody else's number.
function maxPax(){ return (boot.location && boot.location.max_pax_per_vehicle) || null; }

function markGuideLoad(){
  var limit = maxPax();
  var perGuide = {};
  (sheet.rows || []).forEach(function(r){
    if (!r.stay) return;
    var sel = document.querySelector('[data-room="'+r.room_id+'"][data-key="guide_id"]');
    var gid = sel && sel.value;
    if (!gid) return;
    var b = r.stay.booking || {};
    var g = perGuide[gid] || (perGuide[gid] = { pax: 0, seen: {}, cells: [] });
    if (sel) g.cells.push(sel);
    if (b.id && !g.seen[b.id]) {
      g.seen[b.id] = true;
      g.pax += (b.adults || 0) + (b.children || 0);
    }
  });
  var over = [];
  Object.keys(perGuide).forEach(function(gid){
    var g = perGuide[gid];
    var name = (boot.people.filter(function(p){ return p.id === gid; })[0] || {}).name || "A guide";
    g.cells.forEach(function(c){
      c.parentElement.classList.toggle("overload", !!limit && g.pax > limit);
      c.title = name + " has " + g.pax + " pax today" + (limit ? " (limit " + limit + ")" : "");
    });
    if (limit && g.pax > limit) over.push(name + " — " + g.pax + " pax");
  });
  var el2 = document.getElementById("guidenote");
  if (el2) el2.textContent = over.length
    ? "Over this lodge's limit of " + limit + " pax per guide: " + over.join(" · ") + ". Outlined in amber."
    : "";
}

function markClashes(){
  var MOVEMENT = ["arrival_driver_id","arrival_vehicle_id","departure_driver_id","departure_vehicle_id"];
  var seen = {};
  document.querySelectorAll('td select[data-key]').forEach(function(sel){
    sel.parentElement.classList.remove("clash");
    if (MOVEMENT.indexOf(sel.getAttribute("data-key")) === -1) return;
    if (!sel.value) return;
    (seen[sel.value] = seen[sel.value] || []).push(sel);
  });
  var n = 0;
  Object.keys(seen).forEach(function(v){
    if (seen[v].length > 1){ n++; seen[v].forEach(function(s){ s.parentElement.classList.add("clash"); }); }
  });
  var w = el("clashnote");
  if (w) w.textContent = n ? (n + (n===1?" person or vehicle is":" people or vehicles are") + " in more than one pickup or drop-off today — outlined in red. Often fine, worth a look.") : "";
}

function render(){
  var c = sheet.counts;
  var h = '<p class="summary"><b>'+c.arriving+"</b> arriving · <b>"+c.departing+"</b> departing · <b>"
        + c.in_house+"</b> rooms in house · <b>"+c.empty+"</b> empty of "+c.rooms+"</p>";
  h += '<div class="scroll"><table>'+HEAD+"<tbody>";
  sheet.rows.forEach(function(r){ h += rowHtml(r); });
  h += "</tbody></table></div>";
  h += '<p class="warn" id="clashnote"></p><p class="warn amber" id="guidenote"></p>';

  h += '<div class="drawer"' + (drawerOpen ? "" : " hidden") + '><div class="below">';
  // Importing the ResRequest Operations Chart. ResRequest's API cannot give
  // us the room allocation and they have no scheduled-email facility, so a
  // manager exports the chart and drops it here — tool-local D-014. Reads the
  // export's `notes` sheet, never `chart` (D-013).
  h += '<div class="panel opsimport"><h2>Import the ResRequest Operations Chart</h2>'
    +  '<p class="meta">Export the Operations Chart from ResRequest for this camp, then choose the file here. '
    +  'It reads the bookings <b>and</b> the rooms you allocated, and shows you what it will do before it does it. '
    +  'Nothing is changed until you press Import.</p>'
    +  '<div class="row"><input type="file" id="opsfile" accept=".xlsx,.xls,.csv,.xml"></div>'
    +  '<div id="opsreport"></div>'
    +  '<div class="row" style="margin-top:8px"><button id="opsimport" hidden>Import</button> '
    +  '<span class="status" id="msg-ops"></span></div></div>';

  h += '<div class="panel"><h2>Notes not tied to one room</h2>'
     + '<textarea id="general" rows="4" placeholder="Dietary notes, a pickup arrangement…">'
     + esc(sheet.sheet && sheet.sheet.general_notes || "") + "</textarea></div>";

  // Moving a placed booking lives here rather than in the grid: it is a
  // planning action on a whole stay, not an edit to one day's row, and
  // fiddly controls inside a dense grid would be worse for both jobs.
  h += '<div class="panel"><h2>Placed — move or take out ('+placed.length+")</h2>";
  if (!placed.length) h += '<p class="meta">Nothing placed for this date yet.</p>';
  placed.forEach(function(p){
    h += '<div class="place"><p class="who">'+esc(p.guest_name)+"</p>"
      +  '<p class="meta">'+esc(p.from_date)+" → "+esc(p.to_date)+" · currently in "+esc(p.label)+"</p>"
      +  '<div class="row"><select data-movesel="'+p.stay_id+'">'+opts(boot.rooms, p.room_id)+"</select>"
      +  '<button data-move="'+p.stay_id+'">Move</button>'
      +  '<button class="ghost" data-remove="'+p.stay_id+'">Take out</button></div></div>';
  });
  h += "</div>";

  h += '<div class="panel"><h2>Not yet in a room ('+unplaced.length+")</h2>";
  if (!unplaced.length) h += '<p class="meta">Everything for this date is placed.</p>';
  unplaced.forEach(function(b){
    h += '<div class="place"><p class="who">'+esc(b.guest_name)
      +  ' <span class="pill">'+b.still_to_place+" to place</span></p>"
      +  '<p class="meta">'+esc(b.arrive_date)+" → "+esc(b.depart_date)
      +  (b.room_type_needed?" · "+esc(b.room_type_needed):"")
      +  (b.room_stays.length?" · in "+b.room_stays.map(function(s){return esc(s.label);}).join(", "):"")
      +  "</p>"
      +  '<div class="row"><select data-place="'+b.id+'">'+opts(boot.rooms,"")+"</select>"
      +  '<button data-placebtn="'+b.id+'">Place</button></div></div>';
  });
  h += "</div>";

  h += '<div class="panel addbooking"><h2>Add a booking by hand</h2>'
    +  '<p class="meta">For anything ResRequest does not know about — the Pilot/Guide Room, a walk-in, an owner, staff in a guest room.</p>'
    +  '<div class="grid2">'
    +  "<label>Guest / party<input id=nb_name type=text></label>"
    +  "<label>Arrive<input id=nb_from type=date></label>"
    +  "<label>Depart<input id=nb_to type=date></label>"
    +  "<label>Rooms<input id=nb_rooms type=number min=1 value=1></label>"
    +  "<label>Adults<input id=nb_ad type=number min=0></label>"
    +  "<label>Children<input id=nb_ch type=number min=0></label>"
    +  "<label>Dietary<input id=nb_diet type=text></label>"
    +  "</div>"
    +  '<div class="row" style="margin-top:8px"><button id="addbooking">Add booking</button> '
    +  '<span class="status" id="msg-add"></span></div></div>';
  h += "</div>";

  h += "</div>";   // closes .drawer
  el("app").innerHTML = h;
  markClashes();
  markGuideLoad();
}

function markDirty(roomId){
  dirty[roomId] = true;
  var n = Object.keys(dirty).length;
  el("save").disabled = false;
  setStatus(n + (n===1?" room changed":" rooms changed") + " — not saved yet", "dirty");
}

function collect(roomId){
  var row = sheet.rows.filter(function(r){return r.room_id===roomId;})[0];
  var body = { date: sheet.date, room_id: roomId, person_id: personId() };
  if (row.stay) body.stay_id = row.stay.stay_id;
  document.querySelectorAll('[data-room="'+roomId+'"]').forEach(function(inp){
    body[inp.getAttribute("data-key")] = inp.value;
  });
  if (row.stay && row.stay.booking) body.arriving_booking_id = row.stay.booking.id;
  if (row.departing && row.departing.booking_id) body.departing_booking_id = row.departing.booking_id;
  return body;
}

// One save action on the page, not two that can disagree: the general
// notes go with the rows on the same button.
function saveAll(){
  var g = el("general");
  var ids = Object.keys(dirty);
  if (!ids.length && !g) return;
  if (g) post("save_notes", { date: sheet.date, person_id: personId(), general_notes: g.value });
  if (!ids.length){ setStatus("Saved", "ok"); return; }
  el("save").disabled = true;
  setStatus("Saving "+ids.length+"…");
  var done = 0, failed = 0;
  ids.reduce(function(chain, id){
    return chain.then(function(){
      return post("save_row", collect(id)).then(function(res){
        if (res.error){ failed++; } else { done++; delete dirty[id]; }
      });
    });
  }, Promise.resolve()).then(function(){
    if (failed){ setStatus(done+" saved, "+failed+" failed", "err"); el("save").disabled = false; }
    else setStatus("Saved", "ok");
  });
}

function post(action, body){
  // location_id on every write, not just the reads — add_booking and
  // anything that calls ensureSheet() need to know which camp's sheet
  // this is (tool-local D-008). Harmless to include on the ones that
  // don't (allocate/move/unallocate operate on already-known ids).
  body = Object.assign({ location_id: shownCamp ? shownCamp.id : null }, body);
  return fetch(FN+"?action="+action, {
    method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)
  }).then(function(r){return r.json();}).catch(function(e){return {error:String(e)};});
}

function load(){
  var date = el("date").value || today();
  el("date").value = date;
  dirty = {}; el("save").disabled = true; setStatus("");
  Promise.all([
    fetch(FN+"?action=day_sheet&date="+date+campParam()).then(function(r){return r.json();}),
    fetch(FN+"?action=bookings&from="+date+"&to="+date+campParam()).then(function(r){return r.json();})
  ]).then(function(res){
    sheet = res[0];
    var all = res[1].bookings || [];
    unplaced = all.filter(function(b){ return b.still_to_place > 0; });
    // Flattened to one entry per allocation, not per booking: a party in
    // two rooms can have one of them moved without the other.
    placed = [];
    all.forEach(function(b){
      (b.room_stays || []).forEach(function(st){
        placed.push({ stay_id: st.id, room_id: st.room_id, label: st.label,
                      guest_name: b.guest_name, from_date: st.from_date, to_date: st.to_date });
      });
    });
    placed.sort(function(a,b){ return a.label.localeCompare(b.label, undefined, {numeric:true}); });
    render();
  }).catch(function(err){
    el("app").innerHTML = '<p class="loading">Could not load: '+esc(err)+"</p>";
  });
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.getAttribute && t.getAttribute("data-placebtn")){
    var sel = document.querySelector('[data-place="'+t.getAttribute("data-placebtn")+'"]');
    if (!sel.value) return;
    post("allocate", { booking_id: t.getAttribute("data-placebtn"), room_id: sel.value, person_id: personId() })
      .then(function(res){ if (res.error) alert(res.error); load(); });
  }
  if (t.getAttribute && t.getAttribute("data-move")){
    var sid = t.getAttribute("data-move");
    var sel = document.querySelector('[data-movesel="'+sid+'"]');
    if (!sel.value) return;
    t.disabled = true;
    post("move", { room_stay_id: sid, room_id: sel.value, person_id: personId() })
      .then(function(res){
        if (res.error){ alert(res.error); t.disabled = false; return; }
        load();
      });
    return;
  }
  if (t.getAttribute && t.getAttribute("data-remove")){
    if (!confirm("Take this booking out of its room? Any room check it opened is cancelled, unless another booking still needs that room.")) return;
    post("unallocate", { room_stay_id: t.getAttribute("data-remove") }).then(function(res){
      if (res.error) alert(res.error);
      load();
    });
    return;
  }
  if (t.id === "addbooking"){
    var body = {
      guest_name: el("nb_name").value, arrive_date: el("nb_from").value, depart_date: el("nb_to").value,
      rooms_needed: Number(el("nb_rooms").value || 1),
      adults: el("nb_ad").value ? Number(el("nb_ad").value) : null,
      children: el("nb_ch").value ? Number(el("nb_ch").value) : null,
      dietary: el("nb_diet").value
    };
    if (!body.guest_name || !body.arrive_date || !body.depart_date){
      el("msg-add").textContent = "Name and both dates are needed."; el("msg-add").className = "status err"; return;
    }
    el("msg-add").textContent = "Saving…";
    post("add_booking", body).then(function(res){
      if (res.error){ el("msg-add").textContent = res.error; el("msg-add").className = "status err"; return; }
      load();
    });
  }
});
