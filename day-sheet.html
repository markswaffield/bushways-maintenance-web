/* ---------------------------------------------------------------------------
   The ResRequest Operations Chart importer.

   WHY A FILE AND NOT AN API CALL, because it looks like a step backwards and
   is not: ResRequest's API cannot give us the room allocation. Two of their
   108 methods expose a room and both come back empty for our camps — tested
   to destruction over three rounds with their own support (D-011, D-012,
   D-015). Their Operations Chart export CAN (D-013), and they have confirmed
   they have no scheduled-email facility, so a person exports it and drops it
   in. That is D-014 and it is the route, not a stopgap.

   THE SHEET THAT MATTERS IS `notes`, NEVER `chart`. The `chart` sheet auto-fits
   and prints a room for every booking whether or not anyone chose one — on one
   real export it invented rooms for 107 bookings on a day when nothing at all
   was allocated. The `notes` sheet's per-leg `Room` column is blank exactly
   when the booking is unallocated, and that blank is an ANSWER, not a gap.
   Read D-013 before touching this.
--------------------------------------------------------------------------- */

// SheetJS is ~900KB, and root CLAUDE.md is explicit that bandwidth in Maun is
// limited — so it is fetched the first time somebody actually picks a file,
// not on every page load. The service worker ignores cross-origin requests,
// so this is never served stale.
var xlsxLib = null;
function loadXlsx(){
  if (xlsxLib) return xlsxLib;
  xlsxLib = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = function(){ resolve(window.XLSX); };
    s.onerror = function(){ xlsxLib = null; reject(new Error("could not load the spreadsheet reader — check the connection")); };
    document.head.appendChild(s);
  });
  return xlsxLib;
}

/* What the camp needs off the Operations Chart, pulled out of free prose.

   Mark, 2026-09-27: Room Type (Twin/Double/Triple), Booking Type (FI/SD),
   Dietaries, Medical, Special Occasions. None of these has a column in the
   export — they are sentences inside the Guest information and Notes blocks,
   written differently by every agent. Measured across 172 real Chobe
   bookings, the labels alone appear as: "Dietary requirements:",
   "Dietaries:", "Dietary:", "Diet:", "Dietaries/allergies:", "Medical
   requirements:", "Medical & dietary Requirement:", "Dietary & medical
   requirements:", "Dietaries & Medical Requirements:", "Special occasions:",
   "Special Occ:", "Spec Occ:", "Special events:", "Special request:".

   So the matching is deliberately loose, and every value carries the phrase
   it came from so a manager can check it. Nothing here is ever the only
   record: the original block is stored whole (bookings.guest_details).  */

// "None", "N/A", "TBA" and friends are an ANSWER — the agent was asked and
// said no. Treated as nothing to show, never as a failure to read.
// Spelled out rather than "anything starting with none", because "None of
// the party eat pork" IS an answer and must not be swallowed. These are the
// real forms seen across 172 bookings, typos included — agents write "None
// advsed" and "None advied" as often as they spell it correctly.
var NOTHING = new RegExp("^\\s*(?:" + [
  "n\\.?/?a\\.?", "nil", "no", "-", "–", "not applicable", "tba", "tbc", "unknown",
  "non[e]?\\s*(?:advised|advsed|advied|adviced|stated|provided|requested|known|noted|given|reported|for\\s+now|at\\s+this\\s+stage|so\\s+far)?",
  "nothing\\s*(?:advised|noted|reported|specific)?",
  "not\\s+advised", "none\\s+that\\s+we\\s+know\\s+of"
].join("|") + ")\\s*\\.?\\s*$", "i");

// Labels are classified by the WORDS THEY CONTAIN, not by the order those
// words appear in. That matters: "Medical & dietary Requirement" and
// "Dietary & medical requirements" are both real, both common, and both
// answer two fields at once — so a combined label fills dietary AND medical.
// Matching on the leading word missed half of them.
var FIELD_WORDS = {
  dietary:  /dietar|(^|[^a-z])diet([^a-z]|$)|allerg|intoleran/i,
  medical:  /medical|allerg|condition|mobilit|wheelchair/i,
  occasion: /special|occasion|\bocc\b|event|celebrat|anniversar|birthday|honeymoon/i,
  bed:      /room\s*type|bed/i,
  basis:    /basis|board|package/i
};

// Any "Something: value" line, however it is worded.
var LABEL_LINE = /^([A-Za-z][A-Za-z &\/'\-\.]{1,44}?)\s*[:\-]\s*(.*)$/;

// Section headings inside a Guest information block. A continuation run ends
// when one of these turns up; anything else is more of the same section.
var STOP_LABEL = /movement|arriv|arr\b|depart|dep\b|transfer|nationalit|agent|contact|clients?\s*name|repeat|extras?|basis|board|room\s*type|special|medical|dietar|diet\b|allerg|occasion|event|flight|pick\s*up|drop\s*off/i;

function lines(text){
  return String(text || "").split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
}

// The same, but keeping blank lines, because a blank line is what ends a
// paragraph and that matters for continuation below.
function rawLines(text){
  return String(text || "").split(/\n/).map(function(l){ return l.trim(); });
}

// Returns {value, source, confident} for the first line whose LABEL mentions
// this field. A label with nothing after it, or "None", is an answer — the
// agent was asked and said no — not a failure to read.
//
// CONTINUATION, and this one is a safety fix rather than a nicety. Agents
// write the heading, a summary sentence ending in a colon, and then the
// actual detail underneath:
//
//     Dietary requirements: No dietary restrictions aside from a dislike of certain foods:
//     Robert: Seafood, Cauliflower, Mushrooms, Eggplant, Brussels sprouts
//     Lorraine: Strawberries and Coconut
//
// Reading only the heading line puts "No dietary restrictions" on the day
// sheet and throws the allergies away. So when the value is empty or ends in
// a colon, the following lines are taken too, up to a blank line or the next
// real heading.
function labelled(text, key){
  var all = rawLines(text);
  for (var i = 0; i < all.length; i++){
    if (!all[i]) continue;
    var m = all[i].match(LABEL_LINE);
    if (!m) continue;
    if (!FIELD_WORDS[key].test(m[1])) continue;

    var v = (m[2] || "").trim();
    var src = all[i];
    if (!v || /:$/.test(v)){
      // NOT "stop at the next blank line": in this export every paragraph is
      // blank-separated, so that ends the run immediately and throws the
      // detail away. Stop at the next recognised SECTION heading instead —
      // "Movement details:", "Nationality:", "Special events:" — and treat
      // anything else as continuation, including "Robert: Seafood…", which is
      // label-shaped but is a guest's name and is exactly what we are after.
      var extra = [], blanks = 0;
      for (var j = i + 1; j < all.length && extra.length < 4; j++){
        if (!all[j]){ if (++blanks > 2) break; continue; }    // tolerate the gaps
        var next = all[j].match(LABEL_LINE);
        if (next && STOP_LABEL.test(next[1])) break;
        extra.push(all[j]);
      }
      if (extra.length){
        v = (v ? v.replace(/:$/, "") + " — " : "") + extra.join("; ");
        src = all.slice(i, i + 1 + extra.length).join(" ");
      }
    }
    v = v.replace(/[.;,\s]+$/, "");
    if (!v || NOTHING.test(v)) return { value: null, source: all[i], confident: true };
    return { value: v, source: src, confident: true };
  }
  return null;
}

var BEDWORDS = /\b(double|twin|triple|single|family|king|queen)\b/i;
var BED_SHORT = { double:"DBL", twin:"TWIN", triple:"TRIP", single:"SGL",
                  family:"FAM", king:"KING", queen:"QUEEN" };

// Mark: "I would abreviate these to TWIN DBL TRIP".
function shortBed(v){
  if (!v) return null;
  var found = [];
  String(v).replace(new RegExp(BEDWORDS.source, "gi"), function(w){
    var s = BED_SHORT[w.toLowerCase()];
    if (s && found.indexOf(s) < 0) found.push(s);
    return w;
  });
  return found.length ? found.join("/") : null;
}

function bed(text){
  var lab = labelled(text, "bed");
  if (lab && lab.value){
    var s = shortBed(lab.value);
    if (s) return { value: s, source: lab.source, confident: true };
  }
  // Very commonly a bare line of its own: "Double", "Twin beds", "Double x 1".
  var all = lines(text);
  for (var i = 0; i < all.length; i++){
    if (all[i].length > 30) continue;                 // a sentence, not a label
    var m = all[i].match(/^(double|twin|triple|single|family|king|queen)\b[\s\w]{0,14}$/i);
    if (m) return { value: BED_SHORT[m[1].toLowerCase()], source: all[i], confident: true };
  }
  // Inside a longer sentence — real, but worth a manager's eye.
  for (var j = 0; j < all.length; j++){
    var m2 = all[j].match(BEDWORDS);
    if (m2) return { value: BED_SHORT[m2[1].toLowerCase()], source: all[j], confident: false };
  }
  return null;
}

// Mark: "Fully Inclusive or Self Drive... FI and SD". Both can be true —
// a self-driving party can still be fully inclusive once they arrive.
var BASES = [
  { code:"FI",  re:/fully\s*inclusive|\bF\.?I\.?\b/i },
  { code:"SD",  re:/self[\s-]*driv\w*/i },
  { code:"DBB", re:/\bDBB\b|dinner,?\s*bed\s*(?:&|and)\s*breakfast/i },
  { code:"B&B", re:/\bB\s*&\s*B\b|bed\s*(?:&|and)\s*breakfast/i }
];
function basis(text){
  var all = lines(text), found = [], src = null, sure = false;
  for (var i = 0; i < all.length; i++){
    for (var j = 0; j < BASES.length; j++){
      if (!BASES[j].re.test(all[i])) continue;
      if (found.indexOf(BASES[j].code) < 0){
        found.push(BASES[j].code);
        if (!src) src = all[i];
      }
      // A short line saying only this is a statement of the basis; the same
      // words inside a long movement note are a passing mention.
      if (all[i].length <= 40) sure = true;
    }
  }
  return found.length ? { value: found.join("/"), source: src, confident: sure } : null;
}

function extract(guestInfo, notes){
  var both = [guestInfo || "", notes || ""].join("\n");
  var out = {};
  ["dietary","medical","occasion"].forEach(function(k){
    var r = labelled(both, k);
    if (r) out[k] = r;
  });
  var bd = bed(both);      if (bd) out.bed = bd;
  var bs = basis(both);    if (bs) out.basis = bs;
  return out;
}

/* Which line of a booking's movement notes belongs to THIS camp on THIS date.

   The hard part is not finding movement text — nearly every booking has some.
   It is that the text covers the whole itinerary. A party doing Mababe then
   Chobe has both camps' transfers in one block, and putting Mababe's flight in
   front of a Chobe driver is worse than showing nothing.

   Two signals, in order of trust:
     1. A DATE on the line that matches this leg's own arrive or depart date.
        "17 Sept: Please collect from Kasane Airport" against a leg arriving
        17 September is as certain as this gets.
     2. A labelled line — "Arrival Details:", "Depart:" — used only when the
        booking touches ONE camp, because with several there is no way to tell
        which camp's arrival it describes.

   Anything else is left alone for the AI layer, which can weigh the camp names
   in the prose. */

var MONTH = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};

// "17 Sept:", "15 Sep 2026 :", "19 Sept -", "03 Oct 2026"
function dateOn(line){
  var m = String(line).match(/(^|[^0-9])(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]{3})[a-z]*\.?\s*(\d{4})?/);
  if (!m) return null;
  var mon = MONTH[m[3].toLowerCase()];
  return mon ? { day: +m[2], month: mon, year: m[4] ? +m[4] : null } : null;
}

function sameDay(d, iso){
  if (!d || !iso) return false;
  var p = String(iso).split("-");
  return d.day === +p[2] && d.month === +p[1] && (!d.year || d.year === +p[0]);
}

var ARRIVE_WORD  = /\barriv|\barr\b|collect|pick\s*up|transfer\s+(?:in|from)|ex\b/i;
var DEPART_WORD  = /\bdepart|\bdep\b|\bleav|drop\s*off|transfer\s+(?:out|to)\b/i;
var MOVEMENT_LABEL = /movement|arriv|arr\b|depart|dep\b|transfer|flight|pick\s*up|drop\s*off/i;
var LABEL_LINE = /^([A-Za-z][A-Za-z &\/'\-\.]{1,44}?)\s*[:\-]\s*(.*)$/;

// Every Bush Ways property, by full name and by the code the agents use.
// A movement line that names a DIFFERENT camp is that camp's movement, not
// ours, however well its date matches — a party leaving Boteti and reaching
// Khwai the same day has both on one date, and "ex Khwai Guest House" on a
// Boteti sheet would send a Boteti driver to the wrong lodge.
//
// Matched on full names and on codes as whole words, so "Khwai Hippo Pool
// Campsite" (a public site, not ours) is not mistaken for Khwai Guest House.
var CAMPS = [
  { name: "Boteti River Camp",     re: /boteti/i,                          code: /\bBRCC?\b/ },
  { name: "Chobe Elephant Camp",   re: /chobe\s+elephant/i,                code: /\bCEC\b/ },
  { name: "Khwai Guest House",     re: /khwai\s+guest\s+house/i,           code: /\bKGH\b/ },
  { name: "Sango Safari Camp",     re: /sango/i,                           code: /\bSSC\b/ },
  { name: "Mababe Tented Camp",    re: /mababe/i,                          code: /\bMTC\b/ },
  { name: "The Dune Camp",         re: /dune\s+camp/i,                     code: /\bDC\b/ },
  { name: "Deception Valley Lodge", re: /deception\s+valley/i,             code: /\bDVL\b/ }
];

// Does this movement line describe leaving OUR camp, or arriving at it?
//
// Direction is what separates a good line from a wrong one, and a plain
// "does it mention another lodge" test gets it backwards. Naming another
// lodge is normal and useful — "self-driving from Deception Valley Campsite"
// is exactly right for an arrival. What is wrong is the DIRECTION:
//
//   arrival   "...to Boteti from Khwai"      the FROM may be any lodge
//   departure "...ex Boteti to Khwai"        the EX must be ours
//   departure "...ex Khwai Guest House"      <- another camp's departure,
//                                               and the AI put this on
//                                               Boteti's sheet because the
//                                               dates line up: a party can
//                                               leave one lodge and reach the
//                                               next on the same day.
//
// So: whichever lodge sits behind "ex"/"from" owns the departure, and
// whichever sits behind "to"/"at" owns the arrival. If that lodge is not
// ours, the line is not ours.
function movementFits(text, kind, campNames){
  if (!text) return true;
  var mine = (campNames || []).join(" ").toLowerCase();
  var after = kind === "departure"
    ? String(text).match(/\b(?:ex|from|departing|leaving)\s+([A-Za-z][A-Za-z '\-]{2,40})/i)
    : String(text).match(/\b(?:to|at|into|arriving\s+at)\s+([A-Za-z][A-Za-z '\-]{2,40})/i);
  if (!after) return true;                       // no direction word, leave it alone
  var who = after[1];
  var named = null, isMine = false;
  CAMPS.forEach(function(c){
    if (!c.re.test(who) && !c.code.test(who)) return;
    named = named || c.name;
    if (c.re.test(mine)) isMine = true;
  });
  return named ? isMine : true;                  // names no lodge at all -> fine
}

// -1 this line belongs to another camp, +1 it names ours, 0 it names none.
function campFit(line, campNames){
  var mine = (campNames || []).join(" ").toLowerCase();
  var named = null, isMine = false;
  CAMPS.forEach(function(c){
    if (!c.re.test(line) && !c.code.test(line)) return;
    named = named || c.name;
    if (c.re.test(mine)) isMine = true;
  });
  if (!named) return 0;
  return isMine ? 1 : -1;
}

function movement(guestInfo, notes, arriveISO, departISO, campCount, campNames){
  var all = [guestInfo || "", notes || ""].join("\n").split(/\n/)
    .map(function(l){ return l.trim(); }).filter(Boolean);

  var out = {};

  // 1. Date-matched lines. The strongest signal there is.
  all.forEach(function(line){
    var d = dateOn(line);
    if (!d) return;
    var text = line.replace(/^[^:]{0,24}:\s*/, "").trim();   // drop a leading "17 Sept:"
    if (!text || text.length < 6) return;
    if (campFit(line, campNames) < 0) return;        // another camp's movement
    if (sameDay(d, arriveISO) && !out.arrival && movementFits(text, "arrival", campNames))
      out.arrival = { value: text, source: line, confident: true };
    if (sameDay(d, departISO) && !out.departure && movementFits(text, "departure", campNames))
      out.departure = { value: text, source: line, confident: true };
  });

  // 2. Labelled lines, but ONLY for a single-camp booking. With two camps
  //    "Arrival Details:" appears twice and nothing says which is which.
  if (campCount === 1){
    all.forEach(function(line){
      var m = line.match(LABEL_LINE);
      if (!m || !MOVEMENT_LABEL.test(m[1])) return;
      var v = (m[2] || "").trim();
      if (!v || v.length < 6) return;
      if (campFit(line, campNames) < 0) return;
      var isDep = DEPART_WORD.test(m[1]);
      var isArr = ARRIVE_WORD.test(m[1]) || /movement/i.test(m[1]);
      if (isDep && !out.departure)      out.departure = { value: v, source: line, confident: true };
      else if (isArr && !out.arrival)   out.arrival   = { value: v, source: line, confident: true };
    });
  }
  return out;
}

function parseOpsChart(rows, campNames){
  // A lodge can be more than one property in ResRequest. Boteti is two —
  // "Boteti River Camp" (Rooms, Family Room) and "Boteti River Camp -
  // Campsites" (the eight campsites AND the Meru Tents) — and Mark's real
  // export carries all 78 legs in one file. So this matches against a LIST.
  var wanted = (Array.isArray(campNames) ? campNames : [campNames])
    .filter(Boolean).map(function(n){ return String(n).toLowerCase(); });
  var MONTHS = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",
                jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"};
  function iso(v){
    if (v == null) return null;
    var t = String(v).trim();
    var m = t.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/);
    if (m){ var mm = MONTHS[m[2].toLowerCase()]; if (mm) return m[3]+"-"+mm+"-"+("0"+m[1]).slice(-2); }
    m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[0] : null;
  }
  function cell(r,i){ var v = r && r[i]; return v == null ? "" : String(v).trim(); }
  function num(v){ var n = parseInt(String(v).replace(/[^0-9-]/g,""),10); return isNaN(n) ? null : n; }

  var out = [], camps = {}, cur = null, section = "";
  function flush(){
    if (!cur) return;
    var mine = cur.legs.filter(function(l){ return wanted.indexOf(l.property.toLowerCase()) >= 0; });
    // One real party is one booking even when the sheet splits it over several
    // lines: group by the dates, sum the rooms, collect the room numbers.
    var groups = {};
    mine.forEach(function(l){
      var k = l.arrive+"|"+l.depart;
      var g = groups[k] || (groups[k] = { arrive:l.arrive, depart:l.depart, rooms_needed:0,
                                          rooms:[], accomm:l.accomm, adults:0, children:0 });
      g.rooms_needed += (l.rms || 1);
      g.adults += (l.adults || 0);
      g.children += (l.children || 0);
      // A room is identified by its TYPE as well as its number, never the
      // number alone. ResRequest restarts the numbering for the Pilot guide
      // room, so "Room 1 / Pilot guide room" is the pilot room and NOT
      // Standard Room 1 — a real overlap this caught, where Arkle in room 1
      // and a tour leader in pilot room 1 looked like a double-booking.
      // Resolving the label is the server's job; the type travels with it.
      var nums = String(l.room).split(/[,\/]/).map(function(r){ return r.trim(); }).filter(Boolean);
      // A campsite IS its accommodation — "Campsite 3 (1 to 6)" names the
      // site, and in Boteti's real export every campsite leg has the Room
      // column blank. So it still claims a unit; the server resolves which.
      if (!nums.length && /campsite/i.test(l.accomm || "")) nums = [""];
      nums.forEach(function(r){ g.rooms.push({ number: r, accomm: l.accomm || "" }); });
    });
    var got = extract(cur.guests, cur.notes);
    Object.keys(groups).forEach(function(k){
      var g = groups[k];
      var mv = movement(cur.guests, cur.notes, g.arrive, g.depart,
                        Object.keys(cur.camps || {}).length || 1, wanted);
      out.push({ booking_ref:cur.ref, guest_name:cur.name, agent:cur.agent||null,
                 arrival_details: mv.arrival && mv.arrival.value || null,
                 departure_details: mv.departure && mv.departure.value || null,
                 arrive_date:g.arrive, depart_date:g.depart,
                 adults:g.adults||null, children:g.children||null,
                 rooms_needed:g.rooms_needed||1, room_type_needed:g.accomm||null,
                 special_requests:cur.notes||null, rooms:g.rooms,
                 // Mark, 2026-09-27: the Type column carries the bed
                 // configuration and the board basis; Notes carries the
                 // summary of dietaries, medical and special occasions.
                 // All five are read out of free prose — see extract().
                 bed_type: got.bed && got.bed.value || null,
                 booking_basis: got.basis && got.basis.value || null,
                 dietary: got.dietary && got.dietary.value || null,
                 medical: got.medical && got.medical.value || null,
                 special_occasion: got.occasion && got.occasion.value || null,
                 // The block itself, kept whole. A missed allergy is a real
                 // risk to a guest, so an extracted value is never the only
                 // record and a manager can always see what it came from.
                 guest_details: cur.guests || null,
                 extraction: Object.assign({}, got,
                   mv.arrival ? { arrival: mv.arrival } : null,
                   mv.departure ? { departure: mv.departure } : null) });
    });
    cur = null;
  }

  for (var i=0; i<rows.length; i++){
    var r = rows[i], c0 = cell(r,0), c1 = cell(r,1), c5 = cell(r,5);
    if (c0 === "Arrival date") continue;
    if (!c0 && !c1 && !cell(r,2)){ flush(); continue; }
    if (iso(c0) && /^WB\d+/i.test(c5)){
      flush();
      cur = { ref:c5, name:cell(r,3), legs:[], agent:"", guests:"", notes:"" };
      section = ""; continue;
    }
    if (!cur) continue;
    if (c0 === "Itinerary summary"){ section = "legs"; continue; }
    if (c0 === "Extras"){ section = "extras"; continue; }
    if (c0 === "Guest information"){ cur.guests = c1; section = ""; continue; }
    if (c0 === "Notes"){ cur.notes = c1; section = ""; continue; }
    if (c0 === "Agent"){ cur.agent = c1; section = ""; continue; }
    if (c0 === "Repeat Guests"){ section = ""; continue; }
    // An itinerary leg carries its arrive date in column 2. Extras rows look
    // similar but carry theirs in column 3 — hence tracking the section
    // rather than sniffing the shape.
    if (section === "legs" && iso(cell(r,2)) && c5){
      camps[c5] = (camps[c5]||0) + 1;
      (cur.camps || (cur.camps = {}))[c5] = true;
      cur.legs.push({ room:c1, arrive:iso(cell(r,2)), depart:iso(cell(r,3)),
                      property:c5, accomm:cell(r,6),
                      rms:num(cell(r,7)), adults:num(cell(r,8)), children:num(cell(r,9)) });
    }
  }
  flush();
  return { bookings: out, camps: camps };
}

// Which bookings are worth sending to the AI layer, and which are not.
//
// A booking is only worth reading if the rules found NO HEADING for a field.
// "Dietary requirements: None" is an answer — the agent was asked and said
// no — so that booking is finished and costs nothing. This keeps the bill to
// the bookings that actually have prose nobody has labelled.
//
// extract() distinguishes the two: a heading that was found and said nothing
// still returns an entry (with value null), whereas no heading at all returns
// nothing for that field.
function needsAi(b){
  var x = b.extraction || {};
  var open = ["dietary","medical","occasion","arrival","departure"].some(function(k){ return !x[k]; })
          || !x.bed || !x.basis;
  if (!open) return false;
  var text = [b.guest_details || "", b.special_requests || ""].join(" ").trim();
  return text.length > 25;            // nothing to read in a line or two
}

// What gets merged back. The AI never overwrites something the rules read off
// a real heading — a labelled value is better evidence than a sentence — so
// this only ever fills gaps.
function mergeAi(b, got){
  if (!got) return;
  var x = b.extraction || (b.extraction = {});
  var into = { bed:"bed_type", basis:"booking_basis", dietary:"dietary",
               medical:"medical", occasion:"special_occasion",
               arrival:"arrival_details", departure:"departure_details" };
  var campNames = (shownCamp && shownCamp.resrequest_names) || [shownCamp && shownCamp.name];
  Object.keys(into).forEach(function(k){
    if (x[k]) return;                 // the rules already answered this one
    var f = got[k];
    if (!f || !f.value) return;
    // The model is good at finding the line and less good at noticing it
    // belongs to the next lodge. Checked here rather than trusted.
    if ((k === "arrival" || k === "departure") && !movementFits(f.value, k, campNames)) return;
    x[k] = f;
    b[into[k]] = f.value;
  });
}

var opsPending = null;

function opsMsg(text, kind){
  var m = el("msg-ops");
  if (m){ m.textContent = text || ""; m.className = "status" + (kind ? " " + kind : ""); }
}

function showOpsReport(parsed, res){
  var withRoom = parsed.bookings.filter(function(b){ return b.rooms.length; }).length;
  var mine = ((shownCamp && shownCamp.resrequest_names) || [shownCamp && shownCamp.name])
    .filter(Boolean).map(function(n){ return String(n).toLowerCase(); });
  var other = Object.keys(parsed.camps).filter(function(c){
    return mine.indexOf(c.toLowerCase()) < 0;
  });
  var h = '<p class="meta" style="margin-top:8px">Found <b>'+parsed.bookings.length+'</b> booking'
        + (parsed.bookings.length===1?"":"s") + ' for '+esc(shownCamp ? shownCamp.name : "this camp")
        + ' — <b>'+withRoom+'</b> with a room allocated, <b>'+(parsed.bookings.length-withRoom)
        + '</b> still to place.</p>';
  if (other.length) h += '<p class="meta">Other camps in this file (ignored): '+esc(other.join(", "))+'.</p>';
  if (parsed.aiRead){
    h += '<p class="meta">'
      + (parsed.aiOff
          ? "Read " + parsed.aiRead + " booking(s) by label only — the AI reader is not configured."
          : "Read " + parsed.aiRead + " booking(s) whose notes carry no headings; found something in <b>"
            + (parsed.aiFilled || 0) + "</b>. Those show on the sheet marked as worth a look.")
      + "</p>";
  }
  if (!parsed.bookings.length){
    h += '<p class="warn">Nothing in this file is for this camp. Check you exported the right property, '
      +  'and that you are on the right camp\'s day sheet.</p>';
  }
  if (res){
    h += '<p class="meta"><b>'+res.created+'</b> new, <b>'+res.updated+'</b> already here and refreshed, <b>'
      +  res.allocated+'</b> to be placed in a room'
      +  (res.already_placed ? ', <b>'+res.already_placed+'</b> already in the right room' : '')
      +  '.</p>';
    if (res.warnings && res.warnings.length){
      h += '<p class="warn">'+res.warnings.length+' thing'+(res.warnings.length===1?"":"s")+' to look at:</p><ul class="meta">';
      res.warnings.slice(0, 25).forEach(function(w){ h += "<li>"+esc(w)+"</li>"; });
      if (res.warnings.length > 25) h += "<li>… and "+(res.warnings.length-25)+" more</li>";
      h += "</ul>";
    }
  }
  el("opsreport").innerHTML = h;
}

document.addEventListener("change", function(e){
  if (e.target.id !== "opsfile") return;
  var file = e.target.files && e.target.files[0];
  el("opsimport").hidden = true;
  el("opsreport").innerHTML = "";
  opsPending = null;
  if (!file) return;
  if (!shownCamp){ opsMsg("Pick a camp first", "err"); return; }

  if (!drawerOpen){
    drawerOpen = true;
    el("drawerBtn").textContent = "Hide bookings & notes";
    var dr = document.querySelector(".drawer");
    if (dr) dr.hidden = false;
  }
  var panel = document.querySelector(".panel.opsimport");
  if (panel) panel.scrollIntoView({ block: "nearest" });
  opsMsg("Reading…");
  loadXlsx().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, { type: "array" });
      if (wb.SheetNames.indexOf("notes") < 0){
        throw new Error("this file has no 'notes' sheet — is it an Operations Chart export?");
      }
      // raw:false so dates arrive as the text the sheet shows, which is what
      // the parser expects; defval keeps the columns aligned.
      var rows = XLSX.utils.sheet_to_json(wb.Sheets["notes"], { header: 1, raw: false, defval: "" });
      var parsed = parseOpsChart(rows, (shownCamp.resrequest_names && shownCamp.resrequest_names.length)
                                              ? shownCamp.resrequest_names : [shownCamp.name]);
      if (!parsed.bookings.length){ showOpsReport(parsed, null); opsMsg(""); return; }
      var ask = parsed.bookings.filter(needsAi);
      var step = Promise.resolve();
      if (ask.length){
        opsMsg("Reading "+ask.length+" booking"+(ask.length===1?"":"s")+" the labels did not cover…");
        step = post("ai_extract", {
          items: ask.map(function(b, i){
            b._ai = "b" + i;
            // The camp and the leg's own dates go with the text: movement notes
            // cover a whole itinerary, and without them the model cannot tell
            // which lodge's transfer is which.
            return { id: b._ai, camp: shownCamp && shownCamp.name,
                     arrive: b.arrive_date, depart: b.depart_date,
                     text: [b.guest_details || "", b.special_requests || ""].join("\n\n") };
          })
        }).then(function(res){
          // A failure here is not an error: the rules already did their part,
          // and an import must never depend on OpenRouter being reachable.
          var r = (res && res.results) || {};
          var filled = 0;
          ask.forEach(function(b){ if (r[b._ai]){ mergeAi(b, r[b._ai]); filled++; } });
          parsed.bookings.forEach(function(b){ delete b._ai; });
          parsed.aiRead = ask.length;
          parsed.aiFilled = filled;
          parsed.aiOff = res && res.used === false;
        });
      }
      return step.then(function(){
      opsMsg("Checking against what is already here…");
      // Always a dry run first. An import that quietly allocates thirty rooms
      // is not something to discover afterwards.
      return post("import_ops_chart", {
        dry_run: true, person_id: personId(),
        bookings: parsed.bookings.map(stripForApi)
      }).then(function(res){
        if (res.error){ opsMsg(res.error, "err"); return; }
        opsPending = parsed;
        showOpsReport(parsed, res);
        el("opsimport").hidden = false;
        el("opsimport").textContent = "Import " + parsed.bookings.length + " booking"
          + (parsed.bookings.length===1?"":"s");
        opsMsg("Nothing changed yet", "dirty");
      });
      });
    });
  }).catch(function(err){
    opsMsg(String(err.message || err), "err");
  });
});

// Everything parsed is sent now, guest_details included: it is the original
// block the extracted dietary and medical values came from, and keeping it is
// the safeguard against a mis-read (see the migration's own note).
function stripForApi(b){ return b; }

document.addEventListener("click", function(e){
  var src = e.target.getAttribute && e.target.getAttribute("data-src");
  if (src) return openSource(src);
});

document.addEventListener("click", function(e){
  if (e.target.id !== "opsimport") return;
  if (!opsPending) return;
  e.target.disabled = true;
  opsMsg("Importing…");
  post("import_ops_chart", {
    dry_run: false, person_id: personId(),
    bookings: opsPending.bookings.map(stripForApi)
  }).then(function(res){
    e.target.disabled = false;
    if (res.error){ opsMsg(res.error, "err"); return; }
    opsMsg(res.created+" added, "+res.updated+" refreshed, "+res.allocated+" placed", "ok");
    el("opsimport").hidden = true;
    opsPending = null;
    load();
  });
});

fetch(FN + (shownCamp ? "?location_id=" + encodeURIComponent(shownCamp.id) : "")).then(function(r){return r.json();}).then(function(b){
  boot = b;
  el("whoami").textContent = me.name + (me.department ? " · " + me.department : "");
  el("date").value = today();
  el("date").addEventListener("change", load);
  load();
});
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
