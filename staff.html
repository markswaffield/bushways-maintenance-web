<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Bush Ways — Staff</title>
<!--
  Staff — every real person across the group, editable. Per Mark,
  2026-09-17, right after the real group staff list (227 people,
  notes/BW Group Staff Names.xlsx, D-043) was loaded: "we also need an
  option to be able to edit these lists - both the names and
  departments if possible."

  Same two rules every other real catalogue here already follows:
   - NOTHING IS EVER DELETED. Retiring keeps every inspection and every
     fixed fault on record, restorable, the same as an asset leaving.
   - A new hire or a real name correction shouldn't need a migration —
     staff are data, the same argument root D-012 made about locations
     and D-012's own asset lifecycle made about equipment.

  is_administrator is deliberately not editable here — D-037's own
  gate was raised carefully, one flag at a time, by Mark himself; a
  generic edit form is not the place to quietly grant it. Ask, or edit
  the database directly with Mark's own confirmation, the same way the
  6 real Administrators were set.

  is_base_manager, 2026-09-17, same reasoning: per Mark, "i have
  clearly indicated which managers are base managers that need access
  to all the sites" — a real permission (it decides who shows up in
  every lodge's own "Who am I" picker), set from his own marked-up
  sheet, shown here but not offered on the generic edit form.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:20px 0 4px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;gap:6px}
  h2 .count{font-weight:400;color:#8C6A2F;text-transform:none;letter-spacing:0;font-size:13px}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  #who{font-size:15px;padding:8px 10px}
  @media (max-width:700px){
    .nav{font-size:13px;gap:6px}
    .nav a,.nav b{padding:6px 10px}
    #who{font-size:17px;padding:10px 12px}
  }
  select,input,textarea{padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box;width:100%}
  button{padding:6px 11px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#fff;color:#43594A;border-radius:5px;cursor:pointer}
  button.primary{background:#43594A;color:#fff}
  button.danger{border-color:#A8502F;color:#A8502F}
  /* The sign-in bar — was the same card as the filter boxes below;
     too big on a phone, Mark, 2026-09-23: "that block showing who is
     signed in... is too big - especially for the phone screen." One
     compact row now — "Show retired" stays a plain checkbox
     underneath, since that's a filter, not identity. */
  .whobar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
    border:1px solid #E3DFD3;border-radius:8px;padding:7px 12px;background:#fff;font-size:13px;margin-top:10px}
  .whobar b{color:#122D31}
  /* margin-left:auto is the real fix, not justify-content alone — once
     the name/camp text and this button group can't both fit one line,
     flex-wrap drops this group onto its own line, alone — and
     space-between has nothing left to space against there, so it fell
     back to sitting at the left. Mark, on a real phone screenshot:
     "i want all the sign out buttons moved to the right in the
     block." auto margin pushes it to the end of whatever line it's
     actually on, wrapped or not. */
  .whobar-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .whobar-btns button{width:auto;padding:6px 11px;font-size:12.5px;margin:0}
  /* Darker text on both (Mark: "make the text darker for both so it
     is easier to read") and Sign out picked out with its own colour
     ("highlighted the sign out") — :last-child rather than a new
     class, since Sign out is always the last button in this row
     wherever it appears. */
  .whobar .whobar-btns button{color:#232019}
  .whobar .whobar-btns button:last-child{background:#F4E3D3;border-color:#8C6A2F;color:#4A3620;font-weight:600}
  .whobar-extra{margin-top:6px}
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:9px 10px;background:#fff;margin-top:10px}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:1px 8px;margin:0 0 7px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 3px}
  .filter-section label:first-of-type{margin-top:0}
  /* A checkbox row needs the same real tap target as everything else
     — Mark, 2026-09-17, on the schedule page's Mine checkbox: "too
     small to see easily or hit with your finger," then: "please fix
     all that have the same issue." A bare browser checkbox stays tiny
     regardless of its label, so the box itself is enlarged, not just
     the text. Not scoped to .filter-section — the same class marks
     the Management checkbox on the edit-person .form below too. */
  label.check{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;padding:4px 0}
  /* Size, then accent-color, then a border — none of it reliable, all
     on the same underlying problem: a native checkbox's own rendering
     is the OS/browser's call, not CSS's. Mark, after the border still
     wasn't enough: "the same problem still exists for the checkboxes."
     Native rendering turned off entirely (appearance:none) and
     replaced with a plain square and a hand-drawn tick instead. */
  label.check input[type=checkbox]{
    appearance:none;-webkit-appearance:none;margin:0;
    width:24px;height:24px;flex:none;box-sizing:border-box;
    border:2px solid #43594A;border-radius:4px;
    background:#fff;cursor:pointer;position:relative;
  }
  label.check input[type=checkbox]:checked{background:#43594A}
  label.check input[type=checkbox]:checked::after{
    content:"";position:absolute;left:7px;top:3px;
    width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  @media (max-width:700px){
    label.check{font-size:16px;padding:6px 0}
    label.check input[type=checkbox]{width:28px;height:28px}
    label.check input[type=checkbox]:checked::after{left:9px;top:4px;width:7px;height:14px}
  }
  @media (min-width:700px){ .signin-box{max-width:420px} }
  .row{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:9px 13px;margin-top:6px}
  .row.retired{opacity:.5;border-style:dashed}
  .row .nm{font-weight:700;margin:0}
  .row .mt{font-size:12px;color:#6B6455;margin:2px 0 0}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:#D9E6DC;color:#2F6B45;margin-left:6px}
  .tag.admin{background:#F4E3D3;color:#8C6A2F}
  .tag.basemgr{background:#DDE6F4;color:#2F5B8C}
  .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .form{background:#FBFAF6;border:1px solid #C9C2AC;border-radius:8px;padding:12px;margin-top:8px}
  .form label{display:block;font-size:11.5px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:9px 0 4px}
  .form label:first-child{margin-top:0}
  /* .form label above would otherwise win the checkbox-row rules
     above (equal specificity, later in the sheet) — restated here so
     the Management checkbox gets the same real tap target. */
  .form label.check{display:flex;text-transform:none;letter-spacing:0;font-size:14px}
  @media (max-width:700px){ .form label.check{font-size:16px} }
  .form .row2{display:flex;gap:8px}
  .form .row2 > *{flex:1}
  .note{font-size:12.5px;color:#6B6455;margin:6px 0 0}
  .loading{color:#6B6455;margin-top:18px}
  [hidden]{display:none!important}
</style></head><body>

<h1>Staff — Bush Ways</h1>
<p class="sub">Every real person across the group. Nothing here is ever deleted — retiring keeps the history.</p>
<script src="./nav.js"></script>
<div id="navRow"></div>
<script>
  (function () {
    var m = null;
    try { var s = sessionStorage.getItem("bw_signin"); if (s) m = JSON.parse(s); } catch (e) {}
    document.getElementById("navRow").innerHTML = navHtml(m, "Staff");
  })();
</script>

<div id="whoSignedIn" hidden>
  <div class="whobar">
    <span>👤 <b id="whoName"></b></span>
    <span class="whobar-btns"><button onclick="signOut()">Sign out</button></span>
  </div>
  <label class="check whobar-extra"><input type="checkbox" id="showRetired"> Show retired</label>
</div>
<div class="filter-section signin-box" id="whoPicker">
  <div class="title">Sign in</div>
  <label for="whoDept">Department</label><select id="whoDept"></select>
  <label for="who">You are</label><select id="who"></select>
  <label for="whoPin">PIN</label><input type="password" id="whoPin" inputmode="numeric" maxlength="6">
  <div id="whoSetPin" hidden><label for="whoNewPin">New PIN (4–6 digits)</label><input type="password" id="whoNewPin" inputmode="numeric" maxlength="6"></div>
  <div id="whoSetPinBtn" hidden style="margin-top:10px"><button onclick="doWhoSetPin()" style="width:100%">Set PIN</button></div>
  <button class="primary" onclick="doWhoLogin()" style="width:100%;margin-top:10px">Sign in</button>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="showRetired2"> Show retired</label>
  <div style="width:100%"><p class="note" id="whoErr" style="color:#A8502F" hidden></p></div>
</div>

<div id="app"><p class="loading">Loading…</p></div>

<script>
var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
var me = null, bootPeople = [], data = null, showRetired = false;
var editing = null;
// Collapsed by default — 227 people across 8 locations would otherwise
// be one very long scroll. Click a location's own heading to open it.
var openLocations = {};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}

function post(action, body){
  return fetch(FN + "?action=" + action, {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify(Object.assign({ by_person_id: me && me.id }, body))
  }).then(function(r){return r.json();});
}

window.toggleLocation = function(id){
  openLocations[id] = !openLocations[id]; render();
};

window.startAdd = function(locationId){
  editing = { home_location_id: locationId }; render();
};
window.startEdit = function(id){
  var p = data.people.filter(function(x){ return x.id === id; })[0];
  editing = Object.assign({}, p); render();
};
window.cancel = function(){ editing = null; render(); };

window.savePerson = function(){
  post("save_person", {
    id: editing.id || null,
    name: el("f_name").value,
    phone: el("f_phone").value,
    home_location_id: el("f_loc").value,
    department_id: el("f_dept").value || null,
    is_manager: el("f_mgr").checked,
  }).then(function(out){
    if (out.error) { alert(out.error); return; }
    editing = null; load();
  });
};

window.retire = function(id, restore){
  var reason = restore ? null : prompt("Why are they leaving? (resigned, contract ended, transferred…)");
  if (!restore && reason === null) return;
  post("retire_person", { id: id, restore: !!restore, reason: reason })
    .then(function(out){ if (out.error) alert(out.error); load(); });
};

// Every shared department first, then this location's own — an
// <optgroup> per source so the dropdown reads as what it is instead of
// one flat, unexplained list. Per Mark, 2026-09-17: "is it possible to
// create departments per location, and not a one size fits all?"
function deptOptions(forLocationId, selected){
  var shared = data.departments.filter(function(d){ return !d.location_id; });
  var local = data.departments.filter(function(d){ return d.location_id === forLocationId; });
  function opts(list){
    return list.map(function(d){
      return '<option value="' + esc(d.id) + '"' + (selected === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
    }).join("");
  }
  var h = '<option value="">No department</option>';
  h += '<optgroup label="Shared, every lodge">' + opts(shared) + '</optgroup>';
  if (local.length) {
    var locName = (data.locations.filter(function(l){ return l.id === forLocationId; })[0] || {}).name || "This location";
    h += '<optgroup label="' + esc(locName) + ' only">' + opts(local) + '</optgroup>';
  }
  return h;
}

function personForm(){
  var isNew = !editing.id;
  return '<div class="form">' +
    '<label>Name</label><input type="text" id="f_name" value="' + esc(editing.name || "") + '" placeholder="What colleagues actually call them">' +
    '<div class="row2">' +
    '<div><label>Phone</label><input type="text" id="f_phone" value="' + esc(editing.phone || "") + '" placeholder="+267 71234567"></div>' +
    '<div><label>Home lodge</label><select id="f_loc" onchange="editing.home_location_id=this.value;render()">' +
    data.locations.map(function(l){
      return '<option value="' + esc(l.id) + '"' + (editing.home_location_id === l.id ? " selected" : "") + '>' + esc(l.name) + '</option>';
    }).join("") + '</select></div>' +
    '</div>' +
    '<label>Department</label><select id="f_dept">' + deptOptions(editing.home_location_id, editing.department_id) + '</select>' +
    '<label class="check" style="margin-top:10px">' +
    '<input type="checkbox" id="f_mgr"' + (editing.is_manager ? " checked" : "") + '> Management</label>' +
    '<div class="acts"><button class="primary" onclick="savePerson()">' + (isNew ? "Add" : "Save changes") + '</button>' +
    '<button onclick="cancel()">Cancel</button></div></div>';
}

function personRow(p){
  var h = '<div class="row' + (p.retired ? " retired" : "") + '">' +
    '<p class="nm">' + esc(p.name) +
    (p.department ? '<span class="tag">' + esc(p.department) + '</span>' : "") +
    (p.is_administrator ? '<span class="tag admin">Administrator</span>' : "") +
    (p.is_base_manager ? '<span class="tag basemgr">Base Manager — all sites</span>' : "") +
    (p.retired ? " · retired" : "") + '</p>' +
    '<p class="mt">' + (p.phone ? esc(p.phone) : "no number on file") + '</p>' +
    (p.retired && p.retired_reason ? '<p class="mt">' + esc(p.retired_reason) + '</p>' : "");
  // Visible to all management, editable only by administrators — per
  // Mark, 2026-09-18: "Assets and Staff - visible to all management
  // but not editable" and "visible and editable to all managers who
  // are administrators." The server enforces the same split.
  if (editing && editing.id === p.id) { h += personForm(); }
  else if (me && me.is_administrator) {
    h += '<div class="acts">';
    h += '<button onclick="startEdit(\'' + p.id + '\')">Edit</button>';
    h += p.retired
      ? '<button onclick="retire(\'' + p.id + '\',true)">Restore</button>'
      : '<button class="danger" onclick="retire(\'' + p.id + '\')">Retire</button>';
    h += '</div>';
  }
  return h + '</div>';
}

function render(){
  var h = "";
  var byLoc = {};
  (data.people || []).forEach(function(p){
    (byLoc[p.home_location_id] = byLoc[p.home_location_id] || []).push(p);
  });
  data.locations.forEach(function(loc){
    var all = byLoc[loc.id] || [];
    if (!all.length) return; // no real staff there yet (Kalahari Adventures)
    var list = showRetired ? all : all.filter(function(p){ return !p.retired; });
    var retiredCount = all.filter(function(p){ return p.retired; }).length;
    list.sort(function(a,b){ return a.name.localeCompare(b.name); });
    var open = !!openLocations[loc.id];

    h += '<h2 onclick="toggleLocation(\'' + loc.id + '\')">' + (open ? "▾" : "▸") + ' ' + esc(loc.name) +
      ' <span class="count">' + list.length +
      (retiredCount && !showRetired ? " · " + retiredCount + " retired" : "") +
      (open ? "" : " — tap to open") + '</span></h2>';
    if (!open) return;

    if (me && me.is_administrator && !(editing && !editing.id && editing.home_location_id === loc.id)) {
      h += '<div class="acts"><button onclick="startAdd(\'' + loc.id + '\')">+ Add</button></div>';
    }
    if (editing && !editing.id && editing.home_location_id === loc.id) h += personForm();

    list.forEach(function(p){ h += personRow(p); });
    if (!list.length) h += '<p class="note">None' + (retiredCount ? " showing" : "") + '.</p>';
  });
  el("app").innerHTML = h;
}

// Visible to management, invisible to everyone else — per Mark,
// 2026-09-18. Enforced here and on the server, same as assets.html.
function load(){
  if (!me) {
    el("app").innerHTML = '<p class="note">Sign in as management to view this.</p>';
    return Promise.resolve();
  }
  if (!me.is_manager) {
    el("app").innerHTML = '<p class="note">Only management can view this.</p>';
    return Promise.resolve();
  }
  return fetch(FN + "?action=staff_list&person_id=" + encodeURIComponent(me.id))
    .then(function(r){return r.json();}).then(function(d){
      if (d.error) { el("app").innerHTML = '<p class="note">' + esc(d.error) + '</p>'; return; }
      data = d; render();
    });
}

el("showRetired").addEventListener("change", function(){ showRetired = this.checked; render(); });

// Department first, then name — per Mark, 2026-09-17, once the real
// staff list made this dropdown long: "the list is very long - i think
// we need some filter options to shorten the list. department picker -
// then name picker." Never hides anyone with no department set.
function renderWhoOptions(deptFilter){
  var shown = !deptFilter ? bootPeople : bootPeople.filter(function(p){ return p.department === deptFilter; });
  el("who").innerHTML = '<option value="">— nobody —</option>' + shown.map(function(p){
    return '<option value="' + esc(p.id) + '" data-pin-set="' + p.pin_set + '">' + esc(p.name) + (p.is_manager ? " (management)" : "") + '</option>';
  }).join("");
  el("who").onchange = function(){
    var opt = el("who").selectedOptions[0];
    var need = !!opt && opt.dataset.pinSet === "false";
    el("whoSetPin").hidden = !need; el("whoSetPinBtn").hidden = !need;
  };
}

// Group-wide PIN sign-in — per Mark, 2026-09-17: "I would like the
// group wide sign in option... doing this once now solves the problem
// of identifying who worked on something right now." Kept only in
// sessionStorage, clearing the moment the tab or browser closes — the
// same reasoning Edit Checklists' own Administrator sign-in already
// had (D-037), generalised to any real person.
window.doWhoSetPin = function(){
  var id = el("who").value, pin = el("whoNewPin").value;
  fetch(FN + "?action=set_pin", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ person_id: id, pin: pin }),
  }).then(function(r){return r.json();}).then(function(out){
    if (out.error) { alert(out.error); return; }
    el("whoSetPin").hidden = true; el("whoSetPinBtn").hidden = true;
    el("whoPin").value = pin;
    alert("PIN set. Sign in below.");
  });
};
window.doWhoLogin = function(){
  var id = el("who").value, pin = el("whoPin").value;
  var err = el("whoErr"); err.hidden = true;
  if (!id || !pin) { err.textContent = "Pick your name and enter your PIN."; err.hidden = false; return; }
  fetch(FN + "?action=login", {
    method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({ person_id: id, pin: pin }),
  }).then(function(r){return r.json();}).then(function(out){
    if (out.error) { err.textContent = out.error; err.hidden = false; return; }
    me = { id: out.person_id, name: out.name, department: out.department, is_manager: out.is_manager, is_administrator: out.is_administrator };
    sessionStorage.setItem("bw_signin", JSON.stringify(me));
    showSignedIn();
  });
};
window.signOut = function(){
  sessionStorage.removeItem("bw_signin");
  location.reload();
};
function showSignedIn(){
  el("whoPicker").hidden = true;
  el("whoSignedIn").hidden = false;
  el("whoName").textContent = me.name;
  el("showRetired").parentElement.hidden = !me.is_manager;
  load();
}

fetch(FN).then(function(r){return r.json();}).then(function(b){
  bootPeople = b.people || [];
  var deptNames = (b.departments || []).map(function(d){ return d.name; })
    .filter(function(n){ return bootPeople.some(function(p){ return p.department === n; }); });
  el("whoDept").innerHTML = '<option value="">All departments</option>' +
    deptNames.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join("");
  el("whoDept").addEventListener("change", function(){ renderWhoOptions(this.value); });
  renderWhoOptions("");
  try {
    var saved = sessionStorage.getItem("bw_signin");
    if (saved) { me = JSON.parse(saved); showSignedIn(); return; }
  } catch (e) {}
  return load();
}).catch(function(e){ el("app").innerHTML = '<p class="loading">Could not load: ' + esc(e) + '</p>'; });
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
