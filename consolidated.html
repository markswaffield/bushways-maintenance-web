<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Consolidated Checklist</title>
<!--
  The mechanism Mark's whole "select targets to build a schedule"
  conversation was building toward (D-064/D-065/D-066), 2026-09-18:
  "we create a schedule - select all the targets that should be
  included. Then the tool collates all the checklists associated with
  those targets and generates a consolidated checklist for that
  schedule."

  Rebuilt the same day (tool-local D-078) once Mark saw it wasn't
  realistic for one person to do every target in one sitting: "It is
  unlikely that a single manager will do the whole check themselves...
  maybe it would be good to install a HOLD or HANDOVER button... this
  would then tie in with the audit trail." Each target now checks off
  and submits for real the moment its own "✓ checked" button is
  tapped — no more one big batch submitted at the very end — so
  stopping partway through simply means leaving; whoever comes back
  (the same person or someone else entirely) sees exactly which
  targets are already done, by whom, and only fills in what's left.
  The schedule itself only truly completes (its due date rolls
  forward) once every target shows checked and Confirm is tapped.

  A separate page from checklist.html on purpose, not a mode bolted
  onto it — the per-item rendering (D-060's read-only reopened faults,
  the fault picker, "a different problem with this too", photos) is
  copied from there deliberately, not shared by import. Every id/data
  attribute is namespaced by target index ("t0_", "t1_"...) since
  several targets' items can render on one page at once.

  Underneath, this still submits one real Inspection per target
  (D-064's own decision) — every existing piece (D-034's Area→Target
  grouping, D-060's live faults, a transfer taking a target's own
  faults with it) keeps working completely unmodified.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 8px;color:#43594A;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #43594A;padding-bottom:4px}
  h3{font-size:13px;margin:16px 0 6px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 6px}
  label{display:block;font-size:13px;color:#5B5344;margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff;margin-top:14px}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  button.small{padding:9px 14px;font-size:14px;width:auto}
  button:disabled{opacity:.55}
  .item{border-bottom:1px solid #E3DFD3;padding:12px 0}
  .item label.main{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:#232019;margin:0;cursor:pointer}
  .item input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:1px}
  .details{display:none;margin:10px 0 0 30px;padding:10px;background:#EFECE3;border-radius:6px}
  .item.open .details{display:block}
  .reopen-banner{background:#F4CFC2;color:#A8502F;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:6px;margin:0 0 8px}
  .note{color:#8C6A2F;font-size:12px;margin-top:2px}
  .confirm{background:#EFECE3;border-radius:8px;padding:16px;margin-top:16px}
  .loading{color:#6B6455;font-size:14px}
  /* Progress header — always visible, since it's the whole point of
     this page now: how far through is this run, and what's left. */
  .progress-bar{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .progress-bar .count{font-weight:700;color:#43594A}
  /* A target already checked off this run — collapsed to one line,
     out of the way, but not hidden: who did it and when is the point. */
  .target-done{background:#EAF1EC;border:1px solid #43594A;border-radius:8px;padding:12px 14px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .target-done b{color:#122d31}
  .target-done .who{font-size:12.5px;color:#43594A}
  .target-section{margin-top:22px}
  .target-foot{display:flex;gap:10px;margin-top:16px}
  .target-foot button{margin-top:0}
  [hidden]{display:none!important}
</style></head><body>

<div id="loading"><h1>Loading…</h1></div>

<div id="checklist" hidden>
  <h1 id="scheduleTitle"></h1>
  <p class="sub" id="scheduleSub"></p>
  <div class="progress-bar">
    <span><span class="count" id="progressCount"></span> targets checked</span>
    <button class="secondary small" id="holdBtn" style="margin:0">Hold — come back later</button>
  </div>
  <div id="targetsBox"></div>
  <div id="closeOutBox" hidden>
    <button id="confirmRunBtn">Confirm — close out this schedule</button>
  </div>
  <button class="secondary" onclick="location.href='./schedule.html'">← Back to Schedule</button>
</div>

<div id="done" hidden>
  <h1>Recorded</h1>
  <div class="confirm" id="doneBox"></div>
  <button class="secondary" onclick="location.href='./schedule.html'">← Back to Schedule</button>
</div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";

  var signedInAs = null;
  try { var savedSignIn = sessionStorage.getItem("bw_signin"); if (savedSignIn) signedInAs = JSON.parse(savedSignIn); } catch (e) {}
  if (!signedInAs) { location.href = "./"; }
  var camp = null;
  try { var savedCamp = sessionStorage.getItem("bw_camp"); if (savedCamp) camp = JSON.parse(savedCamp); } catch (e) {}
  function campName() {
    if (camp) return camp.name;
    if (signedInAs && signedInAs.locations && signedInAs.locations[0]) return signedInAs.locations[0].name;
    return "Chobe Elephant Camp";
  }
  function campParam() {
    return signedInAs ? ("&person_id=" + encodeURIComponent(signedInAs.id) + (camp && camp.id ? "&location_id=" + encodeURIComponent(camp.id) : "")) : "";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function show(id) {
    ["loading", "checklist", "done"].forEach(function (x) {
      document.getElementById(x).hidden = x !== id;
    });
  }
  function shortLabel(text) {
    return String(text).split("\n")[0].split(/\s+[—-]\s+/)[0].trim();
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    var days = Math.floor(mins / 1440);
    if (days < 14) return days + " day" + (days === 1 ? "" : "s") + " ago";
    var weeks = Math.floor(days / 7);
    return weeks + " week" + (weeks === 1 ? "" : "s") + " ago";
  }
  // Shared with checklist.html's own copy — resized client-side before
  // it ever leaves the phone, Maun's bandwidth being the reason.
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  var params = new URLSearchParams(location.search);
  var scheduleId = params.get("schedule");
  if (!scheduleId) {
    document.getElementById("loading").innerHTML = "<h1>No schedule given</h1><p>This page opens from a schedule's own \"Open checklist\" button.</p>";
  } else {
    load();
  }

  function load() {
    show("loading");
    document.getElementById("loading").innerHTML = "<h1>Loading…</h1>";
    fetch(FN + "?action=consolidated_checklist&schedule=" + encodeURIComponent(scheduleId) + campParam())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById("loading").innerHTML = "<h1>Couldn't load this checklist</h1><p>" + esc(data.error) + "</p>";
          return;
        }
        renderConsolidated(data);
      })
      .catch(function (e) {
        document.getElementById("loading").innerHTML = "<h1>Couldn't load this checklist</h1><p>A fault in the page, not your phone. (" + esc(e.message) + ")</p>";
      });
  }

  function renderConsolidated(data) {
    show("checklist");
    document.getElementById("scheduleTitle").textContent = data.schedule_name;
    document.getElementById("scheduleSub").textContent =
      campName() + " — " + data.target_count + " target" + (data.target_count === 1 ? "" : "s") + " in this schedule. Leave an item alone if it's fine.";
    document.getElementById("progressCount").textContent = data.done_count + " of " + data.target_count;
    document.getElementById("holdBtn").onclick = function () { location.href = "./schedule.html"; };

    var itemFaultsById = {};
    var forceNewItemIds = {};

    function faultPickerHtml(ti, item) {
      var key = ti + ":" + item.id;
      itemFaultsById[key] = item.faults;
      if (!item.faults.length) return "";
      var grouped = item.faults.some(function (f) { return f.component_id; });
      if (!grouped) {
        return '<label>What\'s wrong?</label><select data-fault="' + key + '"><option value="">Choose one</option>' +
          item.faults.map(function (f) {
            return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
          }).join("") + '</select>';
      }
      var components = [], seen = {};
      item.faults.forEach(function (f) {
        var ckey = f.component_id || "__other__";
        if (!seen[ckey]) { seen[ckey] = true; components.push({ key: ckey, name: f.component_name || "Other" }); }
      });
      return '<label>Which part?</label><select data-component="' + key + '" onchange="onComponentChange(' + ti + ',\'' + item.id + '\')"><option value="">Choose one</option>' +
        components.map(function (comp) { return '<option value="' + comp.key + '">' + esc(comp.name) + '</option>'; }).join("") +
        '</select>' +
        '<label>What\'s wrong?</label><select data-fault="' + key + '" disabled><option value="">Choose the part first</option></select>';
    }

    window.onComponentChange = function (ti, itemId) {
      var key = ti + ":" + itemId;
      var compSel = document.querySelector('[data-component="' + key + '"]');
      var faultSel = document.querySelector('[data-fault="' + key + '"]');
      var compVal = compSel.value;
      if (!compVal) {
        faultSel.innerHTML = '<option value="">Choose the part first</option>';
        faultSel.disabled = true;
        return;
      }
      var faults = itemFaultsById[key].filter(function (f) { return (f.component_id || "__other__") === compVal; });
      faultSel.innerHTML = '<option value="">Choose one</option>' + faults.map(function (f) {
        return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
      }).join("");
      faultSel.disabled = false;
    };

    var html = "";
    data.targets.forEach(function (t, ti) {
      if (t.done) {
        html += '<div class="target-done" id="doneCard-' + ti + '">' +
          '<span>✓ <b>' + esc(t.target_label) + '</b></span>' +
          '<span class="who">checked by ' + esc(t.done_by || "someone") + ', ' + timeAgo(t.done_at) + '</span></div>';
        return;
      }
      html += '<div class="target-section" id="target-' + ti + '">';
      html += "<h2>" + esc(t.target_label) + "</h2>";
      // A vehicle's odometer, or a metered asset's hours (D-068) — the
      // exact same block inspection.html shows for a single-target
      // check, just once per target here instead of once for the
      // whole page.
      if (t.target_type === "vehicle") {
        html += '<div class="odo"><label>Odometer reading (km) — ' + esc(t.target_label) + '</label>' +
          '<input type="number" inputmode="numeric" data-odometer="' + ti + '" min="0" step="1" placeholder="e.g. 184320">' +
          '<p class="note">' + (t.odometer != null
            ? "Last recorded: " + Number(t.odometer).toLocaleString() + " km."
            : "No reading recorded for this vehicle yet.") + '</p></div>';
      } else if (t.meter_asset_id) {
        html += '<div class="odo"><label>Hours reading — ' + esc(t.target_label) + '</label>' +
          '<input type="number" inputmode="numeric" data-hours="' + ti + '" min="0" step="0.1" placeholder="e.g. 1240.5">' +
          '<p class="note">' + (t.meter_last_reading != null
            ? "Last recorded: " + Number(t.meter_last_reading).toLocaleString() + " hours."
            : "No reading recorded yet.") + '</p></div>';
      }
      t.sections.forEach(function (s) {
        if (s.name !== t.target_label) html += "<h3>" + esc(s.name) + "</h3>";
        s.items.forEach(function (item) {
          var key = ti + ":" + item.id;
          if (item.kind === "reading") {
            html += '<div class="item"><label class="main">' + esc(item.text) + '</label>' +
              '<input type="text" inputmode="numeric" data-value="' + key + '" placeholder="Reading"></div>';
            return;
          }
          var openIssues = item.open_issues || [];
          if (openIssues.length === 1) {
            var oi = openIssues[0];
            var oiFault = (item.faults || []).find(function (f) { return f.id === oi.fault_type_id; });
            forceNewItemIds[key] = true;
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" checked disabled> ' + esc(item.text) + '</label>' +
              '<p class="reopen-banner">⚠ Already reported' + (oiFault ? " — <b>" + esc(oiFault.name) + "</b>" : "") +
              ', not yet fixed. Update or resolve it from Fix a Fault.</p>' +
              '<label class="main" style="margin-top:8px"><input type="checkbox" data-failed="' + key + '"> A different problem with this too</label>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          } else if (openIssues.length > 1) {
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" data-failed="' + key + '"> ' + esc(item.text) + '</label>' +
              '<p class="reopen-banner">⚠ ' + openIssues.length + ' faults already reported here, not yet fixed — resolve them from Fix a Fault.</p>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          } else {
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" data-failed="' + key + '"> ' + esc(item.text) + '</label>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          }
        });
      });
      html += '<div class="target-foot"><button data-check="' + ti + '">✓ ' + esc(t.target_label) + ' checked</button></div>';
      html += '</div>';
    });
    document.getElementById("targetsBox").innerHTML = html;

    document.querySelectorAll("[data-failed]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        cb.closest(".item").classList.toggle("open", cb.checked);
      });
    });

    data.targets.forEach(function (t, ti) {
      if (t.done) return;
      var btn = document.querySelector('[data-check="' + ti + '"]');
      btn.onclick = function () { checkTarget(data, ti, t); };
    });

    updateCloseOut(data);
  }

  // One target, submitted for real the moment it's checked off —
  // tool-local D-078. Whoever's signed in right now is credited on
  // this one Inspection, whether or not they're the same person who
  // did any of the others — that's the audit trail Mark asked for,
  // and it needs nothing extra: performed_by already worked this way
  // on every single-target check, this just calls it per target
  // instead of once for a whole batch at the end.
  function checkTarget(data, ti, t) {
    var results = [];
    t.sections.forEach(function (s) {
      s.items.forEach(function (item) {
        var key = ti + ":" + item.id;
        if (item.kind === "reading") {
          var v = document.querySelector('[data-value="' + key + '"]');
          if (v && v.value) results.push({ item_id: item.id, value: Number(v.value), label: shortLabel(item.text) });
          return;
        }
        var failedEl = document.querySelector('[data-failed="' + key + '"]');
        var failed = failedEl && failedEl.checked;
        if (!failed) return;
        var faultEl = document.querySelector('[data-fault="' + key + '"]');
        var faultLabel = faultEl && faultEl.value ? faultEl.options[faultEl.selectedIndex].text.split(" — ")[0] : null;
        var photoInput = document.querySelector('[data-photo="' + key + '"]');
        results.push({
          item_id: item.id, failed: true,
          fault_type_id: faultEl ? faultEl.value : null,
          action_if_failed: document.querySelector('[data-action="' + key + '"]').value,
          label: shortLabel(item.text), fault_type_label: faultLabel,
          photoFile: photoInput && photoInput.files[0] ? photoInput.files[0] : null,
        });
      });
    });

    var odoInput = document.querySelector('[data-odometer="' + ti + '"]');
    var hoursInput = document.querySelector('[data-hours="' + ti + '"]');
    var odometer = odoInput && odoInput.value !== "" ? Number(odoInput.value) : null;
    var hours = hoursInput && hoursInput.value !== "" ? Number(hoursInput.value) : null;
    if (odometer !== null && t.odometer != null && odometer < Number(t.odometer)) {
      if (!confirm(esc(t.target_label) + "'s reading (" + odometer.toLocaleString() +
          " km) is lower than the last one recorded (" + Number(t.odometer).toLocaleString() +
          " km). Record it anyway?")) return;
    }

    var btn = document.querySelector('[data-check="' + ti + '"]');
    btn.disabled = true;
    btn.textContent = "Checking…";

    fetch(FN + "?action=submit", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        person_id: signedInAs.id, signed_in_id: signedInAs.id,
        location_id: camp ? camp.id : null, schedule_id: scheduleId,
        target_type: t.target_type, target_id: t.target_id, template_id: t.template_id,
        results: results, odometer: odometer, hours: hours,
      }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) {
        btn.disabled = false;
        btn.textContent = "✓ " + t.target_label + " checked";
        alert(out.error);
        return;
      }
      var withPhotos = results.filter(function (x) { return x.failed && x.photoFile; });
      function finishTarget() {
        var section = document.getElementById("target-" + ti);
        var doneCard = document.createElement("div");
        doneCard.className = "target-done";
        doneCard.id = "doneCard-" + ti;
        doneCard.innerHTML = "✓ <b>" + esc(t.target_label) + "</b><span class=\"who\">checked by " + esc(signedInAs.name) + ", just now</span>";
        section.replaceWith(doneCard);
        t.done = true;
        data.done_count++;
        document.getElementById("progressCount").textContent = data.done_count + " of " + data.target_count;
        updateCloseOut(data);
      }
      if (!withPhotos.length) { finishTarget(); return; }
      var remaining = withPhotos.length;
      withPhotos.forEach(function (x) {
        var issueId = (out.issue_ids || {})[x.item_id];
        if (!issueId) { if (--remaining === 0) finishTarget(); return; }
        compressImage(x.photoFile).then(function (dataUrl) {
          return fetch(FN + "?action=attach", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ issue_id: issueId, added_by: signedInAs.id, image_data_url: dataUrl }),
          });
        }).then(function () {}).catch(function () {})
          .then(function () { if (--remaining === 0) finishTarget(); });
      });
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = "✓ " + t.target_label + " checked";
      alert("Couldn't record it — a fault in the page, not your phone. Nothing was lost; try again. (" + e.message + ")");
    });
  }

  function updateCloseOut(data) {
    var box = document.getElementById("closeOutBox");
    box.hidden = data.done_count < data.target_count;
  }

  document.getElementById("confirmRunBtn").onclick = function () {
    var btn = document.getElementById("confirmRunBtn");
    btn.disabled = true;
    btn.textContent = "Closing out…";
    fetch(FN + "?action=complete_schedule_run", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ schedule_id: scheduleId, person_id: signedInAs.id }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) {
        btn.disabled = false;
        btn.textContent = "Confirm — close out this schedule";
        alert(out.error);
        return;
      }
      var byPerson = {};
      (out.summary || []).forEach(function (s) {
        var who = s.done_by || "Unknown";
        byPerson[who] = (byPerson[who] || 0) + 1;
      });
      var whoLines = Object.keys(byPerson).map(function (name) {
        return name + " (" + byPerson[name] + ")";
      }).join(", ");
      document.getElementById("doneBox").innerHTML =
        "<p>" + esc(document.getElementById("scheduleTitle").textContent) + ", " + esc(campName()) + ".</p>" +
        "<p>" + out.targets_completed + " target" + (out.targets_completed === 1 ? "" : "s") + " checked — " + esc(whoLines) + ".</p>" +
        (out.next_due_date ? "<p>Next due " + new Date(out.next_due_date).toLocaleDateString() + ".</p>" : "");
      show("done");
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = "Confirm — close out this schedule";
      alert("Couldn't close this out — a fault in the page, not your phone. (" + e.message + ")");
    });
  };
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
