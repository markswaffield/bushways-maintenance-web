<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Consolidated Checklist</title>
<!--
  The mechanism Mark's whole "select targets to build a schedule"
  conversation was building toward (D-064/D-065/D-066), 2026-09-18:
  "we create a schedule - select all the targets that should be
  included. Then the tool collates all the checklists associated with
  those targets and generates a consolidated checklist for that
  schedule."

  A separate page from checklist.html on purpose, not a mode bolted
  onto it — the per-item rendering (D-060's read-only reopened faults,
  the fault picker, "a different problem with this too", photos) is
  copied from there deliberately, not shared by import, so nothing
  about the single-target screen that's already live and tested had to
  change to build this. Every id/data attribute below is namespaced by
  target index ("t0_", "t1_"...) since several targets' items render on
  one page at once.

  Underneath, this still submits one real Inspection per target
  (submit_consolidated loops submit() once per entry) — D-064's own
  decision, carried all the way through: every existing piece (D-034's
  Area→Target grouping, D-060's live faults, a transfer taking a
  target's own faults with it) keeps working completely unmodified,
  because as far as any of that is concerned nothing about how an
  individual target's checklist works is any different today.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 8px;color:#43594A;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #43594A;padding-bottom:4px}
  h3{font-size:13px;margin:16px 0 6px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 20px}
  label{display:block;font-size:13px;color:#5B5344;margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff;margin-top:22px}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  .item{border-bottom:1px solid #E3DFD3;padding:12px 0}
  .item label.main{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:#232019;margin:0;cursor:pointer}
  .item input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:1px}
  .details{display:none;margin:10px 0 0 30px;padding:10px;background:#EFECE3;border-radius:6px}
  .item.open .details{display:block}
  .reopen-banner{background:#F4CFC2;color:#A8502F;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:6px;margin:0 0 8px}
  .note{color:#8C6A2F;font-size:12px;margin-top:2px}
  .review-card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:10px}
  .review-line{font-size:14px;margin:0 0 6px}
  .review-line .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F}
  .btnrow{display:flex;gap:10px;margin-top:22px}
  .btnrow button{margin-top:0}
  .confirm{background:#EFECE3;border-radius:8px;padding:16px;margin-top:16px}
  .loading{color:#6B6455;font-size:14px}
  [hidden]{display:none!important}
</style></head><body>

<div id="loading"><h1>Loading…</h1></div>

<div id="checklist" hidden>
  <h1 id="scheduleTitle"></h1>
  <p class="sub" id="scheduleSub"></p>
  <div id="targetsBox"></div>
  <button id="submitBtn">Submit checklist</button>
  <button class="secondary" onclick="location.href='./schedule.html'">← Back to Schedule</button>
</div>

<div id="review" hidden></div>

<div id="done" hidden>
  <h1>Recorded</h1>
  <div class="confirm" id="doneBox"></div>
  <button class="secondary" onclick="location.href='./schedule.html'">← Back to Schedule</button>
</div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";

  var signedInAs = null;
  try { var savedSignIn = sessionStorage.getItem("bw_signin"); if (savedSignIn) signedInAs = JSON.parse(savedSignIn); } catch (e) {}
  if (!signedInAs) { location.href = "./"; }
  var camp = null;
  try { var savedCamp = sessionStorage.getItem("bw_camp"); if (savedCamp) camp = JSON.parse(savedCamp); } catch (e) {}
  function campName() {
    if (camp) return camp.name;
    if (signedInAs && signedInAs.locations && signedInAs.locations[0]) return signedInAs.locations[0].name;
    return "Chobe Elephant Camp";
  }
  function campParam() {
    return signedInAs ? ("&person_id=" + encodeURIComponent(signedInAs.id) + (camp && camp.id ? "&location_id=" + encodeURIComponent(camp.id) : "")) : "";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function show(id) {
    ["loading", "checklist", "review", "done"].forEach(function (x) {
      document.getElementById(x).hidden = x !== id;
    });
  }
  function shortLabel(text) {
    return String(text).split("\n")[0].split(/\s+[—-]\s+/)[0].trim();
  }
  // Shared with checklist.html's own copy — resized client-side before
  // it ever leaves the phone, Maun's bandwidth being the reason.
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  // "3 days ago" — same as checklist.html's own copy, for the reopened-
  // fault banner below.
  function timeAgo(iso) {
    var days = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
    if (days === 0) return "today";
    if (days === 1) return "1 day ago";
    if (days < 14) return days + " days ago";
    var weeks = Math.floor(days / 7);
    if (weeks < 8) return weeks + " week" + (weeks === 1 ? "" : "s") + " ago";
    var months = Math.floor(days / 30);
    return months + " month" + (months === 1 ? "" : "s") + " ago";
  }

  var params = new URLSearchParams(location.search);
  var scheduleId = params.get("schedule");
  if (!scheduleId) {
    document.getElementById("loading").innerHTML = "<h1>No schedule given</h1><p>This page opens from a schedule's own \"Open checklist\" button.</p>";
  } else {
    fetch(FN + "?action=consolidated_checklist&schedule=" + encodeURIComponent(scheduleId) + campParam())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById("loading").innerHTML = "<h1>Couldn't load this checklist</h1><p>" + esc(data.error) + "</p>";
          return;
        }
        renderConsolidated(data);
      })
      .catch(function (e) {
        document.getElementById("loading").innerHTML = "<h1>Couldn't load this checklist</h1><p>A fault in the page, not your phone. (" + esc(e.message) + ")</p>";
      });
  }

  function renderConsolidated(data) {
    show("checklist");
    document.getElementById("scheduleTitle").textContent = data.schedule_name;
    document.getElementById("scheduleSub").textContent =
      campName() + " — " + data.targets.length + " target" + (data.targets.length === 1 ? "" : "s") +
      " combined into one checklist. Leave an item alone if it's fine.";

    // Per-target state, parallel arrays indexed the same way as
    // data.targets — itemFaultsById and forceNewItemIds both need their
    // own namespace per target, since two different targets' templates
    // can each have their own item using the same short id space is
    // never true in practice (real uuids), but keeping every id/data
    // attribute prefixed "t<i>_" keeps this page honest regardless.
    var itemFaultsById = {};
    var forceNewItemIds = {};

    function faultPickerHtml(ti, item) {
      var key = ti + ":" + item.id;
      itemFaultsById[key] = item.faults;
      if (!item.faults.length) return "";
      var grouped = item.faults.some(function (f) { return f.component_id; });
      if (!grouped) {
        return '<label>What\'s wrong?</label><select data-fault="' + key + '"><option value="">Choose one</option>' +
          item.faults.map(function (f) {
            return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
          }).join("") + '</select>';
      }
      var components = [], seen = {};
      item.faults.forEach(function (f) {
        var ckey = f.component_id || "__other__";
        if (!seen[ckey]) { seen[ckey] = true; components.push({ key: ckey, name: f.component_name || "Other" }); }
      });
      return '<label>Which part?</label><select data-component="' + key + '" onchange="onComponentChange(' + ti + ',\'' + item.id + '\')"><option value="">Choose one</option>' +
        components.map(function (comp) { return '<option value="' + comp.key + '">' + esc(comp.name) + '</option>'; }).join("") +
        '</select>' +
        '<label>What\'s wrong?</label><select data-fault="' + key + '" disabled><option value="">Choose the part first</option></select>';
    }

    window.onComponentChange = function (ti, itemId) {
      var key = ti + ":" + itemId;
      var compSel = document.querySelector('[data-component="' + key + '"]');
      var faultSel = document.querySelector('[data-fault="' + key + '"]');
      var compVal = compSel.value;
      if (!compVal) {
        faultSel.innerHTML = '<option value="">Choose the part first</option>';
        faultSel.disabled = true;
        return;
      }
      var faults = itemFaultsById[key].filter(function (f) { return (f.component_id || "__other__") === compVal; });
      faultSel.innerHTML = '<option value="">Choose one</option>' + faults.map(function (f) {
        return '<option value="' + f.id + '">' + esc(f.name) + (f.suggestion ? " — suggested: " + esc(f.suggestion) : "") + '</option>';
      }).join("");
      faultSel.disabled = false;
    };

    var html = "";
    data.targets.forEach(function (t, ti) {
      html += "<h2>" + esc(t.target_label) + "</h2>";
      // A vehicle's odometer, or a metered asset's hours (D-068, once
      // rooms and vehicles became addable to the basket) — the exact
      // same block inspection.html shows for a single-target check,
      // just once per target here instead of once for the whole page.
      if (t.target_type === "vehicle") {
        html += '<div class="odo"><label>Odometer reading (km) — ' + esc(t.target_label) + '</label>' +
          '<input type="number" inputmode="numeric" data-odometer="' + ti + '" min="0" step="1" placeholder="e.g. 184320">' +
          '<p class="note">' + (t.odometer != null
            ? "Last recorded: " + Number(t.odometer).toLocaleString() + " km."
            : "No reading recorded for this vehicle yet.") + '</p></div>';
      } else if (t.meter_asset_id) {
        html += '<div class="odo"><label>Hours reading — ' + esc(t.target_label) + '</label>' +
          '<input type="number" inputmode="numeric" data-hours="' + ti + '" min="0" step="0.1" placeholder="e.g. 1240.5">' +
          '<p class="note">' + (t.meter_last_reading != null
            ? "Last recorded: " + Number(t.meter_last_reading).toLocaleString() + " hours."
            : "No reading recorded yet.") + '</p></div>';
      }
      t.sections.forEach(function (s) {
        // A D-064 target has exactly one section, named after the
        // target itself — showing it again here would just repeat the
        // h2 above in different capitalisation. A target with several
        // real sections (none exist yet, but nothing rules it out)
        // still gets its own sub-heading.
        if (s.name !== t.target_label) html += "<h3>" + esc(s.name) + "</h3>";
        s.items.forEach(function (item) {
          var key = ti + ":" + item.id;
          if (item.kind === "reading") {
            html += '<div class="item"><label class="main">' + esc(item.text) + '</label>' +
              '<input type="text" inputmode="numeric" data-value="' + key + '" placeholder="Reading"></div>';
            return;
          }
          // Still open from an earlier visit (D-060) — same read-only
          // treatment checklist.html already gives this, unmodified.
          var openIssues = item.open_issues || [];
          if (openIssues.length === 1) {
            var oi = openIssues[0];
            var oiFault = (item.faults || []).find(function (f) { return f.id === oi.fault_type_id; });
            forceNewItemIds[key] = true;
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" checked disabled> ' + esc(item.text) + '</label>' +
              '<p class="reopen-banner">⚠ Already reported' + (oiFault ? " — <b>" + esc(oiFault.name) + "</b>" : "") +
              ', not yet fixed — ' + esc(timeAgo(oi.created_at)) + '. Update or resolve it from Fix a Fault.</p>' +
              '<label class="main" style="margin-top:8px"><input type="checkbox" data-failed="' + key + '"> A different problem with this too</label>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          } else if (openIssues.length > 1) {
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" data-failed="' + key + '"> ' + esc(item.text) + '</label>' +
              '<p class="reopen-banner">⚠ ' + openIssues.length + ' faults already reported here, not yet fixed — resolve them from Fix a Fault.</p>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          } else {
            html += '<div class="item" data-item="' + key + '">' +
              '<label class="main"><input type="checkbox" data-failed="' + key + '"> ' + esc(item.text) + '</label>' +
              '<div class="details">' + faultPickerHtml(ti, item) +
              '<label>Action / notes</label><textarea data-action="' + key + '" rows="2" placeholder="What needs doing"></textarea>' +
              '<label>Photo (optional)</label><input type="file" accept="image/*" capture="environment" data-photo="' + key + '">' +
              '</div></div>';
          }
        });
      });
    });
    document.getElementById("targetsBox").innerHTML = html;

    document.querySelectorAll("[data-failed]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        cb.closest(".item").classList.toggle("open", cb.checked);
      });
    });

    document.getElementById("submitBtn").onclick = function () {
      // One results array per target, in the same order as data.targets
      // — submit_consolidated() loops these into one real Inspection
      // each, exactly the shape a single-target submit() already takes.
      var perTarget = data.targets.map(function () { return []; });
      data.targets.forEach(function (t, ti) {
        t.sections.forEach(function (s) {
          s.items.forEach(function (item) {
            var key = ti + ":" + item.id;
            if (item.kind === "reading") {
              var v = document.querySelector('[data-value="' + key + '"]');
              if (v && v.value) perTarget[ti].push({ item_id: item.id, value: Number(v.value), label: shortLabel(item.text) });
              return;
            }
            var failedEl = document.querySelector('[data-failed="' + key + '"]');
            var failed = failedEl && failedEl.checked;
            if (!failed) return;
            var faultEl = document.querySelector('[data-fault="' + key + '"]');
            var faultLabel = faultEl && faultEl.value ? faultEl.options[faultEl.selectedIndex].text.split(" — ")[0] : null;
            var photoInput = document.querySelector('[data-photo="' + key + '"]');
            perTarget[ti].push({
              item_id: item.id, failed: true,
              fault_type_id: faultEl ? faultEl.value : null,
              action_if_failed: document.querySelector('[data-action="' + key + '"]').value,
              label: shortLabel(item.text), fault_type_label: faultLabel,
              photoFile: photoInput && photoInput.files[0] ? photoInput.files[0] : null,
              force_new: !!forceNewItemIds[key],
            });
          });
        });
      });
      // One odometer/hours reading per target, alongside its own
      // results (D-068) — undefined for anything that isn't a vehicle
      // or a metered asset, which submit() already treats as "nothing
      // to record" the same way a single-target check does.
      var perTargetReading = data.targets.map(function (t, ti) {
        var odoInput = document.querySelector('[data-odometer="' + ti + '"]');
        var hoursInput = document.querySelector('[data-hours="' + ti + '"]');
        var odometer = odoInput && odoInput.value !== "" ? Number(odoInput.value) : null;
        var hours = hoursInput && hoursInput.value !== "" ? Number(hoursInput.value) : null;
        if (odometer !== null && t.odometer != null && odometer < Number(t.odometer)) {
          if (!confirm(esc(t.target_label) + "'s reading (" + odometer.toLocaleString() +
              " km) is lower than the last one recorded (" + Number(t.odometer).toLocaleString() +
              " km). Record it anyway?")) return null;
        }
        return { odometer: odometer, hours: hours };
      });
      if (perTargetReading.indexOf(null) !== -1) return; // a lower-reading confirm was declined
      showReview(data, perTarget, perTargetReading);
    };
  }

  // Nothing is written yet at this point, same discipline as the
  // single-target screen (Mark, 2026-09-08: "once submitted we need an
  // edit or confirm button").
  function showReview(data, perTarget, perTargetReading) {
    show("review");
    var r = document.getElementById("review");
    var html = '<h1>Confirm checklist</h1>' +
      '<p class="sub">' + esc(data.schedule_name) + ', ' + esc(campName()) + ' — check this is right before it\'s recorded</p>';

    var anyFlagged = false;
    data.targets.forEach(function (t, ti) {
      var flagged = perTarget[ti].filter(function (x) { return x.failed; });
      var readings = perTarget[ti].filter(function (x) { return x.value !== undefined; });
      var reading = perTargetReading[ti];
      var hasReading = reading && (reading.odometer !== null || reading.hours !== null);
      if (!flagged.length && !readings.length && !hasReading) return;
      anyFlagged = true;
      html += '<div class="review-card"><p class="review-line" style="font-weight:700">' + esc(t.target_label) + '</p>';
      if (reading && reading.odometer !== null) {
        html += '<p class="review-line">Odometer: <b>' + reading.odometer.toLocaleString() + ' km</b></p>';
      }
      if (reading && reading.hours !== null) {
        html += '<p class="review-line">Hours: <b>' + reading.hours.toLocaleString() + '</b></p>';
      }
      flagged.forEach(function (x) {
        html += '<p class="review-line">' + esc(x.label) +
          (x.fault_type_label ? ' — <span class="fault">' + esc(x.fault_type_label) + '</span>' : '') +
          (x.action_if_failed ? ' — ' + esc(x.action_if_failed) : '') +
          (x.photoFile ? ' 📷' : '') + '</p>';
      });
      readings.forEach(function (x) {
        html += '<p class="review-line">' + esc(x.label) + ': ' + esc(x.value) + '</p>';
      });
      html += '</div>';
    });
    if (!anyFlagged) {
      html += '<div class="review-card"><p class="review-line">Nothing flagged on any target — every item recorded as fine.</p></div>';
    }

    html += '<div class="btnrow">' +
      '<button class="secondary" id="editBtn">← Edit</button>' +
      '<button id="confirmBtn">Confirm — submit checklist</button>' +
      '</div>';
    r.innerHTML = html;

    document.getElementById("editBtn").onclick = function () { show("checklist"); };
    document.getElementById("confirmBtn").onclick = function () {
      var btn = document.getElementById("confirmBtn");
      btn.disabled = true;
      btn.textContent = "Submitting…";
      fetch(FN + "?action=submit_consolidated", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          schedule_id: scheduleId,
          person_id: signedInAs.id, signed_in_id: signedInAs.id,
          location_id: camp ? camp.id : null,
          entries: data.targets.map(function (t, ti) {
            var reading = perTargetReading[ti] || {};
            return {
              target_type: t.target_type, target_id: t.target_id, template_id: t.template_id, results: perTarget[ti],
              odometer: reading.odometer, hours: reading.hours,
            };
          }),
        }),
      }).then(function (resp) { return resp.json(); }).then(function (out) {
        if (out.error) {
          btn.disabled = false;
          btn.textContent = "Confirm — submit checklist";
          alert(out.error);
          return;
        }
        // Photos, per target — out.results carries each target's own
        // issue_ids (item_id -> the real issue, created moments ago),
        // the same shape a single-target submit() already returns,
        // just one map per target instead of one map total.
        var issueIdsByTarget = {};
        (out.results || []).forEach(function (r) { issueIdsByTarget[r.target_id] = r.issue_ids || {}; });
        var withPhotos = [];
        data.targets.forEach(function (t, ti) {
          perTarget[ti].forEach(function (x) {
            if (x.failed && x.photoFile) {
              var issueId = (issueIdsByTarget[t.target_id] || {})[x.item_id];
              if (issueId) withPhotos.push({ issue_id: issueId, photoFile: x.photoFile });
            }
          });
        });
        var uploaded = 0, failed = 0;
        function finish() {
          document.getElementById("doneBox").innerHTML =
            "<p>" + esc(data.schedule_name) + ", " + esc(campName()) + ".</p>" +
            "<p>" + out.targets_completed + " target" + (out.targets_completed === 1 ? "" : "s") + " checked.</p>" +
            (out.issues_raised ? "<p>" + out.issues_raised + " new issue" + (out.issues_raised === 1 ? "" : "s") + " raised — tracked, open, waiting to be fixed.</p>" : "") +
            (out.issues_confirmed ? "<p>" + out.issues_confirmed + " still open from before — confirmed, not duplicated.</p>" : "") +
            (out.next_due_date ? "<p>Next due " + new Date(out.next_due_date).toLocaleDateString() + ".</p>" : "") +
            (uploaded ? "<p>" + uploaded + " photo" + (uploaded === 1 ? "" : "s") + " attached.</p>" : "") +
            (failed ? "<p class='note'>" + failed + " photo" + (failed === 1 ? "" : "s") + " didn't upload — the checklist itself is still safely recorded.</p>" : "");
          show("done");
        }
        if (!withPhotos.length) { finish(); return; }
        var remaining = withPhotos.length;
        withPhotos.forEach(function (x) {
          compressImage(x.photoFile).then(function (dataUrl) {
            return fetch(FN + "?action=attach", {
              method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ issue_id: x.issue_id, added_by: signedInAs.id, image_data_url: dataUrl }),
            });
          }).then(function (r2) { return r2.json(); }).then(function (a) {
            if (a.error) failed++; else uploaded++;
          }).catch(function () { failed++; })
            .then(function () { if (--remaining === 0) finish(); });
        });
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Confirm — submit checklist";
        alert("Couldn't submit — a fault in the page, not your phone. Nothing was lost; try again. (" + e.message + ")");
      });
    };
  }
</script>
