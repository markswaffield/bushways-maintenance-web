<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Chobe Elephant Camp — To-Do</title>
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 4px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline}
  h2 .count{font-size:12px;font-weight:400;color:#8C6A2F}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  /* Real tap targets, not plain inline text — Mark, 2026-09-16:
     "Schedule Inspection etc are very small for fingers to hit on a
     phone," applied identically on every page (schedule.html first). */
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  @media (max-width:700px){
    .nav{font-size:13px;gap:6px}
    .nav a,.nav b{padding:6px 10px}
  }
  .order-note{font-size:12.5px;color:#6B6455;margin:14px 0 0;font-style:italic}
  /* Side by side on a laptop, stacked on a phone — the same fix
     schedule.html's Order/Who/Kind got, Mark: "you need to apply the
     same to all of the pages." */
  .filters{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  @media (min-width:700px){
    .filters{flex-direction:row}
    .filter-section{flex:1;margin-top:0}
  }
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:12px;background:#fff}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 10px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  .filter-section label:first-of-type{margin-top:0}
  .filter-section select,.filter-section input[type=date]{width:100%;padding:9px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box}
  .filter-section .daterange{display:flex;gap:8px;align-items:center;margin-top:8px}
  .filter-section .daterange span{font-size:12.5px;color:#6B6455;flex:none}
  .area-group{margin-top:22px}
  .area-group .area-heading{font-size:14px;font-weight:700;color:#43594A;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid #43594A}
  .target-group{margin-top:14px}
  .target-group .target-heading{font-size:13.5px;font-weight:700;color:#5B5344;margin:0 0 6px}
  .card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:10px 14px;margin-top:6px}
  .card .fault-line{font-size:13.5px;margin:0}
  .card .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F}
  .card .meta{font-size:12px;color:#6B6455;margin:4px 0 0}
  /* Assigning and the note management adds before assigning moved here
     from Fix a Fault, 2026-09-18 (D-072) — Mark: "all managers can add
     a note and assign as was the case in for Fix A Fault." Same
     control shapes, unchanged, just living here now. */
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{padding:10px 16px;font-size:14px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  button.small{padding:7px 12px;font-size:13px}
  .notes{margin-top:8px}
  .note-line{background:#EFECE3;border-radius:6px;padding:6px 10px;font-size:13px;margin-top:4px}
  .note-line .note-who{font-weight:600;color:#5B5344}
  .note-add{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
  .note-add textarea{flex:1;font-size:14px}
  .assign-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .assign-row select{flex:1}
  .assigned-label{font-size:12.5px;color:#43594A;font-weight:600;margin-top:6px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
  .badge.overdue{background:#F4CFC2;color:#A8502F}
  .badge.due_soon{background:#F4E3D3;color:#8C6A2F}
  .badge.upcoming{background:#E3DFD3;color:#5B5344}
  .sched-row{display:flex;justify-content:space-between;align-items:center}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  .loading{color:#6B6455;font-size:14px;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<h1>To-Do — <span id="campTitle">Chobe Elephant Camp</span></h1>
<p class="sub">Every open fault, grouped by area and asset. Anything <em>due</em> lives on the Schedule.</p>
<script src="./nav.js"></script>
<div id="navRow"></div>
<script>
  (function () {
    var m = null;
    try { var s = sessionStorage.getItem("bw_signin"); if (s) m = JSON.parse(s); } catch (e) {}
    document.getElementById("navRow").innerHTML = navHtml(m, "To-do list");
  })();
</script>

<div id="app"><p class="loading">Loading…</p></div>

<script>
  // This page has never needed its own sign-in ("No sign-in needed,
  // same as the dashboard — this is a read-only record"), but it can
  // still honour a camp already entered elsewhere this session — Mark,
  // 2026-09-18: "not having to select a lodge each time you want to
  // access one of the tasks." Reads whatever Schedule/Fix a
  // Fault/etc. already set (sessionStorage is shared across pages of
  // this site); an ordinary single-camp visit carries neither and
  // this stays exactly Chobe, as it always has.
  var me = null;
  try { var savedMe = sessionStorage.getItem("bw_signin"); if (savedMe) me = JSON.parse(savedMe); } catch (e) {}
  var camp = null;
  try { var savedCamp = sessionStorage.getItem("bw_camp"); if (savedCamp) camp = JSON.parse(savedCamp); } catch (e) {}
  // person_id every time someone's signed in, not only once a camp is
  // also set — 2026-09-18, a real bug: sending it only when `camp` was
  // set meant an ordinary single-camp person's identity never reached
  // the server, so their fetch fell back to Chobe regardless of where
  // they actually work. location_id stays conditional on camp.
  var CAMP_PARAM = me ? ("&person_id=" + encodeURIComponent(me.id) + (camp && camp.id ? "&location_id=" + encodeURIComponent(camp.id) : "")) : "";
  // The title always names the real camp — a single-camp person's own
  // home (me.locations[0]) used to be silently ignored here, same bug
  // as the person_id one above (docs/decisions.md D-055's follow-up).
  var shownCamp = camp || (me && me.locations && me.locations[0]);
  if (shownCamp) document.getElementById("campTitle").textContent = shownCamp.name;
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist?action=dashboard" + CAMP_PARAM;
  var API = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var lastData = null;
  var departments = []; // set once data first loads — doAddNote/doAssign's own assign-row needs it too
  // Rebuilt 2026-09-09, per Mark's own sketch: "Default Order" groups
  // by maintenance Area first (Guest Room, Main Area, Workshop...),
  // then by Target within it (Room 1's faults all together, then
  // Room 2's, and so on) — date only orders the individual faults
  // *within* one target, newest to oldest. Area and Target are always
  // alphabetical (then numeric for Target); they are the grouping
  // itself, not something a filter switches away from. tool-local
  // D-034's second follow-up — the first version of this default order
  // had date as the outer key, area/target only breaking an exact
  // tie; Mark's sketch made clear that's backwards.
  var dateDirection = "newest"; // newest | oldest
  var dateFrom = "", dateTo = "";
  var filterAreaId = "";
  var filterTarget = "";
  var filterDepartmentId = "";
  // The scheduled section has its own ordering, separate from the faults
  // above — per Mark, 2026-09-11, and defaulting to newest first at his
  // request. Note what that means for a schedule: "newest" is the
  // furthest-away due date, so upcoming work sorts above overdue work.
  

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  }
  function dueText(s) {
    if (s.days_until < 0) return "overdue by " + Math.abs(s.days_until) + " day" + (Math.abs(s.days_until) === 1 ? "" : "s");
    if (s.days_until === 0) return "due now";
    return "due in " + s.days_until + " day" + (s.days_until === 1 ? "" : "s");
  }
  function badgeText(status) {
    return { overdue: "Overdue", due_soon: "Due soon", upcoming: "Upcoming" }[status];
  }

  function loadIssues() {
    fetch(FN).then(function (r) { return r.json(); }).then(function (data) {
      lastData = data;
      departments = data.departments || [];
      renderFilters(data);
      renderIssues(applyFilters(data));
    }).catch(function (e) {
      document.getElementById("app").innerHTML = "<p>Couldn't load the to-do list — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
    });
  }
  loadIssues();

  function topLevelAreas(areas) { return (areas || []).filter(function (a) { return !a.parent_area_id; }); }
  // Every distinct target currently open within one area — built from
  // what's actually on the board, not the full room catalogue, so
  // this never offers a target with nothing open on it.
  function targetsIn(issues, areaId) {
    var seen = {}, out = [];
    (issues || []).forEach(function (f) {
      if (f.target && f.area_id === areaId && !seen[f.target]) { seen[f.target] = true; out.push(f.target); }
    });
    return out.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
  }

  function renderFilters(data) {
    var areas = data.areas || [];
    var departments = data.departments || [];

    // The note was landing inside the same flex row as the three boxes
    // below (both built into one "html" string, then wrapped together)
    // — Mark, 2026-09-17: "it pushes the boxes to the right of the
    // screen on the computer - i would like [them] to start on the
    // left." Built separately now so it sits on its own line above
    // the row, not as an unintended fourth flex item shrunk to the
    // left of it.
    var note = '<p class="order-note">Grouped by maintenance area, then asset — each asset\'s own faults ' +
      (dateDirection === "oldest" ? "oldest first" : "newest first") + '.</p>';

    var html = '<div class="filter-section"><div class="title">Date</div>' +
      '<label>Order (within each asset)</label><select id="dateDirection" onchange="onDateDirectionChange()">' +
      '<option value="newest"' + (dateDirection === "newest" ? " selected" : "") + '>Newest to oldest (default)</option>' +
      '<option value="oldest"' + (dateDirection === "oldest" ? " selected" : "") + '>Oldest to newest</option>' +
      '</select>' +
      '<label>Custom date range (optional)</label>' +
      '<div class="daterange">' +
      '<input type="date" id="dateFrom" value="' + esc(dateFrom) + '" onchange="onDateRangeChange()">' +
      '<span>to</span>' +
      '<input type="date" id="dateTo" value="' + esc(dateTo) + '" onchange="onDateRangeChange()">' +
      '</div></div>';

    var targets = filterAreaId ? targetsIn(data.issues, filterAreaId) : [];
    html += '<div class="filter-section"><div class="title">Maintenance area</div>' +
      '<label>Area</label><select id="areaFilter" onchange="onAreaFilterChange()"><option value="">All areas</option>' +
      topLevelAreas(areas).map(function (a) {
        return '<option value="' + a.id + '"' + (filterAreaId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>';
      }).join("") + '</select>';
    if (filterAreaId && targets.length) {
      html += '<label>Asset</label><select id="targetFilter" onchange="onTargetFilterChange()">' +
        '<option value="">All assets in this area</option>' +
        targets.map(function (t) {
          return '<option value="' + esc(t) + '"' + (filterTarget === t ? " selected" : "") + '>' + esc(t) + '</option>';
        }).join("") + '</select>';
    }
    html += '</div>';

    html += '<div class="filter-section"><div class="title">Department</div>' +
      '<label>Department</label><select id="departmentFilter" onchange="onDepartmentFilterChange()">' +
      '<option value="">All departments</option>' +
      departments.map(function (d) {
        return '<option value="' + d.id + '"' + (filterDepartmentId === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
      }).join("") + '</select></div>';

    var wrapped = '<div id="filtersRow">' + note + '<div class="filters">' + html + '</div></div>';
    var existing = document.getElementById("filtersRow");
    if (existing) { existing.outerHTML = wrapped; }
    else { document.getElementById("app").insertAdjacentHTML("beforebegin", wrapped); }
  }

  window.onDateDirectionChange = function () {
    dateDirection = document.getElementById("dateDirection").value;
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onDateRangeChange = function () {
    dateFrom = document.getElementById("dateFrom").value;
    dateTo = document.getElementById("dateTo").value;
    renderIssues(applyFilters(lastData));
  };
  window.onAreaFilterChange = function () {
    filterAreaId = document.getElementById("areaFilter").value;
    filterTarget = ""; // a target from the old area no longer applies
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onTargetFilterChange = function () {
    filterTarget = document.getElementById("targetFilter").value;
    renderIssues(applyFilters(lastData));
  };
  window.onDepartmentFilterChange = function () {
    filterDepartmentId = document.getElementById("departmentFilter").value;
    renderIssues(applyFilters(lastData));
  };

  // Each filter narrows which fault rows show, or (Date's own
  // direction) adjusts the one part of the default grouping that's
  // actually a sort rather than a grouping key — never touches the
  // Area→Target grouping itself, per Mark: "when a filter is
  // selected, it must only effect that filter, the original default
  // order must remain the same for the rest."
  function applyFilters(data) {
    var issues = (data.issues || []).filter(function (f) {
      if (filterDepartmentId && f.assigned_department_id !== filterDepartmentId) return false;
      if (dateFrom && new Date(f.raised_at) < new Date(dateFrom)) return false;
      if (dateTo && new Date(f.raised_at) > new Date(dateTo + "T23:59:59")) return false;
      if (filterAreaId && f.area_id !== filterAreaId) return false;
      if (filterTarget && f.target !== filterTarget) return false;
      return true;
    });
    return { issues: issues, schedules: data.schedules || [] };
  }

  // Area (alphabetical, "Other" last for anything with no area yet) →
  // Target within it (alphabetical-then-numeric, "Other" last) → the
  // individual faults, newest/oldest per dateDirection. This is the
  // fixed default grouping itself — always applied to whatever
  // applyFilters left standing.
  // "Other" (no area, or no target, matched yet) always sorts last,
  // never alphabetically among real names — a plain string compare
  // can't be trusted to place it consistently across browsers/locales.
  function sortNamesOtherLast(names, numeric) {
    return names.slice().sort(function (a, b) {
      if (a === "Other" && b !== "Other") return 1;
      if (b === "Other" && a !== "Other") return -1;
      return numeric ? a.localeCompare(b, undefined, { numeric: true }) : a.localeCompare(b);
    });
  }

  function groupForDisplay(issues) {
    var byArea = {};
    issues.forEach(function (f) {
      var areaName = f.area || "Other";
      if (!byArea[areaName]) byArea[areaName] = {};
      var targetName = f.target || "Other";
      if (!byArea[areaName][targetName]) byArea[areaName][targetName] = [];
      byArea[areaName][targetName].push(f);
    });
    return sortNamesOtherLast(Object.keys(byArea), false).map(function (areaName) {
      var targets = byArea[areaName];
      return {
        name: areaName,
        targets: sortNamesOtherLast(Object.keys(targets), true).map(function (targetName) {
          var faults = targets[targetName].slice().sort(function (a, b) {
            return dateDirection === "oldest"
              ? new Date(a.raised_at) - new Date(b.raised_at)
              : new Date(b.raised_at) - new Date(a.raised_at);
          });
          return { name: targetName, faults: faults };
        }),
      };
    });
  }

  function renderIssues(data) {
    var html = "";
    var faultCount = data.issues.length;
    var filtered = filterAreaId || filterTarget || filterDepartmentId || dateFrom || dateTo;
    html += '<h2>Open faults <span class="count">' + faultCount + '</span></h2>';
    if (!data.issues.length) {
      html += '<p class="empty">Nothing open' + (filtered ? " for this filter" : " — every recorded fault has been resolved") + '.</p>';
    }
    groupForDisplay(data.issues).forEach(function (area) {
      html += '<div class="area-group"><p class="area-heading">' + esc(area.name) + '</p>';
      area.targets.forEach(function (target) {
        html += '<div class="target-group"><p class="target-heading">' + esc(target.name) + '</p>';
        target.faults.forEach(function (f) {
          html += '<div class="card">' +
            '<p class="fault-line">' + (f.urgent ? '<span class="fault" style="background:#F4CFC2;color:#A8502F">URGENT</span> ' : '') + esc(f.label) +
            (f.fault_type ? ' — <span class="fault">' + esc(f.fault_type) + '</span>' : '') +
            (f.action ? ' — ' + esc(f.action) : '') +
            (f.assigned_department ? ' <span class="fault" style="background:#E3DFD3;color:#5B5344">→ ' + esc(f.assigned_department) + '</span>' : '') +
            '</p>' +
            '<p class="meta">' + esc(f.raised_by) + ', ' + timeAgo(f.raised_at) + '</p>';

          // Detail management adds before assigning, and assigning
          // itself — moved here from Fix a Fault, 2026-09-18 (D-072).
          // Mark: "move the assign option away from the Fix a Fault
          // page and put it on the To-Do-List page. On the To-do-List
          // Page all managers can add a note and assign as was the
          // case in for Fix A Fault." Same controls, same shapes,
          // living at the point management actually triages from.
          if (f.notes && f.notes.length) {
            html += '<div class="notes">' + f.notes.map(function (n) {
              return '<p class="note-line"><span class="note-who">' + esc(n.by || "Unknown") + '</span> — ' + esc(n.text) + '</p>';
            }).join("") + '</div>';
          }
          if (me && me.is_manager) {
            html += '<div class="note-add"><textarea id="note-' + f.id + '" rows="1" placeholder="Add detail for whoever picks this up (optional)"></textarea>' +
              '<button class="small secondary" onclick="doAddNote(\'' + f.id + '\')">Add note</button></div>';
            html += '<div class="assign-row"><select id="assign-' + f.id + '">' +
              '<option value="">Unassigned</option>' +
              departments.map(function (d) {
                return '<option value="' + d.id + '"' + (f.assigned_department_id === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
              }).join("") +
              '</select><button class="small secondary" onclick="doAssign(\'' + f.id + '\')">Assign</button></div>';
          }

          // Straight into Fix a Fault for this one, no re-finding it
          // among filters — the same "Open checklist →" pattern the
          // Due list uses for a schedule. Mark, 2026-09-18: "the
          // option to be able to go directly from To-do-List into Fix
          // a Fault, just like the schedules allow you to go directly
          // into the Checklists."
          html += '<div class="actions"><button class="small secondary" onclick="location.href=\'./fix.html?issue=' + f.id + '\'">Open in Fix a Fault →</button></div>';

          html += '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });

    // The scheduled half of this payload is rendered by schedule.html
    // now, not here — Mark, 2026-09-12: "the schedule should be
    // seperated from the to-do list". This page is open faults only.

    document.getElementById("app").innerHTML = html;
  }

  window.doAddNote = function (id) {
    var field = document.getElementById("note-" + id);
    var text = field.value.trim();
    if (!text) return;
    fetch(API + "?action=attach", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ issue_id: id, added_by: me.id, note: text }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      loadIssues();
    }).catch(function (e) { alert("Couldn't add the note — a fault in the page. (" + e.message + ")"); });
  };

  // A real gap, Mark caught using it for real: "the note i recorded
  // did not save... this is not seen anywhere after i asigned the
  // task." Add note and Assign were two separate buttons for two
  // separate requests — typing detail, then clicking Assign, sent only
  // the assignment; whatever was still sitting in the note box never
  // reached the server at all, silently, with nothing to say it hadn't
  // (no error — there just wasn't a second click). Assign now carries
  // along whatever's currently in that fault's own note box, so the
  // natural "type detail, then assign" motion actually saves both. Add
  // note by itself is unchanged, for adding one without assigning.
  window.doAssign = function (id) {
    var departmentId = document.getElementById("assign-" + id).value;
    var noteField = document.getElementById("note-" + id);
    var noteText = noteField ? noteField.value.trim() : "";
    var saveNote = noteText
      ? fetch(API + "?action=attach", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ issue_id: id, added_by: me.id, note: noteText }),
        }).then(function (r) { return r.json(); })
      : Promise.resolve(null);
    saveNote.then(function (noteOut) {
      if (noteOut && noteOut.error) { alert(noteOut.error); return; }
      return fetch(API + "?action=assign", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ issue_id: id, assigned_department_id: departmentId, by_person_id: me.id }),
      }).then(function (r) { return r.json(); }).then(function (out) {
        if (out.error) { alert(out.error); return; }
        loadIssues();
      });
    }).catch(function (e) { alert("Couldn't assign — a fault in the page. (" + e.message + ")"); });
  };
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
