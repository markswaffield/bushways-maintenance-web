<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chobe Elephant Camp — To-Do</title>
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 4px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline}
  h2 .count{font-size:12px;font-weight:400;color:#8C6A2F}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  .nav{font-size:13px;margin:10px 0 0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .filters select{flex:1;min-width:120px;padding:9px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit}
  .card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:10px}
  .card .item{font-size:14.5px;font-weight:700;margin:0 0 2px}
  .card .area-line{font-size:11.5px;color:#8C6A2F;margin:0 0 6px}
  .card .meta{font-size:12.5px;color:#6B6455;margin:6px 0 0}
  .card .fault-line{font-size:13.5px;margin:0 0 4px;padding-left:2px}
  .card .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F}
  .card .action{font-size:12.5px;color:#43594A;margin-top:4px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
  .badge.overdue{background:#F4CFC2;color:#A8502F}
  .badge.due_soon{background:#F4E3D3;color:#8C6A2F}
  .badge.upcoming{background:#E3DFD3;color:#5B5344}
  .sched-row{display:flex;justify-content:space-between;align-items:center}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  .loading{color:#6B6455;font-size:14px;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<h1>To-Do — Chobe Elephant Camp</h1>
<p class="sub">Open faults and scheduled maintenance, live from the database.</p>
<p class="nav"><a href="./">← Inspect or report a fault</a> · <a href="./fix.html">Fix a fault →</a> · <a href="./completed.html">Completed →</a></p>

<div id="app"><p class="loading">Loading…</p></div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist?action=dashboard";
  var lastData = null;
  // Per Mark, 2026-09-09: "we need some filtering option and ordering
  // option — order and/or filter by date, order and/or filter by
  // maintenance area, order and filter by subsector within a
  // maintenance area if this exists." All three live client-side
  // against what's already loaded, same pattern as Fix a Fault's
  // existing department filter — the list is small enough that a
  // second fetch per filter change isn't worth it.
  var filterAreaId = "", filterSubareaId = "", filterWindow = "", filterTarget = "", sortMode = "newest";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  }
  function dueText(s) {
    if (s.days_until < 0) return "overdue by " + Math.abs(s.days_until) + " day" + (Math.abs(s.days_until) === 1 ? "" : "s");
    if (s.days_until === 0) return "due now";
    return "due in " + s.days_until + " day" + (s.days_until === 1 ? "" : "s");
  }
  function badgeText(status) {
    return { overdue: "Overdue", due_soon: "Due soon", upcoming: "Upcoming" }[status];
  }
  function withinWindow(iso, win) {
    if (!win) return true;
    var days = (Date.now() - new Date(iso).getTime()) / 86400000;
    if (win === "today") return days <= 1;
    if (win === "week") return days <= 7;
    if (win === "month") return days <= 30;
    return true;
  }

  fetch(FN).then(function (r) { return r.json(); }).then(function (data) {
    lastData = data;
    renderFilters(data);
    renderIssues(applyFilters(data));
  }).catch(function (e) {
    document.getElementById("app").innerHTML = "<p>Couldn't load the to-do list — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
  });

  function topLevelAreas(areas) { return (areas || []).filter(function (a) { return !a.parent_area_id; }); }
  function subAreasOf(areas, areaId) { return (areas || []).filter(function (a) { return a.parent_area_id === areaId; }); }
  // Every distinct heading already on the board — "Room 1," "Room 2,"
  // and so on — sorted numerically (so Room 2 sorts before Room 10,
  // not after) rather than alphabetically. Built from what's actually
  // open rather than the full room catalogue, so this never lists a
  // room with nothing currently on it.
  function targetsOf(issues) {
    var seen = {}, out = [];
    (issues || []).forEach(function (g) { if (g.target && !seen[g.target]) { seen[g.target] = true; out.push(g.target); } });
    return out.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
  }

  function renderFilters(data) {
    var areas = data.areas || [];
    var targets = targetsOf(data.issues);
    var html = '<div class="filters">' +
      '<select id="targetFilter" onchange="onTargetFilterChange()"><option value="">All rooms/targets</option>' +
      targets.map(function (t) {
        return '<option value="' + esc(t) + '"' + (filterTarget === t ? " selected" : "") + '>' + esc(t) + '</option>';
      }).join("") + '</select>' +
      '<select id="areaFilter" onchange="onAreaFilterChange()"><option value="">All areas</option>' +
      topLevelAreas(areas).map(function (a) {
        return '<option value="' + a.id + '"' + (filterAreaId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>';
      }).join("") + '</select>' +
      '<select id="subareaFilter" onchange="onSubareaFilterChange()"' + (subAreasOf(areas, filterAreaId).length ? "" : " hidden") + '>' +
      '<option value="">All parts</option>' +
      subAreasOf(areas, filterAreaId).map(function (a) {
        return '<option value="' + a.id + '"' + (filterSubareaId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>';
      }).join("") + '</select>' +
      '<select id="windowFilter" onchange="onWindowFilterChange()">' +
      '<option value=""' + (!filterWindow ? " selected" : "") + '>All time</option>' +
      '<option value="today"' + (filterWindow === "today" ? " selected" : "") + '>Last 24 hours</option>' +
      '<option value="week"' + (filterWindow === "week" ? " selected" : "") + '>Last 7 days</option>' +
      '<option value="month"' + (filterWindow === "month" ? " selected" : "") + '>Last 30 days</option>' +
      '</select>' +
      '<select id="sortMode" onchange="onSortChange()">' +
      '<option value="newest"' + (sortMode === "newest" ? " selected" : "") + '>Newest first</option>' +
      '<option value="oldest"' + (sortMode === "oldest" ? " selected" : "") + '>Oldest first</option>' +
      '<option value="target"' + (sortMode === "target" ? " selected" : "") + '>By room/heading</option>' +
      '<option value="area"' + (sortMode === "area" ? " selected" : "") + '>By maintenance area</option>' +
      '</select>' +
      '</div>';
    var existing = document.getElementById("filtersRow");
    if (existing) { existing.outerHTML = '<div id="filtersRow">' + html + '</div>'; }
    else { document.getElementById("app").insertAdjacentHTML("beforebegin", '<div id="filtersRow">' + html + '</div>'); }
  }

  window.onTargetFilterChange = function () {
    filterTarget = document.getElementById("targetFilter").value;
    renderIssues(applyFilters(lastData));
  };
  window.onAreaFilterChange = function () {
    filterAreaId = document.getElementById("areaFilter").value;
    filterSubareaId = ""; // a sub-area from the old area no longer applies
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onSubareaFilterChange = function () {
    filterSubareaId = document.getElementById("subareaFilter").value;
    renderIssues(applyFilters(lastData));
  };
  window.onWindowFilterChange = function () {
    filterWindow = document.getElementById("windowFilter").value;
    renderIssues(applyFilters(lastData));
  };
  window.onSortChange = function () {
    sortMode = document.getElementById("sortMode").value;
    renderIssues(applyFilters(lastData));
  };

  function applyFilters(data) {
    var issues = (data.issues || []).filter(function (g) {
      if (filterTarget && g.target !== filterTarget) return false;
      if (filterAreaId && g.area_id !== filterAreaId) return false;
      if (filterSubareaId && g.sub_area_id !== filterSubareaId) return false;
      if (!withinWindow(g.raised_at, filterWindow)) return false;
      return true;
    });
    issues = issues.slice().sort(function (a, b) {
      if (sortMode === "oldest") return new Date(a.raised_at) - new Date(b.raised_at);
      if (sortMode === "target") {
        var at = a.target || "", bt = b.target || "";
        return at !== bt ? at.localeCompare(bt, undefined, { numeric: true }) : new Date(b.raised_at) - new Date(a.raised_at);
      }
      if (sortMode === "area") {
        var an = a.area || "", bn = b.area || "";
        return an !== bn ? an.localeCompare(bn) : new Date(b.raised_at) - new Date(a.raised_at);
      }
      return new Date(b.raised_at) - new Date(a.raised_at); // newest first, default
    });
    return { issues: issues, schedules: data.schedules || [] };
  }

  function renderIssues(data) {
    var html = "";
    var faultCount = data.issues.reduce(function (n, g) { return n + g.faults.length; }, 0);
    html += '<h2>Open faults <span class="count">' + faultCount + '</span></h2>';
    if (!data.issues.length) {
      html += '<p class="empty">Nothing open' + (filterTarget || filterAreaId || filterWindow ? " for this filter" : " — every recorded fault has been resolved") + '.</p>';
    }
    data.issues.forEach(function (group) {
      html += '<div class="card">' + '<p class="item">' + esc(group.target) + '</p>' +
        (group.area ? '<p class="area-line">' + esc(group.area) + (group.sub_area ? " — " + esc(group.sub_area) : "") + '</p>' : "");
      group.faults.forEach(function (f) {
        html += '<p class="fault-line">' + (f.urgent ? '<span class="fault" style="background:#F4CFC2;color:#A8502F">URGENT</span> ' : '') + esc(f.label) +
          (f.fault_type ? ' — <span class="fault">' + esc(f.fault_type) + '</span>' : '') +
          (f.action ? ' — ' + esc(f.action) : '') +
          (f.assigned_department ? ' <span class="fault" style="background:#E3DFD3;color:#5B5344">→ ' + esc(f.assigned_department) + '</span>' : '') +
          '</p>';
      });
      html += '<p class="meta">' + esc(group.raised_by) + ', ' + timeAgo(group.raised_at) + '</p>' +
        '</div>';
    });

    html += '<h2>Scheduled maintenance <span class="count">' + data.schedules.length + '</span></h2>';
    if (!data.schedules.length) {
      html += '<p class="empty">Nothing scheduled yet.</p>';
    }
    data.schedules.forEach(function (s) {
      html += '<div class="card sched-row"><div>' +
        '<p class="item">' + esc(s.name) + '</p>' +
        '<p class="meta">' + esc(s.interval) + ' — ' + dueText(s) + '</p>' +
        '</div><span class="badge ' + s.status + '">' + badgeText(s.status) + '</span></div>';
    });

    document.getElementById("app").innerHTML = html;
  }
</script>
</body></html>
