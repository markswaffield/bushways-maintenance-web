<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Bush Ways — All Camps</title>
<!--
  All Camps — the head-office roll-up, queued back on 2026-09-15 and
  finally built 2026-09-18. Per Mark: "a roll up page showing all
  outstanding schedules, to-do-lists, and open faults accross all
  camps with the option to filter by camp and date, area, department
  etc."

  Split out of base-dashboard.html the same day, 2026-09-18 — Mark:
  "i would prefer to try it my way - i feel that it is more logical
  this way. i think it avoids confusion as to what lodge you are in
  as you physically move back to a selector page that does not have
  all the standard boxes of Schedule - To-do-List etc." This page is
  purely a read: browse and filter across camps. Entering a camp to
  actually work there happens only on base-dashboard.html, the clean
  hub with nothing else on it — never from here.

  Who sees this: two real tiers, per `?action=base_rollup` server-side
  (`accessibleLocations()`) — people.is_base_manager (D-048) see every
  real location; two Concession Managers (Khwai's own, Mababe's own —
  "Khwai GM and Mababe GM and Concession Managers are the same thing")
  see exactly the 2 camps `dashboard_location_access` grants them.
  Everyone else gets a 403 and a plain explanation, same pattern as
  D-051's Assets/Staff gate — enforced server-side, not just this
  page's own hiding of it.

  Read `docs/modules/dashboard.md` for the Area→Target grouping and
  filter shape this reuses (tool-local D-034) — same rules here, with
  one addition: Camp, since this is the one screen that spans more
  than one location at a time.
-->
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 4px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline}
  h2 .count{font-size:12px;font-weight:400;color:#8C6A2F}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  @media (max-width:700px){
    .nav{font-size:13px;gap:6px}
    .nav a,.nav b{padding:6px 10px}
  }
  select,input,textarea{padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box;width:100%}
  input[type=password]{padding:8px;font-size:14px}
  button{padding:6px 11px;font-size:13px;font-family:inherit;border:1px solid #43594A;background:#fff;color:#43594A;border-radius:5px;cursor:pointer}
  button.primary{background:#43594A;color:#fff}
  .order-note{font-size:12.5px;color:#6B6455;margin:14px 0 0;font-style:italic}
  .filters{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  @media (min-width:700px){
    .filters{flex-direction:row}
    .filter-section{flex:1;margin-top:0}
  }
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:9px 10px;background:#fff;margin-top:10px}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:1px 8px;margin:0 0 7px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 3px}
  .filter-section label:first-of-type{margin-top:0}
  .filter-section select,.filter-section input[type=date]{width:100%;padding:7px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box}
  .filter-section .daterange{display:flex;gap:8px;align-items:center;margin-top:8px}
  .filter-section .daterange span{font-size:12.5px;color:#6B6455;flex:none}
  /* The sign-in bar — was the same padded card as the filter boxes
     above; too big on a phone, Mark, 2026-09-23: "that block showing
     who is signed in... is too big - especially for the phone
     screen." One compact row instead. */
  .whobar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
    border:1px solid #E3DFD3;border-radius:8px;padding:7px 12px;background:#fff;font-size:13px;margin-top:10px}
  .whobar b{color:#122D31}
  /* margin-left:auto is the real fix, not justify-content alone — once
     the name/camp text and this button group can't both fit one line,
     flex-wrap drops this group onto its own line, alone — and
     space-between has nothing left to space against there, so it fell
     back to sitting at the left. Mark, on a real phone screenshot:
     "i want all the sign out buttons moved to the right in the
     block." auto margin pushes it to the end of whatever line it's
     actually on, wrapped or not. */
  .whobar-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .whobar-btns button{width:auto;padding:6px 11px;font-size:12.5px;margin:0}
  /* Darker text on both (Mark: "make the text darker for both so it
     is easier to read") and Sign out picked out with its own colour
     ("highlighted the sign out") — :last-child rather than a new
     class, since Sign out is always the last button in this row
     wherever it appears. */
  .whobar .whobar-btns button{color:#232019}
  .whobar .whobar-btns button:last-child{background:#F4E3D3;border-color:#8C6A2F;color:#4A3620;font-weight:600}
  .area-group{margin-top:22px}
  .area-group .area-heading{font-size:14px;font-weight:700;color:#43594A;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid #43594A}
  .target-group{margin-top:14px}
  .target-group .target-heading{font-size:13.5px;font-weight:700;color:#5B5344;margin:0 0 6px}
  .card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:10px 14px;margin-top:6px}
  .card .fault-line{font-size:13.5px;margin:0}
  .card .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F}
  .card .camp{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#D9E6DC;color:#2F6B45;margin-right:6px}
  .card .meta{font-size:12px;color:#6B6455;margin:4px 0 0}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
  .badge.overdue{background:#F4CFC2;color:#A8502F}
  .badge.active{background:#D9E8DD;color:#43594A}
  .badge.upcoming{background:#F4E3D3;color:#8C6A2F}
  .sched-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  .loading{color:#6B6455;font-size:14px;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<h1>All Camps</h1>
<p class="sub">Every camp Bush Ways operates, rolled up in one place — open faults, outstanding schedules, assets and staff, filterable by camp. To go and work at a specific camp instead, use <a href="./base-dashboard.html">Base Dashboard</a>.</p>
<script src="./nav.js"></script>
<div id="navRow"></div>
<script>
  (function () {
    var m = null;
    try { var s = sessionStorage.getItem("bw_signin"); if (s) m = JSON.parse(s); } catch (e) {}
    document.getElementById("navRow").innerHTML = navHtml(m, "");
  })();
</script>

<!-- Sign-in itself now happens once, on the landing page (index.html) —
     Mark, 2026-09-18: "when i click on the app - I want to go to a blank
     sign in screen... if Base Management I go to the Dashboard with the
     2 options." This page is one of those 2 options, so it only ever
     runs for someone already signed in and already Base Management;
     arriving here with no session sends you back to the landing page. -->
<div class="whobar" id="whoSignedIn">
  <span>👤 <b id="whoName"></b></span>
  <span class="whobar-btns"><button onclick="signOut()">Sign out</button></span>
</div>

<div id="app"><p class="loading">Loading…</p></div>
<div id="assetsSection"></div>
<div id="staffSection"></div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var me = null;
  var lastData = null;
  // Same D-034 grouping and filters the to-do list uses, plus one more
  // — Camp — since this is the one screen that spans more than one
  // location at a time. Per Mark, 2026-09-18.
  var dateDirection = "newest";
  var dateFrom = "", dateTo = "";
  var filterAreaId = "", filterTarget = "";
  var filterDepartmentId = "";
  var filterLocationId = "";

  // Assets and Staff, added 2026-09-23 (D-091) — Mark: "I think that
  // when we are logged into a camp - these should only reflect the
  // camp Assets, Staff and Reporting... The option to view all the
  // assets and staff will remain within the Roll-up Page only." Moved
  // here wholesale from assets.html's own old group-wide view, with
  // the same "Camp: all camps / one camp" filter style Mark asked
  // Staff to share with Assets. Read-only here, deliberately — editing
  // stays on assets.html/staff.html, camp by camp, where the
  // Administrator gate already lives; this page is the one place to
  // just look across all of them at once.
  var assetsData = null, staffData = null;
  var filterAssetsLocationId = "", filterStaffLocationId = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  }
  function dueText(s) {
    if (s.days_until < 0) return "overdue by " + Math.abs(s.days_until) + " day" + (Math.abs(s.days_until) === 1 ? "" : "s");
    if (s.days_until === 0) return "due now";
    return "due in " + s.days_until + " day" + (s.days_until === 1 ? "" : "s");
  }
  function badgeText(status) {
    return { overdue: "Overdue", active: "Active", upcoming: "Upcoming" }[status];
  }

  window.signOut = function () {
    sessionStorage.removeItem("bw_signin");
    sessionStorage.removeItem("bw_camp");
    location.href = "./";
  };

  // Visible only to those `?action=base_rollup` actually grants —
  // enforced server-side (`accessibleLocations()`), not just this
  // page hiding it, same discipline D-051 set for Assets and Staff.
  // assets_list and staff_list called with no location_id come back
  // scoped to everything this person can view (the same server-side
  // set base_rollup itself uses) — exactly the group-wide list this
  // page now exists to show, filtered further on the client the same
  // way the fault/schedule Camp filter above already works.
  function load() {
    var app = document.getElementById("app");
    if (!me) { app.innerHTML = '<p class="empty">Sign in above to view this.</p>'; return; }
    app.innerHTML = '<p class="loading">Loading…</p>';
    Promise.all([
      fetch(FN + "?action=base_rollup&person_id=" + encodeURIComponent(me.id)).then(function (r) { return r.json(); }),
      fetch(FN + "?action=assets_list&person_id=" + encodeURIComponent(me.id)).then(function (r) { return r.json(); }),
      fetch(FN + "?action=staff_list&person_id=" + encodeURIComponent(me.id)).then(function (r) { return r.json(); }),
    ]).then(function (results) {
      var data = results[0], assets = results[1], staff = results[2];
      if (data.error) { app.innerHTML = '<p class="empty">' + esc(data.error) + '</p>'; return; }
      lastData = data;
      renderFilters(data);
      renderIssues(applyFilters(data));
      assetsData = assets.error ? null : assets;
      staffData = staff.error ? null : staff;
      renderAssets();
      renderStaff();
    }).catch(function (e) {
      app.innerHTML = "<p>Couldn't load — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
    });
  }

  function topLevelAreas(areas) { return (areas || []).filter(function (a) { return !a.parent_area_id; }); }
  function targetsIn(issues, areaId) {
    var seen = {}, out = [];
    (issues || []).forEach(function (f) {
      if (f.target && f.area_id === areaId && !seen[f.target]) { seen[f.target] = true; out.push(f.target); }
    });
    return out.sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
  }
  // Department filter built from what's actually in the data, not a
  // server-curated catalogue — different camps have genuinely
  // different valid departments (D-043), so there's no one "the
  // department list" that fits every camp at once here.
  function departmentsPresent(data) {
    var seen = {}, out = [];
    (data.issues || []).concat(data.schedules || []).forEach(function (f) {
      if (f.assigned_department_id && !seen[f.assigned_department_id]) {
        seen[f.assigned_department_id] = true;
        out.push({ id: f.assigned_department_id, name: f.assigned_department });
      }
    });
    return out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function renderFilters(data) {
    var areas = data.areas || [];
    var html = '<p class="order-note">Grouped by maintenance area, then asset — each asset\'s own faults ' +
      (dateDirection === "oldest" ? "oldest first" : "newest first") + '.</p>';

    html += '<div class="filters">';

    html += '<div class="filter-section"><div class="title">Camp</div>' +
      '<label>Site</label><select id="locationFilter" onchange="onLocationFilterChange()">' +
      '<option value="">All camps you can see</option>' +
      data.locations.map(function (l) {
        return '<option value="' + esc(l.id) + '"' + (filterLocationId === l.id ? " selected" : "") + '>' + esc(l.name) + '</option>';
      }).join("") +
      '</select>' +
      // A pure filter on this page — narrows what's shown, nothing
      // more. Entering a camp to actually work there is deliberately
      // not offered here at all, per Mark, 2026-09-18: a clean
      // "selector page that does not have all the standard boxes of
      // Schedule - To-do-List etc" is what avoids the confusion, not
      // this one doing double duty. That happens on Base Dashboard.
      (filterLocationId
        ? '<p style="margin:10px 0 0;font-size:12.5px;color:#6B6455">To go and work at ' + esc((data.locations.filter(function (l) { return l.id === filterLocationId; })[0] || {}).name || "this camp") + ', use <a href="./base-dashboard.html">Base Dashboard</a>.</p>'
        : "") +
      '</div>';

    html += '<div class="filter-section"><div class="title">Date</div>' +
      '<label>Order (within each asset)</label><select id="dateDirection" onchange="onDateDirectionChange()">' +
      '<option value="newest"' + (dateDirection === "newest" ? " selected" : "") + '>Newest to oldest (default)</option>' +
      '<option value="oldest"' + (dateDirection === "oldest" ? " selected" : "") + '>Oldest to newest</option>' +
      '</select>' +
      '<label>Custom date range (optional)</label>' +
      '<div class="daterange">' +
      '<input type="date" id="dateFrom" value="' + esc(dateFrom) + '" onchange="onDateRangeChange()">' +
      '<span>to</span>' +
      '<input type="date" id="dateTo" value="' + esc(dateTo) + '" onchange="onDateRangeChange()">' +
      '</div></div>';

    var targets = filterAreaId ? targetsIn(data.issues, filterAreaId) : [];
    html += '<div class="filter-section"><div class="title">Maintenance area</div>' +
      '<label>Area</label><select id="areaFilter" onchange="onAreaFilterChange()"><option value="">All areas</option>' +
      topLevelAreas(areas).map(function (a) {
        return '<option value="' + a.id + '"' + (filterAreaId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>';
      }).join("") + '</select>';
    if (filterAreaId && targets.length) {
      html += '<label>Asset</label><select id="targetFilter" onchange="onTargetFilterChange()">' +
        '<option value="">All assets in this area</option>' +
        targets.map(function (t) {
          return '<option value="' + esc(t) + '"' + (filterTarget === t ? " selected" : "") + '>' + esc(t) + '</option>';
        }).join("") + '</select>';
    }
    html += '</div>';

    var depts = departmentsPresent(data);
    html += '<div class="filter-section"><div class="title">Department</div>' +
      '<label>Department</label><select id="departmentFilter" onchange="onDepartmentFilterChange()">' +
      '<option value="">All departments</option>' +
      depts.map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (filterDepartmentId === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
      }).join("") + '</select></div>';

    html += '</div>'; // .filters

    var existing = document.getElementById("filtersRow");
    if (existing) { existing.outerHTML = '<div id="filtersRow">' + html + '</div>'; }
    else { document.getElementById("app").insertAdjacentHTML("beforebegin", '<div id="filtersRow">' + html + '</div>'); }
  }

  window.onLocationFilterChange = function () {
    filterLocationId = document.getElementById("locationFilter").value;
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onDateDirectionChange = function () {
    dateDirection = document.getElementById("dateDirection").value;
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onDateRangeChange = function () {
    dateFrom = document.getElementById("dateFrom").value;
    dateTo = document.getElementById("dateTo").value;
    renderIssues(applyFilters(lastData));
  };
  window.onAreaFilterChange = function () {
    filterAreaId = document.getElementById("areaFilter").value;
    filterTarget = "";
    renderFilters(lastData);
    renderIssues(applyFilters(lastData));
  };
  window.onTargetFilterChange = function () {
    filterTarget = document.getElementById("targetFilter").value;
    renderIssues(applyFilters(lastData));
  };
  window.onDepartmentFilterChange = function () {
    filterDepartmentId = document.getElementById("departmentFilter").value;
    renderIssues(applyFilters(lastData));
  };

  function applyFilters(data) {
    var issues = (data.issues || []).filter(function (f) {
      if (filterLocationId && f.location_id !== filterLocationId) return false;
      if (filterDepartmentId && f.assigned_department_id !== filterDepartmentId) return false;
      if (dateFrom && new Date(f.raised_at) < new Date(dateFrom)) return false;
      if (dateTo && new Date(f.raised_at) > new Date(dateTo + "T23:59:59")) return false;
      if (filterAreaId && f.area_id !== filterAreaId) return false;
      if (filterTarget && f.target !== filterTarget) return false;
      return true;
    });
    var schedules = (data.schedules || []).filter(function (s) {
      if (filterLocationId && s.location_id !== filterLocationId) return false;
      if (filterDepartmentId && s.assigned_department_id !== filterDepartmentId) return false;
      return true;
    });
    return { issues: issues, schedules: schedules };
  }

  function sortNamesOtherLast(names, numeric) {
    return names.slice().sort(function (a, b) {
      if (a === "Other" && b !== "Other") return 1;
      if (b === "Other" && a !== "Other") return -1;
      return numeric ? a.localeCompare(b, undefined, { numeric: true }) : a.localeCompare(b);
    });
  }

  function groupForDisplay(issues) {
    var byArea = {};
    issues.forEach(function (f) {
      var areaName = f.area || "Other";
      if (!byArea[areaName]) byArea[areaName] = {};
      var targetName = f.target || "Other";
      if (!byArea[areaName][targetName]) byArea[areaName][targetName] = [];
      byArea[areaName][targetName].push(f);
    });
    return sortNamesOtherLast(Object.keys(byArea), false).map(function (areaName) {
      var targets = byArea[areaName];
      return {
        name: areaName,
        targets: sortNamesOtherLast(Object.keys(targets), true).map(function (targetName) {
          var faults = targets[targetName].slice().sort(function (a, b) {
            return dateDirection === "oldest"
              ? new Date(a.raised_at) - new Date(b.raised_at)
              : new Date(b.raised_at) - new Date(a.raised_at);
          });
          return { name: targetName, faults: faults };
        }),
      };
    });
  }

  function renderIssues(data) {
    var html = "";
    var faultCount = data.issues.length;
    var filtered = filterLocationId || filterAreaId || filterTarget || filterDepartmentId || dateFrom || dateTo;
    html += '<h2>Open faults <span class="count">' + faultCount + '</span></h2>';
    if (!data.issues.length) {
      html += '<p class="empty">Nothing open' + (filtered ? " for this filter" : " across every camp you can see") + '.</p>';
    }
    groupForDisplay(data.issues).forEach(function (area) {
      html += '<div class="area-group"><p class="area-heading">' + esc(area.name) + '</p>';
      area.targets.forEach(function (target) {
        html += '<div class="target-group"><p class="target-heading">' + esc(target.name) + '</p>';
        target.faults.forEach(function (f) {
          html += '<div class="card">' +
            '<p class="fault-line">' + '<span class="camp">' + esc(f.location) + '</span> ' +
            (f.urgent ? '<span class="fault" style="background:#F4CFC2;color:#A8502F">URGENT</span> ' : '') + esc(f.label) +
            (f.fault_type ? ' — <span class="fault">' + esc(f.fault_type) + '</span>' : '') +
            (f.action ? ' — ' + esc(f.action) : '') +
            (f.assigned_department ? ' <span class="fault" style="background:#E3DFD3;color:#5B5344">→ ' + esc(f.assigned_department) + '</span>' : '') +
            '</p>' +
            '<p class="meta">' + esc(f.raised_by) + ', ' + timeAgo(f.raised_at) + '</p>' +
            '</div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });

    html += '<h2>Outstanding schedules <span class="count">' + data.schedules.length + '</span></h2>';
    if (!data.schedules.length) {
      html += '<p class="empty">Nothing outstanding' + (filtered ? " for this filter" : " across every camp you can see") + '.</p>';
    }
    data.schedules.forEach(function (s) {
      html += '<div class="card sched-row">' +
        '<div><p class="fault-line"><span class="camp">' + esc(s.location) + '</span> ' + esc(s.name) + '</p>' +
        '<p class="meta">' + esc(s.interval) + ' · ' + dueText(s) +
        (s.assigned_department ? ' · ' + esc(s.assigned_department) : (s.assigned_person ? ' · ' + esc(s.assigned_person) : '')) +
        '</p></div>' +
        '<span class="badge ' + s.status + '">' + badgeText(s.status) + '</span>' +
        '</div>';
    });

    document.getElementById("app").innerHTML = html;
  }

  var ASSET_KIND_GROUPS = [["vehicle", "Vehicles"], ["trailer", "Trailers"], ["asset", "Other equipment"]];

  function renderAssets() {
    var box = document.getElementById("assetsSection");
    if (!assetsData) { box.innerHTML = ""; return; }
    var locs = assetsData.viewable_locations || assetsData.locations || [];
    var html = '<h2>Assets</h2>';
    html += '<div class="filter-section"><div class="title">Camp</div>' +
      '<label>Site</label><select id="assetsLocationFilter" onchange="onAssetsLocationFilterChange()">' +
      '<option value="">All camps</option>' +
      locs.map(function (l) {
        return '<option value="' + esc(l.id) + '"' + (filterAssetsLocationId === l.id ? " selected" : "") + '>' + esc(l.name) + '</option>';
      }).join("") + '</select></div>';

    ASSET_KIND_GROUPS.forEach(function (k) {
      var kind = k[0], title = k[1];
      var all = (assetsData[kind] || []).filter(function (a) { return a.movable !== false && !a.retired; });
      if (filterAssetsLocationId) all = all.filter(function (a) { return a.location_id === filterAssetsLocationId; });
      html += '<div class="area-group"><p class="area-heading">' + esc(title) + ' <span style="font-weight:400;color:#8C6A2F">' + all.length + '</span></p>';
      if (!all.length) html += '<p class="empty">None' + (filterAssetsLocationId ? " at this camp" : "") + '.</p>';
      all.forEach(function (a) {
        html += '<div class="card"><p class="fault-line">' +
          '<span class="camp">' + esc(a.location) + '</span> ' +
          (a.area ? '<span class="fault" style="background:#EDE6D6;color:#8C6A2F">' + esc(a.area) + '</span> ' : '') +
          esc(a.name) + (a.description ? ' — ' + esc(a.description) : '') + '</p></div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }
  window.onAssetsLocationFilterChange = function () {
    filterAssetsLocationId = document.getElementById("assetsLocationFilter").value;
    renderAssets();
  };

  function renderStaff() {
    var box = document.getElementById("staffSection");
    if (!staffData) { box.innerHTML = ""; return; }
    var locs = staffData.viewable_locations || staffData.locations || [];
    var all = (staffData.people || []).filter(function (p) { return !p.retired; });
    if (filterStaffLocationId) all = all.filter(function (p) { return p.home_location_id === filterStaffLocationId; });
    all = all.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });

    var html = '<h2>Staff <span class="count">' + all.length + '</span></h2>';
    html += '<div class="filter-section"><div class="title">Camp</div>' +
      '<label>Site</label><select id="staffLocationFilter" onchange="onStaffLocationFilterChange()">' +
      '<option value="">All camps</option>' +
      locs.map(function (l) {
        return '<option value="' + esc(l.id) + '"' + (filterStaffLocationId === l.id ? " selected" : "") + '>' + esc(l.name) + '</option>';
      }).join("") + '</select></div>';

    if (!all.length) html += '<p class="empty">None' + (filterStaffLocationId ? " at this camp" : "") + '.</p>';
    all.forEach(function (p) {
      html += '<div class="card"><p class="fault-line">' +
        '<span class="camp">' + esc(p.home_location) + '</span> ' + esc(p.name) +
        (p.department ? ' — <span class="fault">' + esc(p.department) + '</span>' : '') +
        (p.is_base_manager ? ' <span class="fault" style="background:#DDE6F4;color:#2F5B8C">Base Manager</span>' : '') +
        '</p><p class="meta">' + (p.phone ? esc(p.phone) : "no number on file") + '</p></div>';
    });
    box.innerHTML = html;
  }
  window.onStaffLocationFilterChange = function () {
    filterStaffLocationId = document.getElementById("staffLocationFilter").value;
    renderStaff();
  };

  try { var saved = sessionStorage.getItem("bw_signin"); if (saved) me = JSON.parse(saved); } catch (e) {}
  if (!me) {
    location.href = "./";
  } else {
    document.getElementById("whoName").textContent = me.name;
    load();
  }
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
