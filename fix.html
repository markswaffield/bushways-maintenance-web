<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122d31">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Chobe Elephant Camp — Fix a Fault</title>
<script src="./nav.js"></script>
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:22px 0 8px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  /* Real tap targets, not plain inline text — Mark, 2026-09-16:
     "Schedule Inspection etc are very small for fingers to hit on a
     phone," applied identically on every page (schedule.html first). */
  .nav{font-size:14px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
  .nav a,.nav b{padding:6px 11px;border-radius:6px;border:1px solid #C9C2AC;background:#fff}
  .nav b{color:#43594A;border-color:#43594A;background:#EAF1EC}
  .nav a{color:#232019;text-decoration:none}
  @media (max-width:700px){
    .nav{font-size:13px;gap:6px}
    .nav a,.nav b{padding:6px 10px}
  }
  /* Side by side on a laptop, stacked on a phone — the same fix
     schedule.html's own filters got, Mark: "you need to apply the same
     to all of the pages." */
  .filters{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  @media (min-width:700px){
    .filters{flex-direction:row}
    .filter-section{flex:1;margin-top:0}
  }
  .filter-section{border:1px solid #C9C2AC;border-radius:8px;padding:12px;background:#fff}
  .filter-section .title{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#43594A;border:1px solid #43594A;border-radius:5px;display:inline-block;padding:2px 9px;margin:0 0 10px}
  .filter-section label{display:block;font-size:12px;color:#5B5344;text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
  .filter-section label:first-of-type{margin-top:0}
  .filter-section select,.filter-section input[type=date]{width:100%;padding:9px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box}
  /* The PIN field was falling back to the bare browser default here —
     the general input rule below only ever covered input[type=text],
     never password. Mark: "the area to fill in the Pin is very small
     on some of the sheets and bigger on others - please make them all
     the same bigger size," then: "use the sizing of the sign in box
     that are on the asset and staff pages" — 8px/14px is their real
     reference size, matched exactly rather than a new size invented
     here. */
  input[type=password]{width:100%;padding:8px;font-size:14px;border:1px solid #C9C2AC;border-radius:6px;background:#fff;font-family:inherit;box-sizing:border-box}
  .filter-section .daterange{display:flex;gap:8px;align-items:center;margin-top:8px}
  .filter-section .daterange span{font-size:12.5px;color:#6B6455;flex:none}
  /* The sign-in box, same look as the filter boxes above — Mark,
     2026-09-17: "for the sign in on all necessary pages i would like
     the same look as we did for the ordering filters." */
  @media (min-width:700px){ .signin-box{max-width:420px} }
  .order-note{font-size:12.5px;color:#6B6455;margin:14px 0 0;font-style:italic}
  .area-group{margin-top:22px}
  .area-group .area-heading{font-size:14px;font-weight:700;color:#43594A;margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid #43594A}
  .target-group{margin-top:14px}
  .target-group .target-heading{font-size:13.5px;font-weight:700;color:#5B5344;margin:0 0 6px}
  label{display:block;font-size:13px;color:#5B5344;margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{padding:10px 16px;font-size:14px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  button.small{padding:7px 12px;font-size:13px}
  .card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:10px}
  .card .item{font-size:14.5px;font-weight:700;margin:0 0 4px}
  .card .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F;margin-right:6px}
  .card .meta{font-size:12.5px;color:#6B6455;margin:4px 0}
  .assign-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .assign-row select{flex:1}
  .assigned-label{font-size:12.5px;color:#43594A;font-weight:600;margin-top:6px}
  .fix-form{margin-top:10px;padding-top:10px;border-top:1px solid #E3DFD3}
  .photos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .photos a img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #E3DFD3;display:block}
  .notes{margin-top:8px}
  .note-line{background:#EFECE3;border-radius:6px;padding:6px 10px;font-size:13px;margin-top:4px}
  .note-line .note-who{font-weight:600;color:#5B5344}
  .note-add{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
  .note-add textarea{flex:1;font-size:14px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  .loading{color:#6B6455;font-size:14px;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<!-- Sign-in itself now happens once, on the landing page (index.html) —
     Mark, 2026-09-18: "when i click on the app - I want to go to a blank
     sign in screen... anyone else will land on the their lodge page with
     all the task blocks available." This page only ever runs for someone
     already signed in; #start is just what shows for the moment it takes
     to check, or if it turns out nobody is (sent back to the landing
     page below). -->
<div id="start"><p class="loading">Loading…</p></div>

<div id="list" hidden></div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var people = [];
  var departments = [];
  var me = null;
  var lastIssues = [];
  // The camp this session is "in" — persisted alongside sign-in, picked
  // once on the Base Dashboard, not re-picked on every page. Mark,
  // 2026-09-18: "not having to select a lodge each time you want to
  // access one of the tasks." Only ever meaningful for someone with
  // real multi-camp access; an ordinary single-camp person's fetches
  // carry no location_id at all, and every server function already
  // defaults to Chobe when that's missing (root D-025).
  function currentCamp() {
    try {
      var saved = sessionStorage.getItem("bw_camp");
      return saved ? JSON.parse(saved) : null;
    } catch (e) { return null; }
  }
  var camp = currentCamp();
  // person_id every time someone's signed in, not only once a camp is
  // also set — 2026-09-18, a real bug: sending it only when `camp` was
  // set meant an ordinary single-camp person's identity never reached
  // the server, so open_issues fell back to Chobe regardless of where
  // they actually work. location_id stays conditional on camp.
  function campParam() {
    return me ? ("&person_id=" + encodeURIComponent(me.id) + (camp && camp.id ? "&location_id=" + encodeURIComponent(camp.id) : "")) : "";
  }
  // The same ordering rules as the to-do list, per Mark, 2026-09-12:
  // grouped by maintenance Area, then Target within it, with date only
  // ordering the faults inside one target. Area and Target are the
  // grouping itself, never something a filter switches away from
  // (tool-local D-034).
  var dateDirection = "newest";   // newest | oldest
  var dateFrom = "", dateTo = "";
  var filterAreaId = "", filterTarget = "";
  // Status and Department, 2026-09-17 — split out of the old single
  // "Show" dropdown (which mixed "unassigned" in with the department
  // list) into their own filter-section boxes, same shape as the
  // to-do list and Completed Tasks, per Mark: "i want the same layout
  // as in the to-do list and completed list when it comes to the
  // filter and picker boxes... on this page i want include another
  // filter before the date. STATUS - All, Unassigned, Assigned."
  var filterStatus = "";          // "" | "unassigned" | "assigned"
  var filterDepartmentId = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  }

  // people/departments still come from the same boot fetch as before —
  // this page's own assignment dropdowns need them — but signing in no
  // longer happens here. Arriving with no session at all sends you back
  // to the landing page, same as schedule.html and every other page
  // that used to carry its own picker.
  fetch(FN).then(function (r) { return r.json(); }).then(function (data) {
    people = data.people;
    departments = data.departments || [];
    if (!tryResume()) location.href = "./";
  }).catch(function (e) {
    document.getElementById("start").innerHTML = "<p>Couldn't load — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
  });

  function tryResume() {
    try {
      var saved = sessionStorage.getItem("bw_signin");
      if (saved) { me = JSON.parse(saved); afterSignIn(); return true; }
    } catch (e) {}
    return false;
  }

  window.signOut = function () {
    sessionStorage.removeItem("bw_signin");
    sessionStorage.removeItem("bw_camp");
    location.href = "./";
  };

  function afterSignIn() {
    // A real choice, once, right after signing in — Mark, 2026-09-18:
    // "based on the sign in - you will either get taken to the
    // Dashboard - or you will go directly to your relevant lodge."
    // Someone with more than one camp who hasn't picked one yet this
    // session goes to the Dashboard to choose.
    if (me.locations && me.locations.length > 1 && !camp) { location.href = "./base-dashboard.html"; return; }
    // Defaults the view to their own department, per Mark, 2026-09-08 —
    // "makes it easy for a department to easily see what it needs to
    // focus on." Still switchable to any department, or "All", below.
    // Management defaults to "All" instead — triaging and handing out
    // work across every department is the actual job, not one queue.
    var mine = departments.find(function (d) { return d.name === me.department; });
    filterDepartmentId = me.is_manager ? "" : (mine ? mine.id : "");
    document.getElementById("start").hidden = true;
    document.getElementById("list").hidden = false;
    loadIssues();
  }

  // Same box look as the sign-in picker it replaces, and the same look
  // the ordering filters below use — Mark, 2026-09-17: "for the sign
  // in on all necessary pages i would like the same look as we did
  // for the ordering filters."
  // The title always names the real camp being shown — not just for a
  // multi-camp person who's switched. 2026-09-18: a single-camp person's
  // own home camp (me.locations[0], now correctly theirs) used to be
  // silently left off the title entirely, same underlying bug as the
  // other pages' hardcoded "Chobe Elephant Camp" default.
  function shownCampName() {
    var c = camp || (me.locations && me.locations[0]);
    return c ? c.name : "";
  }
  function signedInBoxHtml() {
    return '<div class="filter-section signin-box"><div class="title">Signed in</div>' +
      '<p style="margin:0;font-size:13.5px">As <b>' + esc(me.name) + '</b>' + (me.is_manager ? " (management)" : "") + '</p>' +
      (camp && me.locations && me.locations.length > 1
        ? '<p style="margin:6px 0 0;font-size:13.5px">Camp: <b>' + esc(camp.name) + '</b></p>' +
          '<button class="secondary small" style="width:100%;margin-top:6px" onclick="location.href=\'./base-dashboard.html\'">Change camp</button>'
        : "") +
      '<button onclick="signOut()" style="width:100%;margin-top:10px">Sign out</button></div>';
  }

  // Coming straight here from a specific fault on the To-do list —
  // Mark, 2026-09-18: "the option to be able to go directly from
  // To-do-List into Fix a Fault, just like the schedules allow you to
  // go directly into the Checklists." Reads the fault it means from
  // lastIssues, not from whatever the page's own filters currently
  // show, so it always finds it regardless of Status/Department/Area
  // filters left over from a previous visit.
  function issueParam() { return new URLSearchParams(location.search).get("issue"); }

  function loadIssues() {
    var list = document.getElementById("list");
    list.innerHTML = '<h1>Fix a Fault' + (shownCampName() ? ' — ' + esc(shownCampName()) : "") + '</h1>' + signedInBoxHtml() + navHtml(me, "Fix a fault") + '<p class="loading">Loading…</p>';
    fetch(FN + "?action=open_issues" + campParam()).then(function (r) { return r.json(); }).then(function (data) {
      lastIssues = data.issues;
      var want = issueParam();
      if (want) { renderSingleIssue(want); return; }
      renderList(applyFilters());
    }).catch(function (e) {
      list.innerHTML += "<p>Couldn't load the list — a fault in the page. (" + e.message + ")</p>";
    });
  }

  // The one fault this page was opened for, on its own — nothing else
  // to find it among, its fix-form right there already (D-076).
  function renderSingleIssue(id) {
    var list = document.getElementById("list");
    var found = lastIssues.filter(function (i) { return i.id === id; })[0];
    var html = '<h1>Fix a Fault' + (shownCampName() ? ' — ' + esc(shownCampName()) : "") + '</h1>' + signedInBoxHtml() +
      navHtml(me, "Fix a fault") +
      // A real button, not a styled-to-look-like-text link — the
      // standing rule for any navigation action in this tool (D-057).
      // Mark, 2026-09-18, catching this one specifically: "When
      // Completing a fault - get a text that says - All Faults -
      // needs to be a Button."
      '<div class="actions"><button class="secondary" onclick="location.href=\'./fix.html\'">← All faults</button></div>';
    if (!found) {
      html += '<p class="empty">This fault is no longer open — it may already have been fixed.</p>';
    } else {
      html += issueCardHtml(found);
    }
    list.innerHTML = html;
  }

  function applyFilters() {
    return lastIssues.filter(function (i) {
      if (filterStatus === "unassigned" && i.assigned_department) return false;
      if (filterStatus === "assigned" && !i.assigned_department) return false;
      if (filterDepartmentId && !(i.assigned_department && i.assigned_department.id === filterDepartmentId)) return false;
      if (dateFrom && new Date(i.raised_at) < new Date(dateFrom)) return false;
      if (dateTo && new Date(i.raised_at) > new Date(dateTo + "T23:59:59")) return false;
      if (filterAreaId && i.area_id !== filterAreaId) return false;
      if (filterTarget && i.target !== filterTarget) return false;
      return true;
    });
  }

  // "Other" (nothing matched yet) always sorts last, never alphabetically
  // among real names — the same rule the to-do list uses.
  function sortNamesOtherLast(names, numeric) {
    return names.slice().sort(function (a, b) {
      if (a === "Other" && b !== "Other") return 1;
      if (b === "Other" && a !== "Other") return -1;
      return numeric ? a.localeCompare(b, undefined, { numeric: true }) : a.localeCompare(b);
    });
  }

  function groupForDisplay(issues) {
    var byArea = {};
    issues.forEach(function (f) {
      var a = f.area || "Other", t = f.target || "Other";
      if (!byArea[a]) byArea[a] = {};
      if (!byArea[a][t]) byArea[a][t] = [];
      byArea[a][t].push(f);
    });
    return sortNamesOtherLast(Object.keys(byArea), false).map(function (a) {
      return {
        name: a,
        targets: sortNamesOtherLast(Object.keys(byArea[a]), true).map(function (t) {
          return {
            name: t,
            faults: byArea[a][t].slice().sort(function (x, y) {
              return dateDirection === "oldest"
                ? new Date(x.raised_at) - new Date(y.raised_at)
                : new Date(y.raised_at) - new Date(x.raised_at);
            }),
          };
        }),
      };
    });
  }

  function areasPresent() {
    var seen = {}, out = [];
    lastIssues.forEach(function (i) {
      if (i.area_id && !seen[i.area_id]) { seen[i.area_id] = true; out.push({ id: i.area_id, name: i.area }); }
    });
    return out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function targetsIn(areaId) {
    var seen = {}, out = [];
    lastIssues.forEach(function (i) {
      if (i.area_id === areaId && i.target && !seen[i.target]) { seen[i.target] = true; out.push(i.target); }
    });
    return sortNamesOtherLast(out, true);
  }

  window.onFixDateDirection = function () {
    dateDirection = document.getElementById("fixDateDirection").value;
    renderList(applyFilters());
  };
  window.onFixDateRange = function () {
    dateFrom = document.getElementById("fixDateFrom").value;
    dateTo = document.getElementById("fixDateTo").value;
    renderList(applyFilters());
  };
  window.onFixArea = function () {
    filterAreaId = document.getElementById("fixArea").value;
    filterTarget = "";
    renderList(applyFilters());
  };
  window.onFixTarget = function () {
    filterTarget = document.getElementById("fixTarget").value;
    renderList(applyFilters());
  };
  window.onFixStatus = function () {
    filterStatus = document.getElementById("fixStatus").value;
    renderList(applyFilters());
  };
  window.onFixDepartment = function () {
    filterDepartmentId = document.getElementById("fixDepartment").value;
    renderList(applyFilters());
  };

  function renderList(issues) {
    var list = document.getElementById("list");
    var html = '<h1>Fix a Fault' + (shownCampName() ? ' — ' + esc(shownCampName()) : "") + '</h1>' + signedInBoxHtml() + navHtml(me, "Fix a fault");

    html += '<p class="order-note">Grouped by maintenance area, then asset — each asset\'s own faults ' +
      (dateDirection === "oldest" ? "oldest first" : "newest first") + '.</p>';

    html += '<div class="filters">';

    // Status — All / Unassigned / Assigned, per Mark, 2026-09-17: "i
    // want include another filter before the date." Separate from
    // Department below now (it used to be one combined "Show"
    // dropdown) — status and who it's assigned to are two different
    // questions.
    html += '<div class="filter-section"><div class="title">Status</div>' +
      '<label>Status</label><select id="fixStatus" onchange="onFixStatus()">' +
      '<option value=""' + (!filterStatus ? " selected" : "") + '>All</option>' +
      '<option value="unassigned"' + (filterStatus === "unassigned" ? " selected" : "") + '>Unassigned</option>' +
      '<option value="assigned"' + (filterStatus === "assigned" ? " selected" : "") + '>Assigned</option>' +
      '</select></div>';

    html += '<div class="filter-section"><div class="title">Date</div>' +
      '<label>Order (within each asset)</label><select id="fixDateDirection" onchange="onFixDateDirection()">' +
      '<option value="newest"' + (dateDirection === "newest" ? " selected" : "") + '>Newest to oldest (default)</option>' +
      '<option value="oldest"' + (dateDirection === "oldest" ? " selected" : "") + '>Oldest to newest</option>' +
      '</select>' +
      '<label>Custom date range (optional)</label>' +
      '<div class="daterange">' +
      '<input type="date" id="fixDateFrom" value="' + esc(dateFrom) + '" onchange="onFixDateRange()">' +
      '<span>to</span>' +
      '<input type="date" id="fixDateTo" value="' + esc(dateTo) + '" onchange="onFixDateRange()">' +
      '</div></div>';

    var areas = areasPresent();
    html += '<div class="filter-section"><div class="title">Maintenance area</div>' +
      '<label>Area</label><select id="fixArea" onchange="onFixArea()">' +
      '<option value="">All areas</option>' +
      areas.map(function (a) {
        return '<option value="' + esc(a.id) + '"' + (filterAreaId === a.id ? " selected" : "") + '>' + esc(a.name) + '</option>';
      }).join("") + '</select>';
    if (filterAreaId) {
      var ts = targetsIn(filterAreaId);
      html += '<label>Asset</label><select id="fixTarget" onchange="onFixTarget()">' +
        '<option value="">All in this area</option>' +
        ts.map(function (t) {
          return '<option value="' + esc(t) + '"' + (filterTarget === t ? " selected" : "") + '>' + esc(t) + '</option>';
        }).join("") + '</select>';
    }
    html += '</div>';

    // Lets a department see just its own queue — Mark, 2026-09-08.
    // Available to everyone, not only management: viewing your own
    // department's work is different from assigning someone else's.
    html += '<div class="filter-section"><div class="title">Department</div>' +
      '<label>Department</label><select id="fixDepartment" onchange="onFixDepartment()">' +
      '<option value=""' + (!filterDepartmentId ? " selected" : "") + '>All departments</option>' +
      departments.map(function (d) {
        return '<option value="' + esc(d.id) + '"' + (filterDepartmentId === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
      }).join("") + '</select></div>';

    html += '</div>'; // .filters

    html += "<h2>Open faults <span style='color:#8C6A2F;font-weight:400'>" + issues.length +
      (issues.length !== lastIssues.length ? " of " + lastIssues.length : "") + "</span></h2>";
    if (!issues.length) html += '<p class="empty">Nothing here' +
      ((filterStatus || filterDepartmentId || filterAreaId || dateFrom || dateTo) ? " for this filter" : "") + '.</p>';

    groupForDisplay(issues).forEach(function (area) {
      html += '<div class="area-group"><p class="area-heading">' + esc(area.name) + '</p>';
      area.targets.forEach(function (target) {
        html += '<div class="target-group"><p class="target-heading">' + esc(target.name) + '</p>';
        target.faults.forEach(function (i) { html += issueCardHtml(i); });
        html += '</div>';
      });            // targets within this area
      html += '</div>';
    });              // areas

    list.innerHTML = html;
  }

  // One fault's own card — shared by the grouped list above and the
  // single-fault deep-link view (renderSingleIssue). Its fix form is
  // always right there, not behind a toggle (D-076).
  //
  // Assigning and the note management adds before assigning moved to
  // the To-do list instead of living here (tool-local D-072, 2026-09-18)
  // — Mark: "move the assign option away from the Fix a Fault page and
  // put it on the To-Do-List page." What's already been assigned or
  // noted still shows, read-only, for whoever's fixing it; only the
  // controls to change either moved.
  // The fix form is always right there now, not behind a "Mark fixed"
  // toggle first — tool-local D-076, 2026-09-18. Mark: "when you land
  // on the Fault Fix page you get the option to describe what was
  // done, part used etc. You also have 2 buttons - Mark Fixed and
  // Confirm. We do not need the Mark Fixed - prefer Confirm," and,
  // landing here from the plain nav link rather than the to-do list's
  // own deep link: "do not have the option to put notes or parts.
  // Only has a Mark Fixed button - I would like to do away with this
  // and replicate what is described as above." One real reason to
  // resolve a fault, one real button — same for every card, whichever
  // way you reached it.
  function issueCardHtml(i) {
    var html = '<div class="card" id="card-' + i.id + '">' +
      '<p class="item">' + esc(i.target) + ' — ' + esc(i.label) + (i.urgent ? ' <span class="fault" style="background:#F4CFC2;color:#A8502F">URGENT</span>' : '') + '</p>' +
      (i.fault_type ? '<span class="fault">' + esc(i.fault_type) + '</span>' : '') +
      (i.note || i.suggested_action ? esc(i.note || i.suggested_action) : '') +
      '<p class="meta">raised by ' + esc(i.raised_by) + ', ' + timeAgo(i.raised_at) + '</p>';

    if (i.audio_url) {
      html += '<audio controls src="' + esc(i.audio_url) + '" style="width:100%;margin-top:8px"></audio>';
    }
    if (i.photos && i.photos.length) {
      html += '<div class="photos">' + i.photos.map(function (url) {
        return '<a href="' + esc(url) + '" target="_blank"><img src="' + esc(url) + '"></a>';
      }).join("") + '</div>';
    }

    // Detail management added before assigning — added on the To-do
    // list now, still shown here so whoever's fixing it sees it.
    if (i.notes && i.notes.length) {
      html += '<div class="notes">' + i.notes.map(function (n) {
        return '<p class="note-line"><span class="note-who">' + esc(n.by || "Unknown") + '</span> — ' + esc(n.text) + '</p>';
      }).join("") + '</div>';
    }

    if (i.assigned_department) {
      html += '<p class="assigned-label">Assigned to ' + esc(i.assigned_department.name) + '</p>';
    }

    html += '<div class="fix-form">' +
      '<label>What was done?</label><textarea id="action-' + i.id + '" rows="2" placeholder="What actually fixed it"></textarea>' +
      '<label>Part used (optional)</label><input type="text" id="part-' + i.id + '" placeholder="e.g. SN352">' +
      '<label>Photo of the fix (optional)</label><input type="file" accept="image/*" capture="environment" id="photo-' + i.id + '">' +
      '<div class="actions"><button onclick="doResolve(\'' + i.id + '\')">Confirm fixed</button></div>' +
      '</div></div>';
    return html;
  }

  // doAddNote/doAssign moved to dashboard.html (D-072) — this page no
  // longer has the controls that called them.

  // Resized client-side before it ever leaves the phone — same reasoning
  // and same numbers as the checklist page's version of this.
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.doResolve = function (id) {
    var action = document.getElementById("action-" + id).value;
    var part = document.getElementById("part-" + id).value;
    var photoFile = document.getElementById("photo-" + id).files[0];
    fetch(FN + "?action=resolve", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ issue_id: id, resolved_by: me.id, actual_action_taken: action, actual_part_used: part }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      if (!photoFile) { loadIssues(); return; }
      // The issue already exists here (it's being resolved, not raised),
      // so unlike the checklist page there's no need to wait for an id
      // to come back — it's already known.
      compressImage(photoFile).then(function (dataUrl) {
        return fetch(FN + "?action=attach", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ issue_id: id, added_by: me.id, image_data_url: dataUrl }),
        });
      }).then(function () { loadIssues(); })
        .catch(function () { alert("Fixed and recorded — the photo didn't upload, though. Nothing else was lost."); loadIssues(); });
    }).catch(function (e) { alert("Couldn't confirm — a fault in the page. (" + e.message + ")"); });
  };
</script>
<script>
  /* Root D-023. Registered on every page so each one is saved on the phone
     as it is visited. Failure is deliberately silent: an older browser with
     no service worker must still get a perfectly working online page. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body></html>
