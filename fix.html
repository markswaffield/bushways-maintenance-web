<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chobe Elephant Camp — Fix a Fault</title>
<style>
  body{font:16px/1.4 -apple-system,system-ui,sans-serif;margin:0;padding:16px 16px 64px;background:#F7F5F0;color:#232019}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:22px 0 8px;color:#5B5344;text-transform:uppercase;letter-spacing:.04em}
  .sub{color:#6B6455;font-size:13px;margin:0 0 4px}
  .nav{font-size:13px;margin:10px 0 0}
  label{display:block;font-size:13px;color:#5B5344;margin:14px 0 4px}
  select,input[type=text],textarea{width:100%;padding:10px;font-size:16px;border:1px solid #C9C2AC;border-radius:6px;box-sizing:border-box;background:#fff;font-family:inherit}
  button{padding:10px 16px;font-size:14px;font-weight:600;border:none;border-radius:6px;background:#43594A;color:#fff}
  button.secondary{background:#fff;border:1px solid #C9C2AC;color:#5B5344}
  button.small{padding:7px 12px;font-size:13px}
  .card{background:#fff;border:1px solid #E3DFD3;border-radius:8px;padding:12px 14px;margin-top:10px}
  .card .item{font-size:14.5px;font-weight:700;margin:0 0 4px}
  .card .fault{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:#F4E3D3;color:#8C6A2F;margin-right:6px}
  .card .meta{font-size:12.5px;color:#6B6455;margin:4px 0}
  .assign-row{display:flex;gap:8px;align-items:center;margin-top:8px}
  .assign-row select{flex:1}
  .assigned-label{font-size:12.5px;color:#43594A;font-weight:600;margin-top:6px}
  .fix-form{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #E3DFD3}
  .card.open .fix-form{display:block}
  .photos{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .photos a img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #E3DFD3;display:block}
  .notes{margin-top:8px}
  .note-line{background:#EFECE3;border-radius:6px;padding:6px 10px;font-size:13px;margin-top:4px}
  .note-line .note-who{font-weight:600;color:#5B5344}
  .note-add{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
  .note-add textarea{flex:1;font-size:14px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .empty{color:#8C6A2F;font-size:13.5px;font-style:italic;margin-top:10px}
  .loading{color:#6B6455;font-size:14px;margin-top:20px}
  [hidden]{display:none!important}
</style></head><body>

<div id="start">
  <h1>Fix a Fault</h1>
  <p class="sub">Chobe Elephant Camp — mark faults fixed, or assign them</p>
  <p class="nav"><a href="./dashboard.html">← To-do list</a> · <a href="./completed.html">Completed →</a></p>
  <label>Who are you?</label>
  <select id="person"><option value="">Loading…</option></select>
  <button id="startBtn" style="width:100%;margin-top:16px">Continue</button>
</div>

<div id="list" hidden></div>

<script>
  var FN = "https://uqfgkgmvnqiigtoymqbe.supabase.co/functions/v1/checklist";
  var people = [];
  var departments = [];
  var me = null;
  var lastIssues = [];
  var viewFilter = "";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeAgo(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return Math.round(mins / 1440) + "d ago";
  }

  fetch(FN).then(function (r) { return r.json(); }).then(function (data) {
    people = data.people;
    departments = data.departments || [];
    var p = document.getElementById("person");
    p.innerHTML = '<option value="">Select your name</option>' +
      people.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + (x.department ? ' — ' + esc(x.department) : '') + '</option>'; }).join("");
  }).catch(function (e) {
    document.getElementById("start").innerHTML = "<p>Couldn't load — a fault in the page, not your phone. (" + esc(e.message) + ")</p>";
  });

  document.getElementById("startBtn").onclick = function () {
    var id = document.getElementById("person").value;
    if (!id) { alert("Pick your name first."); return; }
    me = people.find(function (p) { return p.id === id; });
    // Defaults the view to their own department, per Mark, 2026-09-08 —
    // "makes it easy for a department to easily see what it needs to
    // focus on." Still switchable to any department, or "All", below.
    // Management defaults to "All" instead — triaging and handing out
    // work across every department is the actual job, not one queue.
    viewFilter = me.is_manager ? "" : (me.department || "");
    document.getElementById("start").hidden = true;
    document.getElementById("list").hidden = false;
    loadIssues();
  };

  function loadIssues() {
    var list = document.getElementById("list");
    list.innerHTML = '<h1>Fix a Fault</h1><p class="sub">Signed in as ' + esc(me.name) + (me.is_manager ? " (management)" : "") + '</p><p class="nav"><a href="./dashboard.html">← To-do list</a> · <a href="./completed.html">Completed →</a></p><p class="loading">Loading…</p>';
    fetch(FN + "?action=open_issues").then(function (r) { return r.json(); }).then(function (data) {
      lastIssues = data.issues;
      renderList(applyViewFilter());
    }).catch(function (e) {
      list.innerHTML += "<p>Couldn't load the list — a fault in the page. (" + e.message + ")</p>";
    });
  }

  function applyViewFilter() {
    if (!viewFilter) return lastIssues;
    if (viewFilter === "__unassigned__") return lastIssues.filter(function (i) { return !i.assigned_department; });
    return lastIssues.filter(function (i) { return i.assigned_department && i.assigned_department.name === viewFilter; });
  }

  window.setViewFilter = function (v) {
    viewFilter = v;
    renderList(applyViewFilter());
  };

  function renderList(issues) {
    var list = document.getElementById("list");
    var html = '<h1>Fix a Fault</h1><p class="sub">Signed in as ' + esc(me.name) + (me.is_manager ? " (management)" : "") + '</p><p class="nav"><a href="./dashboard.html">← To-do list</a> · <a href="./completed.html">Completed →</a></p>';

    // Lets a department see just its own queue — Mark, 2026-09-08.
    // Available to everyone, not only management: viewing your own
    // department's work is different from assigning someone else's.
    html += '<label>Show</label><select id="viewFilter" onchange="setViewFilter(this.value)">' +
      '<option value=""' + (!viewFilter ? " selected" : "") + '>All departments</option>' +
      '<option value="__unassigned__"' + (viewFilter === "__unassigned__" ? " selected" : "") + '>Unassigned</option>' +
      departments.map(function (d) {
        return '<option value="' + esc(d.name) + '"' + (viewFilter === d.name ? " selected" : "") + '>' + esc(d.name) + '</option>';
      }).join("") +
      '</select>';

    html += "<h2>Open faults <span style='color:#8C6A2F;font-weight:400'>" + issues.length + "</span></h2>";
    if (!issues.length) html += '<p class="empty">Nothing here' + (viewFilter ? " for this filter" : "") + '.</p>';

    issues.forEach(function (i) {
      html += '<div class="card" id="card-' + i.id + '">' +
        '<p class="item">' + esc(i.target) + ' — ' + esc(i.label) + (i.urgent ? ' <span class="fault" style="background:#F4CFC2;color:#A8502F">URGENT</span>' : '') + '</p>' +
        (i.fault_type ? '<span class="fault">' + esc(i.fault_type) + '</span>' : '') +
        (i.note || i.suggested_action ? esc(i.note || i.suggested_action) : '') +
        '<p class="meta">raised by ' + esc(i.raised_by) + ', ' + timeAgo(i.raised_at) + '</p>';

      if (i.audio_url) {
        html += '<audio controls src="' + esc(i.audio_url) + '" style="width:100%;margin-top:8px"></audio>';
      }
      if (i.photos && i.photos.length) {
        html += '<div class="photos">' + i.photos.map(function (url) {
          return '<a href="' + esc(url) + '" target="_blank"><img src="' + esc(url) + '"></a>';
        }).join("") + '</div>';
      }

      // Detail management adds for whoever picks this up — per Mark,
      // 2026-09-08: "add more detail before assigning the work." Shown
      // to everyone (it's for whoever does the fix), added by management
      // only, right alongside the assign control since that's the point
      // it's meant to be added at.
      if (i.notes && i.notes.length) {
        html += '<div class="notes">' + i.notes.map(function (n) {
          return '<p class="note-line"><span class="note-who">' + esc(n.by || "Unknown") + '</span> — ' + esc(n.text) + '</p>';
        }).join("") + '</div>';
      }

      if (i.assigned_department) {
        html += '<p class="assigned-label">Assigned to ' + esc(i.assigned_department.name) + '</p>';
      }
      if (me.is_manager) {
        html += '<div class="note-add"><textarea id="note-' + i.id + '" rows="1" placeholder="Add detail for whoever picks this up (optional)"></textarea>' +
          '<button class="small secondary" onclick="doAddNote(\'' + i.id + '\')">Add note</button></div>';
        // Assign to a department directly, per Mark, 2026-09-08 — not a
        // named person out of 40+ staff. Who actually does the work is
        // still captured, separately, when it's marked fixed below.
        html += '<div class="assign-row"><select id="assign-' + i.id + '">' +
          '<option value="">Unassigned</option>' +
          departments.map(function (d) {
            return '<option value="' + d.id + '"' + (i.assigned_department && i.assigned_department.id === d.id ? " selected" : "") + '>' + esc(d.name) + '</option>';
          }).join("") +
          '</select><button class="small secondary" onclick="doAssign(\'' + i.id + '\')">Assign</button></div>';
      }

      html += '<div class="actions">' +
        '<button class="small" onclick="toggleFix(\'' + i.id + '\')">Mark fixed</button>' +
        '</div>' +
        '<div class="fix-form">' +
        '<label>What was done?</label><textarea id="action-' + i.id + '" rows="2" placeholder="What actually fixed it"></textarea>' +
        '<label>Part used (optional)</label><input type="text" id="part-' + i.id + '" placeholder="e.g. SN352">' +
        '<label>Photo of the fix (optional)</label><input type="file" accept="image/*" capture="environment" id="photo-' + i.id + '">' +
        '<div class="actions"><button onclick="doResolve(\'' + i.id + '\')">Confirm fixed</button>' +
        '<button class="secondary" onclick="toggleFix(\'' + i.id + '\')">Cancel</button></div>' +
        '</div></div>';
    });

    list.innerHTML = html;
  }

  window.toggleFix = function (id) {
    document.getElementById("card-" + id).classList.toggle("open");
  };

  window.doAddNote = function (id) {
    var field = document.getElementById("note-" + id);
    var text = field.value.trim();
    if (!text) return;
    fetch(FN + "?action=attach", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ issue_id: id, added_by: me.id, note: text }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      loadIssues();
    }).catch(function (e) { alert("Couldn't add the note — a fault in the page. (" + e.message + ")"); });
  };

  window.doAssign = function (id) {
    var departmentId = document.getElementById("assign-" + id).value;
    fetch(FN + "?action=assign", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ issue_id: id, assigned_department_id: departmentId, by_person_id: me.id }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      loadIssues();
    }).catch(function (e) { alert("Couldn't assign — a fault in the page. (" + e.message + ")"); });
  };

  // Resized client-side before it ever leaves the phone — same reasoning
  // and same numbers as the checklist page's version of this.
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  window.doResolve = function (id) {
    var action = document.getElementById("action-" + id).value;
    var part = document.getElementById("part-" + id).value;
    var photoFile = document.getElementById("photo-" + id).files[0];
    fetch(FN + "?action=resolve", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ issue_id: id, resolved_by: me.id, actual_action_taken: action, actual_part_used: part }),
    }).then(function (r) { return r.json(); }).then(function (out) {
      if (out.error) { alert(out.error); return; }
      if (!photoFile) { loadIssues(); return; }
      // The issue already exists here (it's being resolved, not raised),
      // so unlike the checklist page there's no need to wait for an id
      // to come back — it's already known.
      compressImage(photoFile).then(function (dataUrl) {
        return fetch(FN + "?action=attach", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ issue_id: id, added_by: me.id, image_data_url: dataUrl }),
        });
      }).then(function () { loadIssues(); })
        .catch(function () { alert("Fixed and recorded — the photo didn't upload, though. Nothing else was lost."); loadIssues(); });
    }).catch(function (e) { alert("Couldn't confirm — a fault in the page. (" + e.message + ")"); });
  };
</script>
</body></html>
